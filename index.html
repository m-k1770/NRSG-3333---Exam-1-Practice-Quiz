d prolonged interval with every P wave conducted.", "Type II shows intermittent dropped beats without progressive PR lengthening.", "Third-degree block shows complete dissociation between P waves and QRS complexes."], "r": "First-degree heart block is a conduction delay at the AV node or bundle of His resulting in a PR interval longer than 0.20 seconds, but every impulse is still conducted to the ventricles (1:1 conduction).", "tip": "NCLEX Tip: Heart block poem: 'If the R is far from P, then you have FIRST degree.'"}, {"t": "mc", "q": "On an EKG, the nurse notices the PR interval progressively lengthens with each beat until a QRS complex is dropped, and then the cycle repeats. This is characteristic of:", "o": ["First-degree heart block", "Second-degree heart block, Type I (Wenckebach/Mobitz I)", "Second-degree heart block, Type II (Mobitz II)", "Third-degree (complete) heart block"], "a": [1], "e": ["First-degree block has a consistently prolonged, not progressively lengthening, PR interval.", "", "Type II shows a constant PR interval with sudden dropped beats, not progressive lengthening.", "Third-degree block shows complete AV dissociation, not a progressive pattern."], "r": "Second-degree heart block Type I (Wenckebach) is characterized by progressive lengthening of the PR interval until a QRS complex is dropped, after which the cycle of lengthening resumes.", "tip": "NCLEX Tip: Heart block poem: 'Longer, longer, longer, QRS drop, then you have WENCKEBACH.'"}, {"t": "mc", "q": "In second-degree heart block Type II (Mobitz II), the nurse would expect to see:", "o": ["A progressively lengthening PR interval before a dropped beat", "A constant PR interval with intermittent, unpredictable dropped QRS complexes", "Complete dissociation between P waves and QRS complexes", "No P waves at all"], "a": [1], "e": ["This progressive pattern describes Type I (Wenckebach), not Type II.", "", "Complete dissociation describes third-degree heart block, not Type II.", "P waves are present in Mobitz II; they are simply intermittently not conducted."], "r": "Mobitz II (second-degree heart block Type II) shows a constant PR interval with intermittent, non-progressive dropped QRS complexes, caused by a block within the bundle of His; it is considered more dangerous than Type I and often requires a pacemaker.", "tip": "NCLEX Tip: Heart block poem: 'If some P's just don't go through, then you have MOBITZ TWO.'"}, {"t": "mc", "q": "Third-degree (complete) heart block is characterized by:", "o": ["A prolonged but consistent PR interval with 1:1 conduction", "Complete dissociation between atrial (P wave) and ventricular (QRS) activity, each beating independently", "A sawtooth pattern of atrial activity", "An irregularly irregular rhythm with absent P waves"], "a": [1], "e": ["This describes first-degree block, not third-degree.", "", "This describes atrial flutter.", "This describes atrial fibrillation."], "r": "In third-degree (complete) heart block, no atrial impulses are conducted to the ventricles; the atria and ventricles beat independently of one another, often with the atria at 60-100 bpm and the ventricles at a much slower escape rate (30-45 bpm).", "tip": "NCLEX Tip: Heart block poem: 'If P's and Q's just don't agree, then you have THIRD degree.' Third-degree block is a medical emergency often requiring a pacemaker."}, {"t": "mc", "q": "A widened QRS complex (>0.12 sec) with either the left or right bundle branch intermittently or permanently blocked describes:", "o": ["First-degree heart block", "Bundle branch block", "Sinus arrhythmia", "Atrial flutter"], "a": [1], "e": ["First-degree block affects the PR interval, not QRS width due to bundle branch conduction.", "", "Sinus arrhythmia does not involve QRS widening.", "Atrial flutter does not typically involve QRS widening."], "r": "A bundle branch block occurs when conduction through the left or right bundle branch is blocked, resulting in a widened QRS complex greater than 0.12 seconds, best identified using a 12-lead EKG.", "tip": "NCLEX Tip: Widened QRS in the absence of a ventricular rhythm should raise suspicion for a bundle branch block — confirm with a 12-lead EKG."}, {"t": "fib", "q": "Fill in the blank: In third-degree heart block, the ventricles typically generate an escape rhythm at a rate of approximately ______ to 45 beats per minute.", "blanks": [["30", "thirty"]], "r": "In complete heart block, the ventricles generate their own intrinsic escape rhythm, typically at a slow rate of about 30-45 bpm, independent of the faster atrial rate.", "tip": "NCLEX Tip: A ventricular escape rhythm this slow (30-45 bpm) often causes symptomatic bradycardia and may require emergent pacing."}, {"t": "mc", "q": "Which cranial nerve is responsible for pupillary constriction and extraocular movement, and is often assessed when evaluating for increased intracranial pressure?", "o": ["Cranial nerve I (Olfactory)", "Cranial nerve III (Oculomotor)", "Cranial nerve VII (Facial)", "Cranial nerve XII (Hypoglossal)"], "a": [1], "e": ["Cranial nerve I is responsible for smell, not pupillary or eye movement function.", "", "Cranial nerve VII controls facial movement, not pupillary response.", "Cranial nerve XII controls tongue movement, not pupillary response."], "r": "Cranial nerve III (oculomotor) controls pupillary constriction and most extraocular movements; changes in pupil size/reactivity are an important early sign of increased intracranial pressure due to compression of this nerve.", "tip": "NCLEX Tip: Pupillary changes (sluggish, unequal, or fixed and dilated) are a hallmark neurological deterioration sign tied to cranial nerve III compression."}, {"t": "mc", "q": "A patient's Glasgow Coma Scale (GCS) score is 7. This score indicates:", "o": ["Full alertness and orientation", "A comatose state requiring urgent neurological evaluation", "Mild confusion only", "Normal neurological function"], "a": [1], "e": ["A GCS of 15 indicates full alertness; a score of 7 indicates severe impairment.", "", "A GCS this low indicates far more than mild confusion.", "This score is markedly abnormal and requires urgent intervention."], "r": "A GCS score of 8 or below is generally considered indicative of coma and warrants urgent neurological evaluation and consideration of airway protection.", "tip": "NCLEX Tip: GCS ≤ 8 = coma / consider intubation for airway protection. Remember the maximum score is 15 (Eye 4 + Verbal 5 + Motor 6)."}, {"t": "mc", "q": "Which of the following is an EARLY sign of increasing intracranial pressure (ICP)?", "o": ["Fixed and dilated pupils bilaterally", "Restlessness, disorientation, and increased respiratory effort", "Cheyne-Stokes respirations", "Decorticate or decerebrate posturing"], "a": [1], "e": ["This is a late, ominous sign of ICP, not an early one.", "", "This is a late sign of ICP.", "This is a late sign of ICP."], "r": "Early signs of increasing ICP include restlessness, disorientation, mental confusion, and increased respiratory effort, as brain cells responsible for cognition are highly sensitive to decreased oxygenation.", "tip": "NCLEX Tip: Early ICP signs = subtle mental status changes (restlessness, confusion). Late ICP signs = pupillary changes, posturing, Cushing's triad (increased BP, widened pulse pressure, bradycardia, irregular respirations)."}, {"t": "mc", "q": "Which finding represents a LATE sign of increased intracranial pressure?", "o": ["Mild headache", "Slight disorientation", "Widening pulse pressure, bradycardia, and irregular respirations (Cushing's triad)", "Slightly increased respiratory rate"], "a": [2], "e": ["This is a mild, nonspecific early symptom, not the classic late sign described.", "This reflects an early, more subtle change.", "", "This is consistent with an early, not late, presentation."], "r": "Cushing's triad — widening pulse pressure, bradycardia, and irregular respirations — is a classic late and ominous sign of significantly increased intracranial pressure and impending herniation.", "tip": "NCLEX Tip: Cushing's triad = increased systolic BP with widened pulse pressure + bradycardia + irregular respirations — a critical late finding requiring immediate intervention."}, {"t": "mc", "q": "A patient with increased ICP develops Cheyne-Stokes respirations. The nurse understands this breathing pattern is characterized by:", "o": ["A consistently normal breathing rate and depth", "Rhythmic waxing and waning of respiratory rate and depth alternating with brief periods of apnea", "Rapid, shallow breathing only", "Complete absence of any respiratory effort"], "a": [1], "e": ["Cheyne-Stokes is an abnormal, not normal, breathing pattern.", "", "This does not capture the waxing/waning cyclical nature of Cheyne-Stokes respirations.", "Cheyne-Stokes includes periods of apnea but is not a complete, permanent absence of breathing."], "r": "Cheyne-Stokes respirations involve a cyclical pattern of gradually increasing then decreasing respiratory rate and depth, followed by a period of apnea, and are associated with severe neurological impairment or brainstem dysfunction.", "tip": "NCLEX Tip: Distinguish Cheyne-Stokes (cyclical waxing/waning + apnea) from ataxic breathing (irregular, unpredictable pattern with no clear cycle) — both are late, ominous neuro signs."}, {"t": "mc", "q": "Projectile vomiting in a patient with increased intracranial pressure occurs due to increased pressure on which area?", "o": ["The cerebellum only", "The reflex center in the medulla", "The frontal lobe", "The spinal cord"], "a": [1], "e": ["While cerebellar involvement can affect coordination, projectile vomiting specifically relates to the medulla's reflex center.", "", "The frontal lobe is associated with personality/executive function changes, not the vomiting reflex.", "The spinal cord is not the site responsible for the vomiting reflex."], "r": "Projectile vomiting associated with increased ICP occurs due to pressure on the vomiting reflex center located in the medulla oblongata.", "tip": "NCLEX Tip: Projectile vomiting (without preceding nausea) is a classic red-flag sign of increased ICP and should prompt urgent neurological assessment."}, {"t": "sata", "q": "Which findings would the nurse recognize as early signs of increasing intracranial pressure? Select all that apply.", "o": ["Restlessness and disorientation", "Purposeless movements", "Fixed, dilated, and nonreactive pupils bilaterally", "Headache that worsens with straining or movement", "Bilateral flaccidity"], "a": [0, 1, 3], "e": ["", "", "Bilateral fixed and dilated pupils represent a late, ominous sign, not an early one.", "", "Bilateral flaccidity is a very late sign occurring just before death."], "r": "Early signs of increased ICP include restlessness, disorientation, purposeless movements, mental confusion, and a headache aggravated by movement or straining, reflecting early cerebral hypoxia and pressure on pain-sensitive structures.", "tip": "NCLEX Tip: Sort ICP findings into 'early' (subtle mental status/behavioral changes) versus 'late' (pupillary, motor, vital sign, and brainstem reflex changes) categories."}, {"t": "mc", "q": "The nurse is assessing cranial nerve function and asks the patient to smile, puff out their cheeks, and raise their eyebrows. Which cranial nerve is being assessed?", "o": ["Cranial nerve V (Trigeminal)", "Cranial nerve VII (Facial)", "Cranial nerve IX (Glossopharyngeal)", "Cranial nerve XI (Accessory)"], "a": [1], "e": ["Cranial nerve V governs facial sensation and mastication, not the described motor movements.", "", "Cranial nerve IX is involved in swallowing and taste, not facial expression.", "Cranial nerve XI controls the trapezius and sternocleidomastoid muscles (shoulder shrug/head turning), not facial expression."], "r": "Cranial nerve VII (facial) controls the muscles of facial expression; assessment includes asking the patient to smile, puff cheeks, raise eyebrows, and close eyes tightly.", "tip": "NCLEX Tip: CN VII assessment tests symmetry of facial movement — asymmetry can indicate conditions such as Bell's palsy or stroke."}, {"t": "mc", "q": "Loss of brainstem reflexes such as pupillary, corneal, gag, and swallowing reflexes in a patient with severe increased ICP is considered:", "o": ["A benign, expected finding requiring no action", "An ominous sign of approaching death", "A sign of improving neurological status", "Unrelated to intracranial pressure"], "a": [1], "e": ["This is a critical, not benign, finding.", "", "Loss of brainstem reflexes indicates severe deterioration, not improvement.", "This finding is directly related to severe, advanced increases in intracranial pressure."], "r": "The loss of brainstem reflexes (pupillary, corneal, gag, swallowing) is an ominous, late sign of severe neurological deterioration and approaching death in the setting of increased ICP.", "tip": "NCLEX Tip: Loss of brainstem reflexes is one of the most severe findings possible and should prompt immediate escalation of care."}, {"t": "mc", "q": "A nurse grades a patient's motor strength assessment and notes weakness in the left arm and leg only. This finding, in the context of increased ICP, most likely indicates compression of which structure?", "o": ["The optic nerve", "The pyramidal tracts", "The auditory nerve", "The olfactory bulb"], "a": [1], "e": ["The optic nerve relates to vision, not motor strength.", "", "The auditory nerve relates to hearing, not motor strength.", "The olfactory bulb relates to smell, not motor strength."], "r": "Weakness in one extremity or on one side of the body (hemiparesis) with increased ICP occurs due to compression of the pyramidal (corticospinal) tracts, which carry motor signals from the brain.", "tip": "NCLEX Tip: Unilateral weakness with increasing ICP reflects pyramidal tract compression and should be monitored closely for progression."}, {"t": "bowtie", "q": "A patient's cardiac monitor shows a rate of 160 bpm, absent P waves, and an irregularly irregular rhythm with a normal QRS width. The patient reports palpitations and mild lightheadedness but has a stable blood pressure.", "conditionOptions": ["Atrial fibrillation with rapid ventricular response", "Ventricular fibrillation", "Third-degree heart block", "Sinus tachycardia"], "correctCondition": 0, "conditionExplain": ["", "VFib has no organized QRS complexes at all, unlike the normal QRS described here.", "Third-degree block shows P-QRS dissociation, not the description given.", "Sinus tachycardia has a regular rhythm with normal P waves, not absent P waves and irregular rhythm."], "actions": ["Notify the provider of the rhythm change", "Prepare for immediate defibrillation", "Obtain a 12-lead EKG and assess vital signs closely", "Administer a stat sedative and allow the patient to sleep it off", "Anticipate an order for rate-control medication"], "correctActions": [0, 2], "actionsExplain": ["", "This is a stable, non-shockable rhythm; defibrillation is not indicated.", "", "Sedation does not address the underlying arrhythmia and delays appropriate care.", "This is an appropriate anticipated intervention, but notifying the provider and gathering further diagnostic/vital sign data are the more immediate priority actions."], "monitor": ["Heart rate and rhythm trends on the monitor", "Blood pressure and signs of hemodynamic instability", "Blood glucose every 15 minutes", "Signs of stroke risk given the irregular atrial rhythm"], "correctMonitor": [0, 1], "monitorExplain": ["", "", "Frequent glucose monitoring is not indicated by this cardiac scenario.", "While AFib carries long-term stroke risk, this is not a top priority monitoring parameter in the immediate/acute nursing assessment compared to rhythm and hemodynamic status."], "r": "This presentation (irregularly irregular, absent P waves, normal QRS, tachycardic) is classic for atrial fibrillation with rapid ventricular response. Priority actions include notifying the provider, obtaining further diagnostic data, and anticipating rate control, while closely monitoring hemodynamic stability.", "tip": "NCLEX Tip: In bowtie questions, match the rhythm characteristics precisely to the condition before selecting actions — a hasty diagnosis choice will cascade into wrong actions and monitoring parameters.", "actionsCount": 2, "monitorCount": 2}, {"t": "mc", "q": "Which best describes the relationship between stroke volume and cardiac output?", "o": ["Stroke volume is unrelated to cardiac output", "Cardiac output equals stroke volume divided by heart rate", "Cardiac output equals stroke volume multiplied by heart rate", "Stroke volume only matters during diastole"], "a": [2], "e": ["", "This is an inverted, incorrect formula.", "", "Stroke volume reflects the volume ejected during systole, not solely a diastolic measure."], "r": "Cardiac output is the product of stroke volume (the amount of blood ejected per beat) and heart rate (beats per minute), reflecting total blood flow per minute.", "tip": "NCLEX Tip: CO = SV x HR. A drop in either value without compensation from the other will reduce cardiac output and tissue perfusion."}, {"t": "mc", "q": "Which factor would most directly increase peripheral vascular resistance and thus increase cardiac workload?", "o": ["Vasodilation of peripheral arteries", "Vasoconstriction of peripheral arteries", "Decreased blood viscosity", "Decreased blood volume"], "a": [1], "e": ["Vasodilation decreases, not increases, peripheral vascular resistance.", "", "Decreased viscosity would decrease resistance, not increase it.", "Decreased blood volume does not directly increase vascular resistance in the same way vasoconstriction does."], "r": "Vasoconstriction narrows the diameter of peripheral arteries, increasing resistance to blood flow and thus increasing the workload on the heart to maintain adequate cardiac output.", "tip": "NCLEX Tip: Vasoconstriction increases afterload/resistance; vasodilation decreases it — key concepts for understanding blood pressure regulation."}, {"t": "mc", "q": "A nurse palpates a patient's PMI and notes it is displaced laterally to the anterior axillary line. This finding suggests:", "o": ["A normal variant requiring no further evaluation", "Possible cardiomegaly or ventricular hypertrophy", "Aortic stenosis", "Pericarditis"], "a": [1], "e": ["Lateral displacement of the PMI is an abnormal finding.", "", "Aortic stenosis is diagnosed by auscultation findings, not primarily PMI location.", "Pericarditis is typically identified by a pericardial friction rub, not PMI displacement."], "r": "A PMI displaced laterally from its normal 5th intercostal space, midclavicular line location suggests cardiac enlargement, such as from ventricular hypertrophy or cardiomegaly.", "tip": "NCLEX Tip: PMI location changes are a key physical exam clue for cardiac enlargement — know the normal landmark well."}, {"t": "mc", "q": "Which technique should the nurse use to assess for a thrill during cardiac palpation?", "o": ["Use the bell of the stethoscope", "Use the ball of the hand or fingers to feel for a palpable vibration", "Percuss the chest wall", "Auscultate with the diaphragm only"], "a": [1], "e": ["The stethoscope is used for auscultation, not palpation of a thrill.", "", "Percussion is not the technique used to detect a thrill.", "Auscultation techniques are separate from palpation for a thrill."], "r": "A thrill is a palpable vibration caused by turbulent blood flow, best detected using the palm or fingers over the precordium, often correlating with a loud murmur (grade IV or higher).", "tip": "NCLEX Tip: Thrills are palpated, not auscultated — pair this with the corresponding murmur grade (IV+) for a complete assessment."}, {"t": "mc", "q": "Which assessment finding would be most concerning in a patient with suspected arterial insufficiency of the lower extremities?", "o": ["2+ pulses bilaterally", "Diminished or absent pedal pulses with pallor on elevation", "Warm, pink extremities", "Capillary refill less than 2 seconds"], "a": [1], "e": ["This is a normal finding.", "", "This is a normal, reassuring finding.", "This is a normal finding."], "r": "Diminished or absent pulses along with pallor upon elevation are classic signs of arterial insufficiency, reflecting inadequate arterial blood flow to the extremity.", "tip": "NCLEX Tip: Arterial insufficiency = diminished pulses, pallor with elevation, cool extremity, and often pain; venous insufficiency = normal/present pulses, edema, brownish discoloration, and aching."}, {"t": "mc", "q": "A patient with chronic venous insufficiency would most likely present with which finding?", "o": ["Cool, pale extremities with diminished pulses", "Brownish skin discoloration and edema, especially near the ankles", "Sudden onset of severe unilateral leg pain and pallor", "Absent pulses bilaterally"], "a": [1], "e": ["This describes arterial insufficiency, not venous insufficiency.", "", "This describes an acute arterial occlusion, not chronic venous insufficiency.", "Pulses are typically preserved in venous insufficiency."], "r": "Chronic venous insufficiency often presents with edema, brownish (hemosiderin) skin discoloration, and aching, especially in the lower legs and ankles, due to impaired venous return.", "tip": "NCLEX Tip: Distinguish arterial disease (pain, pallor, pulselessness, cool) from venous disease (edema, brown discoloration, normal pulses) using the classic presentation patterns."}, {"t": "mc", "q": "Which auscultation finding would suggest carotid artery stenosis?", "o": ["A bruit heard over the carotid artery", "A normal S1 and S2", "Absence of any sound over the carotid", "A murmur heard only at the cardiac apex"], "a": [0], "e": ["", "This is a normal, expected finding, not indicative of stenosis.", "Absence of sound does not indicate stenosis; a bruit indicates turbulent flow.", "Apex murmurs relate to mitral valve pathology, not carotid stenosis."], "r": "A carotid bruit is a turbulent, whooshing sound heard on auscultation over the carotid artery, suggesting significant narrowing (stenosis) and increased stroke risk.", "tip": "NCLEX Tip: Carotid bruits warrant further diagnostic workup (e.g., carotid ultrasound) due to associated stroke risk."}, {"t": "mc", "q": "Mid-systolic click followed by a late systolic murmur at the apex is most characteristic of:", "o": ["Aortic stenosis", "Mitral valve prolapse", "Tricuspid regurgitation", "Pulmonic stenosis"], "a": [1], "e": ["Aortic stenosis produces a crescendo-decrescendo murmur without a mid-systolic click.", "", "Tricuspid regurgitation does not classically present with a mid-systolic click.", "Pulmonic stenosis is heard at the pulmonic area, not with this classic click-murmur combination at the apex."], "r": "Mitral valve prolapse classically produces a mid-systolic click followed by a late systolic murmur, best heard at the apex, due to prolapse of the mitral valve leaflet during systole.", "tip": "NCLEX Tip: The 'click-murmur' combination at the apex is a hallmark finding for mitral valve prolapse."}, {"t": "mc", "q": "A pericardial friction rub is best described as:", "o": ["A soft, blowing diastolic murmur", "A high-pitched, scratchy sound heard throughout the cardiac cycle, often position-dependent", "A low-pitched rumble heard only in diastole", "A sound only heard with the bell of the stethoscope"], "a": [1], "e": ["This describes aortic regurgitation, not a friction rub.", "", "A friction rub is not confined to diastole; it can be heard throughout the cycle.", "A friction rub is typically best heard with the diaphragm, not the bell."], "r": "A pericardial friction rub is a high-pitched, scratchy sound caused by inflamed pericardial layers rubbing together, often heard throughout the cardiac cycle and may change with patient position or respiration.", "tip": "NCLEX Tip: A friction rub suggests pericarditis and is best heard with the diaphragm, with the patient leaning forward."}, {"t": "mc", "q": "Which action should the nurse take when auscultating for orthostatic blood pressure changes?", "o": ["Measure blood pressure only in the supine position", "Measure blood pressure and heart rate in supine, sitting, and standing positions, waiting between each", "Measure blood pressure only while standing", "Measure blood pressure immediately after position change without waiting"], "a": [1], "e": ["Only checking supine position does not assess for orthostatic changes.", "", "Checking standing alone does not allow comparison to baseline.", "Waiting an appropriate interval (about 1-3 minutes) after each position change improves accuracy of orthostatic vital sign assessment."], "r": "Assessing for orthostatic hypotension requires measuring blood pressure and heart rate in supine, sitting, and standing positions, waiting an appropriate interval between each to allow for hemodynamic adjustment.", "tip": "NCLEX Tip: Rushing orthostatic vital sign measurement without adequate waiting time between positions can produce inaccurate results."}, {"t": "mc", "q": "Which EKG lead is typically used for continuous bedside cardiac monitoring to best visualize the P wave?", "o": ["Lead II", "Lead aVR", "Lead V1 only", "Lead III exclusively"], "a": [0], "e": ["", "aVR is not the typical lead of choice for continuous monitoring.", "V1 is useful for certain rhythm distinctions but Lead II is the standard choice for general monitoring.", "Lead III alone is not the standard monitoring lead."], "r": "Lead II is commonly used for continuous cardiac monitoring because it typically provides a clear view of the P wave, aiding in rhythm identification.", "tip": "NCLEX Tip: Lead II is the default monitoring lead in most clinical settings due to its clear P wave visualization."}, {"t": "mc", "q": "A patient's rhythm strip shows a heart rate that varies from beat to beat, but P waves are present and normal before each QRS, and the variation correlates with the respiratory cycle. This is:", "o": ["Atrial fibrillation", "Sinus arrhythmia", "Ventricular tachycardia", "Third-degree heart block"], "a": [1], "e": ["AFib has absent P waves and an irregularly irregular pattern unrelated to respiration.", "", "VT presents with a wide QRS and a fast, usually regular rate, not this pattern.", "Third-degree block shows P-QRS dissociation, not simple rate variation with respiration."], "r": "Sinus arrhythmia is characterized by a normal sinus pattern with cyclical variation in heart rate correlating with the respiratory cycle, and is usually a benign, normal finding.", "tip": "NCLEX Tip: Rate variation tied to breathing with otherwise normal P-QRS-T morphology is the hallmark of (usually benign) sinus arrhythmia."}, {"t": "mc", "q": "Which medication class is used to slow AV nodal conduction and control the ventricular rate in atrial fibrillation?", "o": ["Beta-blockers", "Loop diuretics", "Proton pump inhibitors", "Antiemetics"], "a": [0], "e": ["", "Diuretics manage fluid balance, not heart rate/rhythm control.", "PPIs manage acid reflux, unrelated to cardiac rhythm.", "Antiemetics manage nausea, unrelated to cardiac rhythm."], "r": "Beta-blockers (and calcium channel blockers) slow conduction through the AV node, helping control the ventricular response rate in atrial fibrillation and other supraventricular tachyarrhythmias.", "tip": "NCLEX Tip: Beta-blockers and calcium channel blockers (diltiazem, verapamil) are first-line for rate control in AFib."}, {"t": "mc", "q": "Amiodarone is classified as which type of antiarrhythmic and requires monitoring of which organ systems with long-term use?", "o": ["Class I; monitor renal function only", "Class III; monitor thyroid, liver, and pulmonary function", "Class II; monitor only blood glucose", "Class IV; monitor only blood pressure"], "a": [1], "e": ["Amiodarone is a Class III antiarrhythmic, not Class I, and requires broader monitoring than renal function alone.", "", "Amiodarone is Class III, not Class II, and requires monitoring of thyroid, liver, and pulmonary function.", "Amiodarone is Class III, not Class IV."], "r": "Amiodarone is a Class III antiarrhythmic that requires long-term monitoring of thyroid, liver, and pulmonary function due to its potential for toxicity in these organ systems, in addition to monitoring for QT prolongation.", "tip": "NCLEX Tip: Amiodarone's broad organ toxicity profile (thyroid, liver, lungs, eyes, skin) is a frequently tested detail."}, {"t": "mc", "q": "Synchronized cardioversion differs from defibrillation in that it:", "o": ["Delivers a shock timed to the R wave to avoid the vulnerable T wave period", "Is used only for asystole", "Requires no patient sedation ever", "Is always higher energy than defibrillation"], "a": [0], "e": ["", "Cardioversion is not used for asystole, which is a non-shockable rhythm.", "Sedation is often used for elective synchronized cardioversion in conscious patients.", "Cardioversion energy levels are typically lower than defibrillation, not higher."], "r": "Synchronized cardioversion delivers an electrical shock timed to the R wave of the QRS complex, avoiding the vulnerable T wave period that could otherwise trigger a dangerous arrhythmia such as VFib.", "tip": "NCLEX Tip: Cardioversion = synchronized, for organized rhythms with a pulse (e.g., unstable AFib/SVT); Defibrillation = unsynchronized, for pulseless VT/VF."}, {"t": "mc", "q": "A pacemaker is most appropriately indicated for which condition?", "o": ["Symptomatic bradycardia or high-degree heart block", "Ventricular fibrillation", "Sinus tachycardia", "Atrial fibrillation with a controlled rate"], "a": [0], "e": ["", "VFib requires defibrillation, not a pacemaker as first-line emergency treatment.", "Sinus tachycardia is typically managed by treating the underlying cause, not with a pacemaker.", "Controlled-rate AFib does not typically require pacemaker placement."], "r": "Pacemakers deliver an electrical impulse to stimulate cardiac contraction and are indicated for symptomatic bradycardia, high-degree/complete heart block, and other conduction disturbances causing inadequate heart rate.", "tip": "NCLEX Tip: Pacemakers treat rhythms that are too slow; ICDs treat/prevent life-threatening tachyarrhythmias (VT/VF)."}, {"t": "mc", "q": "An implantable cardioverter-defibrillator (ICD) is primarily used to:", "o": ["Continuously pace a normally functioning heart", "Automatically detect and treat life-threatening ventricular tachyarrhythmias", "Replace the need for antiarrhythmic medications entirely", "Treat only atrial fibrillation"], "a": [1], "e": ["ICDs are specifically for detecting and treating dangerous tachyarrhythmias, not for pacing a normally functioning heart continuously in the same way a pacemaker does for bradycardia.", "", "Medications are often still used alongside an ICD, not eliminated by it.", "ICDs primarily target ventricular tachyarrhythmias (VT/VF), not atrial fibrillation specifically."], "r": "An ICD continuously monitors cardiac rhythm and automatically delivers therapy (pacing or shock) to terminate life-threatening ventricular tachycardia or fibrillation.", "tip": "NCLEX Tip: ICDs are for patients at high risk of sudden cardiac death from ventricular arrhythmias, often after a cardiac arrest or with significant structural heart disease."}, {"t": "mc", "q": "Which cranial nerve is responsible for the sense of smell?", "o": ["Cranial nerve I (Olfactory)", "Cranial nerve II (Optic)", "Cranial nerve VIII (Vestibulocochlear)", "Cranial nerve X (Vagus)"], "a": [0], "e": ["", "Cranial nerve II is responsible for vision.", "Cranial nerve VIII is responsible for hearing and balance.", "Cranial nerve X has multiple functions including swallowing and parasympathetic innervation, not smell."], "r": "Cranial nerve I (olfactory) is a purely sensory nerve responsible for the sense of smell, typically tested by having the patient identify familiar scents with eyes closed, one nostril at a time.", "tip": "NCLEX Tip: CN I is tested using familiar, non-irritating scents (coffee, vanilla) — one nostril at a time with eyes closed."}, {"t": "mc", "q": "Which cranial nerve assessment involves checking visual acuity and visual fields?", "o": ["Cranial nerve I", "Cranial nerve II", "Cranial nerve III", "Cranial nerve IV"], "a": [1], "e": ["CN I assesses smell, not vision.", "", "CN III is primarily assessed by pupillary response and eye movement.", "CN IV assesses downward and inward eye movement."], "r": "Cranial nerve II (optic) is assessed through visual acuity testing (e.g., Snellen chart) and visual field testing, as it is responsible for vision.", "tip": "NCLEX Tip: CN II (optic) = vision; CN III, IV, VI = eye movement and pupillary response."}, {"t": "mc", "q": "Which combination of cranial nerves is responsible for eye movement?", "o": ["I, II, V", "III, IV, VI", "VII, VIII, IX", "X, XI, XII"], "a": [1], "e": ["CN I is smell, CN II is vision, and CN V is facial sensation/mastication — not primarily eye movement.", "", "These nerves are responsible for facial expression, hearing/balance, and swallowing/taste, not eye movement.", "These nerves are responsible for swallowing, speech, shoulder/neck movement, and tongue movement, not eye movement."], "r": "Cranial nerves III (oculomotor), IV (trochlear), and VI (abducens) work together to control the extraocular muscles responsible for eye movement.", "tip": "NCLEX Tip: III, IV, VI = eye movement trio; assess together by having the patient follow your finger through the six cardinal gaze positions."}, {"t": "mc", "q": "A nurse assesses cranial nerve XI by asking the patient to:", "o": ["Stick out their tongue", "Shrug their shoulders against resistance", "Smile and puff out their cheeks", "Follow a moving finger with their eyes"], "a": [1], "e": ["This assesses cranial nerve XII (hypoglossal).", "", "This assesses cranial nerve VII (facial).", "This assesses cranial nerves III, IV, and VI (eye movement)."], "r": "Cranial nerve XI (accessory) is assessed by having the patient shrug their shoulders against resistance (trapezius) and turn their head against resistance (sternocleidomastoid).", "tip": "NCLEX Tip: CN XI controls the trapezius and sternocleidomastoid muscles — think 'shoulder shrug and head turn.'"}, {"t": "mc", "q": "Which cranial nerve is responsible for the gag reflex, along with cranial nerve X?", "o": ["Cranial nerve VII", "Cranial nerve VIII", "Cranial nerve IX", "Cranial nerve XII"], "a": [2], "e": ["CN VII controls facial expression, not the gag reflex.", "CN VIII controls hearing/balance, not the gag reflex.", "", "CN XII controls tongue movement, not the gag reflex."], "r": "Cranial nerve IX (glossopharyngeal), along with cranial nerve X (vagus), is responsible for the gag reflex, swallowing, and taste sensation on the posterior third of the tongue.", "tip": "NCLEX Tip: CN IX and X work together for swallowing and the gag reflex — test them together by observing the gag reflex and swallowing ability."}, {"t": "mc", "q": "A patient with a suspected stroke is unable to smile symmetrically, with drooping on one side of the face. This finding is most associated with dysfunction of which cranial nerve?", "o": ["Cranial nerve V", "Cranial nerve VII", "Cranial nerve IX", "Cranial nerve XI"], "a": [1], "e": ["CN V is responsible for facial sensation and chewing, not facial symmetry/expression.", "", "CN IX is primarily responsible for swallowing and taste, not facial symmetry.", "CN XI is responsible for shoulder and neck movement, not facial symmetry."], "r": "Cranial nerve VII (facial) controls the muscles of facial expression; asymmetric facial drooping suggests dysfunction of this nerve, which is a classic finding in stroke and Bell's palsy assessments.", "tip": "NCLEX Tip: Facial asymmetry (drooping, uneven smile) is a hallmark CN VII finding and a key component of stroke screening tools like FAST."}, {"t": "mc", "q": "Which of the following is part of the Glasgow Coma Scale (GCS) assessment?", "o": ["Blood pressure and heart rate", "Eye opening, verbal response, and motor response", "Deep tendon reflexes", "Pupil size only"], "a": [1], "e": ["Vital signs are not part of the GCS scoring itself, though they are important neuro assessment data.", "", "Deep tendon reflexes are not part of the GCS.", "Pupil assessment is a separate component of neuro assessment, not part of the GCS score itself."], "r": "The Glasgow Coma Scale evaluates three components: eye opening (maximum 4), verbal response (maximum 5), and motor response (maximum 6), for a maximum total score of 15.", "tip": "NCLEX Tip: Practice scoring sample GCS scenarios — know the maximum points for each of the three categories (E4 V5 M6)."}, {"t": "mc", "q": "A patient's GCS assessment shows: eyes open to pain (2), incomprehensible sounds (2), and abnormal flexion/decorticate posturing (3). What is the total GCS score?", "o": ["5", "7", "9", "11"], "a": [1], "e": ["This total does not correctly sum the given component scores (2+2+3).", "", "This total does not correctly sum the given component scores.", "This total does not correctly sum the given component scores."], "r": "Adding the component scores: eye opening (2) + verbal response (2) + motor response (3) = a total GCS score of 7, indicating a comatose state requiring urgent evaluation.", "tip": "NCLEX Tip: Practice adding GCS component scores accurately — this is a common calculation-style NCLEX question."}, {"t": "mc", "q": "Decorticate posturing is characterized by:", "o": ["Extension of the arms and legs", "Flexion of the arms with extension of the legs", "Complete flaccidity of all extremities", "Normal purposeful movement"], "a": [1], "e": ["This describes decerebrate posturing, not decorticate.", "", "Complete flaccidity is a separate, even more severe late finding.", "Posturing indicates an abnormal, not normal, motor response."], "r": "Decorticate posturing involves flexion of the arms, wrists, and fingers with adduction of the arms, while the legs are extended, indicating damage above the brainstem (cerebral hemispheres).", "tip": "NCLEX Tip: Decorticate = 'to the core' (arms flex inward toward the core); decerebrate = rigid extension of all extremities, indicating more severe brainstem involvement."}, {"t": "mc", "q": "Decerebrate posturing is characterized by:", "o": ["Flexion of the arms and extension of the legs", "Rigid extension of the arms and legs with the toes pointed downward", "Complete lack of any motor response", "Purposeful localization to painful stimuli"], "a": [1], "e": ["This describes decorticate posturing, not decerebrate.", "", "This describes flaccidity, a distinct and more severe finding.", "This describes a normal, higher-functioning motor response."], "r": "Decerebrate posturing involves rigid extension of the arms and legs with the toes pointed downward, indicating more severe brainstem dysfunction than decorticate posturing.", "tip": "NCLEX Tip: Decerebrate posturing indicates a worse neurological prognosis than decorticate posturing, reflecting more extensive brainstem involvement."}, {"t": "mc", "q": "A CT scan is most useful in the acute assessment of a suspected stroke because it can quickly:", "o": ["Measure blood glucose levels", "Identify hemorrhage versus ischemic changes to guide emergent treatment decisions", "Assess cardiac rhythm", "Evaluate kidney function"], "a": [1], "e": ["CT scan does not measure blood glucose.", "", "CT scan does not assess cardiac rhythm.", "CT scan does not evaluate kidney function."], "r": "A non-contrast CT scan is the first-line imaging test in acute stroke assessment because it rapidly distinguishes hemorrhagic stroke from ischemic stroke, which is critical for determining whether thrombolytic therapy is appropriate.", "tip": "NCLEX Tip: CT scan without contrast is the go-to initial imaging for suspected acute stroke due to its speed and ability to rule out hemorrhage."}, {"t": "mc", "q": "Which diagnostic test is contraindicated in a patient with significantly increased intracranial pressure due to the risk of herniation?", "o": ["CT scan", "MRI", "Lumbar puncture", "EEG"], "a": [2], "e": ["CT scan is not contraindicated and is often used to help diagnose increased ICP.", "MRI is not typically contraindicated for suspected increased ICP.", "", "EEG is not contraindicated in the setting of increased ICP."], "r": "Lumbar puncture is contraindicated in patients with significantly increased intracranial pressure because sudden removal of cerebrospinal fluid can precipitate brain herniation.", "tip": "NCLEX Tip: Always check for signs of increased ICP before a lumbar puncture is performed — this is a critical safety consideration."}, {"t": "mc", "q": "An EEG (electroencephalogram) is primarily used to diagnose which condition?", "o": ["Myocardial infarction", "Seizure disorders", "Peripheral neuropathy", "Deep vein thrombosis"], "a": [1], "e": ["EEG assesses brain electrical activity, unrelated to cardiac diagnosis.", "", "EEG records the brain's electrical activity, making it the primary tool for diagnosing seizure disorders.", "EEG is unrelated to vascular/clotting diagnoses."], "r": "An EEG records the brain's electrical activity and is primarily used to diagnose and characterize seizure disorders, as well as certain other neurological conditions.", "tip": "NCLEX Tip: EEG = brain electrical activity/seizures; EKG = heart electrical activity/arrhythmias — don't confuse the two despite similar names."}, {"t": "sata", "q": "Which of the following are appropriate nursing actions when caring for a patient with a suspected acute stroke? Select all that apply.", "o": ["Obtain a stat non-contrast CT scan", "Assess for symptom onset time", "Administer oral food and fluids immediately to prevent dehydration", "Perform a focused neurologic assessment (e.g., NIH Stroke Scale)", "Delay all interventions until family arrives"], "a": [0, 1, 3], "e": ["", "", "Swallowing should be assessed before giving anything by mouth due to aspiration risk in acute stroke.", "", "Time-sensitive interventions should not be delayed for family arrival in a suspected acute stroke."], "r": "Priority actions for a suspected acute stroke include obtaining a stat CT scan, determining exact symptom onset time (critical for treatment eligibility), and performing a focused neurologic assessment, while avoiding oral intake until swallow function is assessed.", "tip": "NCLEX Tip: 'Time is brain' — acute stroke care prioritizes rapid assessment and imaging without unnecessary delays."}, {"t": "mc", "q": "Which of the following best describes the purpose of cerebral angiography?", "o": ["To measure blood glucose in real time", "To visualize cerebral blood vessels for conditions like aneurysm or arteriovenous malformation", "To assess hearing function", "To evaluate cardiac valve function"], "a": [1], "e": ["", "", "Hearing is assessed by other methods (e.g., audiometry), not cerebral angiography.", "Cardiac valve function is assessed by echocardiography, not cerebral angiography."], "r": "Cerebral angiography uses contrast dye and imaging to visualize the cerebral blood vessels, helping diagnose conditions such as aneurysms, arteriovenous malformations, and vascular stenosis.", "tip": "NCLEX Tip: Angiography requires monitoring for contrast allergy and renal function, similar to other contrast-based imaging studies."}, {"t": "fib", "q": "Fill in the blank: A GCS score of ______ or below generally indicates a comatose state requiring urgent evaluation and airway protection consideration.", "blanks": [["8", "eight"]], "r": "A GCS score of 8 or below is widely used as a threshold indicating coma and the need to consider airway protection, such as intubation.", "tip": "NCLEX Tip: Remember 'GCS ≤ 8, intubate' as a common clinical guideline associated with this scoring threshold."}, {"t": "mc", "q": "Which best reflects the appropriate nursing response to a patient exhibiting early signs of increased ICP, such as new-onset restlessness and mild confusion?", "o": ["Wait until more severe symptoms develop before notifying the provider", "Notify the provider promptly and continue frequent neurologic assessments", "Administer a sedative to calm the patient without further assessment", "Document the finding only and address it at end of shift"], "a": [1], "e": ["Waiting for late signs delays critical intervention and increases risk of poor outcomes.", "", "Sedating without addressing the underlying cause could mask worsening neurologic status.", "Delaying communication of an important early change increases patient risk."], "r": "Early signs of increased ICP should be reported promptly, as timely intervention offers the best chance of preventing progression to more severe neurological compromise.", "tip": "NCLEX Tip: Early recognition and prompt reporting of subtle neuro changes is a nursing priority — don't wait for late, ominous signs to escalate care."}, {"t": "mc", "q": "Which nursing intervention helps reduce intracranial pressure in a patient with a head injury?", "o": ["Placing the patient in Trendelenburg position", "Elevating the head of the bed to 30 degrees and maintaining head/neck alignment", "Encouraging frequent coughing and straining", "Clustering all nursing care into one long session with no rest periods"], "a": [1], "e": ["Trendelenburg position increases, not decreases, ICP by increasing venous congestion in the head.", "", "Coughing and straining (Valsalva maneuver) increase ICP and should be minimized.", "Excessive stimulation and clustering care can increase ICP; care should be paced to allow rest periods."], "r": "Elevating the head of the bed to about 30 degrees and maintaining neutral head/neck alignment promotes venous drainage from the brain, helping to reduce intracranial pressure.", "tip": "NCLEX Tip: HOB elevation (30 degrees), avoiding Valsalva/straining, and minimizing excessive stimulation are core ICP-reduction nursing interventions."}, {"t": "mc", "q": "A patient with increased ICP is at risk for brain herniation. Which assessment finding would be most concerning for this complication?", "o": ["Stable, reactive pupils bilaterally", "A new unilateral fixed and dilated pupil", "Normal respiratory pattern", "Improving level of consciousness"], "a": [1], "e": ["This is a normal, reassuring finding.", "", "", "This is a reassuring finding, not concerning for herniation."], "r": "A new unilateral fixed and dilated pupil is a classic sign of uncal herniation, caused by compression of cranial nerve III as the brain shifts under increasing pressure, and requires immediate intervention.", "tip": "NCLEX Tip: A new unilateral 'blown pupil' is a neurological emergency suggesting herniation and warrants immediate provider notification."}, {"t": "mc", "q": "Which of the following best reflects appropriate positioning for a patient with increased intracranial pressure?", "o": ["Head of bed flat with legs elevated", "Head of bed elevated 30 degrees with head in neutral alignment", "Head turned sharply to one side for extended periods", "Trendelenburg position for improved cerebral perfusion"], "a": [1], "e": ["Flat positioning with legs elevated can increase ICP due to increased venous pressure in the head.", "", "Sharp head turning can compress jugular veins and impair venous drainage, increasing ICP.", "Trendelenburg position increases, rather than improves, intracranial pressure."], "r": "Maintaining the head of the bed at approximately 30 degrees with the head in neutral, midline alignment optimizes venous drainage and helps minimize increases in intracranial pressure.", "tip": "NCLEX Tip: Avoid extreme neck flexion, rotation, or hip flexion in patients with increased ICP, as these can impede venous return from the brain."}], "m3": [{"t": "mc", "q": "A nurse needs to rapidly infuse a large volume of fluid for a trauma patient. Which IV catheter gauge would be most appropriate?", "o": ["24G (yellow)", "22G (blue)", "18G (green)", "14G (orange)"], "a": [3], "e": ["A 24G catheter has the smallest lumen and lowest flow rate (13 mL/min), inappropriate for rapid large-volume infusion.", "A 22G catheter has a lower maximal flow rate (31 mL/min) and is not ideal for rapid resuscitation.", "An 18G catheter allows a higher flow rate (103 mL/min) but is not the largest option available.", ""], "r": "A 14G (orange) catheter has the largest lumen and highest maximal flow rate (270 mL/min), making it ideal for rapid fluid resuscitation, trauma, or blood administration.", "tip": "NCLEX Tip: Remember: the LOWER the gauge number, the LARGER the catheter and the FASTER the flow rate. 14G = largest/fastest; 24G = smallest/slowest."}, {"t": "mc", "q": "Which IV catheter size and color combination is correct?", "o": ["20G - Pink", "18G - Yellow", "16G - Blue", "22G - Orange"], "a": [0], "e": ["", "An 18G catheter is coded green, not yellow.", "A 16G catheter is coded gray, not blue.", "A 22G catheter is coded blue, not orange."], "r": "The standard color-coding is: 24G Yellow, 22G Blue, 20G Pink, 18G Green, 16G Gray, 14G Orange.", "tip": "NCLEX Tip: Always document and report catheter size by gauge number, NOT by color, since color-coding can vary between manufacturers."}, {"t": "fib", "q": "Fill in the blank: Although IV catheters are color-coded, nurses should always document and report the catheter by its ______ rather than its color.", "blanks": [["gauge", "angiocath size", "gauge size"]], "r": "IV catheters should be documented and reported using the gauge (angiocath) size rather than color, since color-coding conventions can vary between different manufacturers.", "tip": "NCLEX Tip: This is a frequently tested detail — always chart the objective gauge number, not a color that could be ambiguous."}, {"t": "mc", "q": "A nurse is selecting an IV catheter for an elderly patient with fragile veins who needs routine IV antibiotics. Which gauge would be most appropriate?", "o": ["14G", "16G", "22G or 24G", "18G"], "a": [2], "e": ["This gauge is far too large and would likely cause trauma to fragile, small veins.", "This gauge is unnecessarily large for routine antibiotic administration in a patient with fragile veins.", "", "This gauge is larger than necessary and increases risk of vessel trauma in fragile veins."], "r": "Smaller gauge catheters (22G-24G) are generally preferred for older adults with fragile veins and for routine infusions that do not require rapid flow rates, reducing the risk of vessel trauma.", "tip": "NCLEX Tip: Match catheter size to patient need and vein condition — bigger is not always better; consider vein fragility and the type/speed of infusion required."}, {"t": "mc", "q": "Which of the following is a contraindication for peripheral IV site selection?", "o": ["The dorsal forearm of the nondominant hand", "An extremity with an arteriovenous (AV) fistula for dialysis", "The antecubital fossa as a last resort for short-term use", "A vein below a previously infiltrated site on the same extremity"], "a": [1], "e": ["The forearm is generally an appropriate and preferred IV site.", "", "The antecubital area can be used, though it is less ideal for long-term therapy or mobility.", "Selecting a site below a previously infiltrated site is not ideal, but the primary absolute contraindication among these choices is an AV fistula extremity."], "r": "An extremity with an arteriovenous (AV) fistula or graft used for dialysis should never be used for IV access, blood draws, or blood pressure measurement, as it can damage the fistula and compromise the patient's dialysis access.", "tip": "NCLEX Tip: Never use an extremity with an AV fistula, on the same side as a mastectomy with lymph node removal, or a paralyzed limb for IV insertion, injections, or blood pressure measurement."}, {"t": "sata", "q": "Which of the following are appropriate considerations when selecting a peripheral IV insertion site? Select all that apply.", "o": ["Avoiding areas of flexion when possible", "Choosing the most distal appropriate vein first", "Selecting a vein in an extremity with a mastectomy and lymph node removal", "Assessing for adequate vein size for the prescribed therapy", "Considering the patient's dominant hand and avoiding it if possible for comfort"], "a": [0, 1, 3, 4], "e": ["", "", "Extremities with a mastectomy and lymph node removal should be avoided for IV insertion due to impaired lymphatic drainage and infection/lymphedema risk.", "", ""], "r": "Appropriate site selection includes starting distally and moving proximally as needed, avoiding areas of flexion, assessing vein size for the prescribed therapy, and considering patient comfort, while avoiding contraindicated sites such as a lymphedema-risk extremity.", "tip": "NCLEX Tip: 'Distal to proximal' is a key principle in vein selection — start with the most distal appropriate site to preserve proximal veins for future access."}, {"t": "mc", "q": "Which nursing action best demonstrates aseptic technique during peripheral IV insertion?", "o": ["Palpating the vein after applying antiseptic and before inserting the catheter, without re-cleaning", "Cleansing the site with an approved antiseptic and allowing it to fully dry before insertion", "Reusing a tourniquet on multiple patients without cleaning", "Inserting the catheter immediately after applying antiseptic, without waiting for it to dry"], "a": [1], "e": ["Palpating a site after cleansing without re-prepping violates sterile/aseptic principles and can reintroduce contamination.", "", "Reusing an uncleaned tourniquet between patients risks cross-contamination and violates infection control principles.", "Antiseptic solutions require adequate drying time to be effective; inserting before drying reduces antimicrobial efficacy."], "r": "Aseptic technique for IV insertion includes proper hand hygiene, cleansing the site with an appropriate antiseptic in the correct manner, and allowing it to fully dry before catheter insertion to maximize antimicrobial effect.", "tip": "NCLEX Tip: Antiseptic solutions (e.g., chlorhexidine) need adequate contact/drying time to be effective — inserting too soon reduces infection protection."}, {"t": "mc", "q": "A patient's IV site is cool, swollen, and taut, with the infusion pump alarming due to occlusion. The IV fluid is not vesicant. This presentation is most consistent with:", "o": ["Phlebitis", "Infiltration", "Air embolism", "Fluid overload"], "a": [1], "e": ["Phlebitis typically presents with warmth, redness, and tenderness along the vein, not coolness and swelling from fluid leakage.", "", "Air embolism presents with sudden dyspnea, chest pain, and hypoxia, not localized swelling at the IV site.", "Fluid overload presents with systemic symptoms such as dyspnea and edema, not a localized cool, swollen IV site."], "r": "Infiltration occurs when non-vesicant IV fluid leaks into surrounding tissue, causing coolness, swelling, and taut skin at the site, along with pump occlusion alarms due to resistance to flow.", "tip": "NCLEX Tip: Infiltration = non-vesicant fluid leaking into tissue (cool, swollen, pale). Extravasation = same process but with a VESICANT drug, causing tissue damage and requiring emergent management."}, {"t": "mc", "q": "A patient receiving a vesicant chemotherapy medication reports burning pain at the IV site, and the nurse notes redness, swelling, and blistering. The nurse should suspect:", "o": ["Infiltration", "Extravasation", "Phlebitis", "Thrombophlebitis"], "a": [1], "e": ["Infiltration involves a non-vesicant solution; the presence of blistering and tissue damage from a vesicant points to a more serious process.", "", "Phlebitis presents with redness and warmth along the vein but not typically blistering/tissue necrosis.", "Thrombophlebitis involves a palpable, tender cord along the vein with a clot, not blistering skin changes from vesicant leakage."], "r": "Extravasation occurs when a vesicant medication (such as certain chemotherapy agents) leaks into surrounding tissue, causing significant tissue damage, blistering, and potential necrosis; it requires immediate intervention per facility protocol.", "tip": "NCLEX Tip: Extravasation is a medical emergency due to tissue-damaging potential of vesicant drugs — stop the infusion immediately, do not remove the catheter until after aspirating residual drug (per protocol), and notify the provider."}, {"t": "mc", "q": "Which finding at an IV site is most consistent with phlebitis?", "o": ["Coolness and pallor along the vein", "Redness, warmth, and tenderness along the vein path", "A palpable, cord-like vein with no redness", "Absence of any visible or palpable changes"], "a": [1], "e": ["Coolness and pallor are more consistent with infiltration, not phlebitis.", "", "A cord-like, palpable vein without redness better fits early thrombophlebitis rather than uncomplicated phlebitis.", "Phlebitis by definition produces visible/palpable changes such as redness and warmth."], "r": "Phlebitis is inflammation of the vein characterized by redness, warmth, tenderness, and sometimes a visible red streak along the vein's path.", "tip": "NCLEX Tip: Phlebitis = inflammation (red, warm, tender); Infiltration = fluid leaking into tissue (cool, swollen, pale); Thrombophlebitis = phlebitis + a clot (palpable cord)."}, {"t": "mc", "q": "A nurse assesses an IV site and finds a warm, tender, palpable cord-like vein with surrounding redness. This finding is most consistent with:", "o": ["Infiltration", "Thrombophlebitis", "Air embolism", "Fluid overload"], "a": [1], "e": ["Infiltration presents as cool and swollen, not a palpable cord with warmth.", "", "Air embolism presents with sudden respiratory distress, not local vein changes.", "Fluid overload presents with systemic symptoms, not a localized cord-like vein."], "r": "Thrombophlebitis is inflammation of the vein associated with clot formation, presenting as a warm, tender, palpable cord along the vein with surrounding redness, and requires prompt removal of the IV and further evaluation.", "tip": "NCLEX Tip: A palpable 'cord' is the key distinguishing feature of thrombophlebitis compared to simple phlebitis."}, {"t": "mc", "q": "A patient receiving IV therapy suddenly develops dyspnea, chest pain, hypotension, and a churning heart murmur. The nurse suspects:", "o": ["Infiltration", "Air embolism", "Phlebitis", "Fluid overload"], "a": [1], "e": ["Infiltration causes local site symptoms, not sudden systemic cardiorespiratory collapse.", "", "Phlebitis produces local vein inflammation, not acute systemic cardiopulmonary symptoms.", "Fluid overload typically develops more gradually with symptoms like dyspnea and edema, but does not typically cause a churning murmur."], "r": "Air embolism is a life-threatening complication of IV therapy presenting with sudden dyspnea, chest pain, hypotension, and a characteristic 'mill-wheel' or churning murmur; the nurse should immediately place the patient in the Trendelenburg position on their left side and administer oxygen.", "tip": "NCLEX Tip: For suspected air embolism: clamp the tubing, position the patient on their LEFT side in Trendelenburg (to trap air in the right atrium away from the pulmonary outflow tract), administer oxygen, and notify the provider immediately."}, {"t": "mc", "q": "Which nursing intervention is the priority for a patient suspected of experiencing an air embolism during IV therapy?", "o": ["Position the patient on the right side with the head elevated", "Position the patient on the left side in Trendelenburg position and administer oxygen", "Increase the IV flow rate to flush out the air", "Disconnect the IV tubing and leave the site open to air"], "a": [1], "e": ["This position could allow air to travel more easily into the pulmonary circulation rather than trapping it.", "", "Increasing the flow rate does not address the embolism and could worsen the situation.", "Leaving the site open to air increases infection risk and does not address the embolism; the line should be clamped, not opened."], "r": "The nurse should position the patient on their left side in Trendelenburg position to trap air in the apex of the right ventricle away from the pulmonary valve, and administer oxygen while notifying the provider immediately.", "tip": "NCLEX Tip: 'Left side, head down (Trendelenburg)' is the classic positioning for air embolism management — memorize this exact positioning detail."}, {"t": "mc", "q": "A patient receiving IV fluids at a rapid rate develops dyspnea, crackles, and jugular venous distention. The nurse recognizes this as a sign of:", "o": ["Infiltration", "Fluid overload (circulatory overload)", "Phlebitis", "Localized infection"], "a": [1], "e": ["Infiltration presents with local site swelling, not systemic respiratory symptoms.", "", "Phlebitis presents with local vein inflammation, not systemic fluid overload symptoms.", "Localized infection would present with site-specific redness/warmth/drainage, not systemic pulmonary symptoms."], "r": "Fluid (circulatory) overload from IV therapy administered too rapidly or in excessive volume can cause dyspnea, crackles, JVD, and hypertension, particularly in patients with cardiac or renal impairment.", "tip": "NCLEX Tip: Fluid overload is a systemic complication — slow or stop the infusion, raise the head of the bed, administer oxygen as needed, and notify the provider."}, {"t": "mc", "q": "Which patient population is at greatest risk for fluid overload during IV therapy?", "o": ["A healthy 25-year-old receiving a routine antibiotic infusion", "An older adult with a history of heart failure and renal insufficiency", "A well-hydrated adult receiving a single-dose IV medication", "A patient receiving a small-volume IV flush"], "a": [1], "e": ["This patient has minimal risk factors for fluid overload.", "", "This patient has minimal risk factors for fluid overload.", "A small-volume flush poses minimal risk of fluid overload."], "r": "Older adults and patients with pre-existing heart failure or renal insufficiency have reduced capacity to handle fluid volume shifts, placing them at higher risk for fluid overload during IV therapy.", "tip": "NCLEX Tip: Always consider cardiac and renal status when calculating IV fluid rates, especially in older adults or those with organ dysfunction."}, {"t": "mc", "q": "Which nursing action is most important for preventing central line-associated bloodstream infections (CLABSI) when caring for a patient with both a peripheral IV and a central line?", "o": ["Using the same non-sterile gloves for care of both lines to save time", "Performing hand hygiene and following aseptic technique before accessing either line, and using dedicated supplies for each", "Only performing hand hygiene before touching the central line, not the peripheral line", "Reusing the same needleless connector for multiple lines"], "a": [1], "e": ["Reusing gloves between lines increases cross-contamination risk.", "", "Hand hygiene must be performed before accessing any vascular access device, not selectively.", "Needleless connectors should not be reused across multiple separate access devices."], "r": "Preventing CLABSI requires consistent hand hygiene, aseptic technique, and use of dedicated supplies for each vascular access device to avoid cross-contamination between lines.", "tip": "NCLEX Tip: CLABSI prevention bundles include hand hygiene, maximal barrier precautions during insertion, chlorhexidine skin antisepsis, optimal catheter site selection, and daily review of line necessity."}, {"t": "sata", "q": "Which nursing interventions help prevent infection related to peripheral IV therapy? Select all that apply.", "o": ["Performing hand hygiene before and after IV site care", "Changing the IV dressing per facility policy or when soiled/loose", "Leaving a peripheral IV in place indefinitely if it is still infusing without issue", "Using aseptic technique during insertion and site care", "Labeling the IV site with date and time of insertion"], "a": [0, 1, 3, 4], "e": ["", "", "Peripheral IVs should be assessed regularly and, per many facility policies, rotated according to institutional guidelines and clinical indication rather than left indefinitely regardless of duration.", "", ""], "r": "Infection prevention for peripheral IV therapy includes hand hygiene, proper dressing changes, aseptic technique during insertion and care, and accurate labeling to track insertion date and monitor for the need for site rotation.", "tip": "NCLEX Tip: IV site care/infection prevention bundles are commonly tested with SATA questions — know the individual components of the bundle."}, {"t": "mc", "q": "Before administering an IV medication, the nurse should verify the 'six rights' of medication administration. Which of the following is NOT one of the traditional six rights?", "o": ["Right patient", "Right route", "Right documentation", "Right diagnosis"], "a": [3], "e": ["This is one of the traditional rights.", "This is one of the traditional rights.", "This is one of the traditional rights.", ""], "r": "The traditional 'six rights' of medication administration are: right patient, right drug, right dose, right route, right time, and right documentation. 'Right diagnosis' is not one of the six rights.", "tip": "NCLEX Tip: Memorize all six rights: Patient, Drug, Dose, Route, Time, Documentation. Some frameworks add additional rights (e.g., right reason, right response) but these six form the traditional foundation."}, {"t": "mc", "q": "A nurse verifies a patient's identity using two identifiers before administering an IV medication. Which of the following is an acceptable pair of identifiers?", "o": ["Room number and bed number", "Patient's full name and date of birth", "Patient's diagnosis and physician name", "Patient's first name and admitting complaint"], "a": [1], "e": ["Room and bed numbers can change and are not acceptable patient identifiers.", "", "Diagnosis and physician name are not appropriate patient identifiers for verification.", "A first name alone and admitting complaint are not acceptable identifiers; a full name plus a second unique identifier (like date of birth or medical record number) should be used."], "r": "Acceptable patient identifiers include the patient's full name, date of birth, or medical record number — but never room or bed number, which can change and do not reliably confirm patient identity.", "tip": "NCLEX Tip: The Joint Commission requires TWO patient identifiers, neither of which may be the patient's room number."}, {"t": "mc", "q": "Which piece of information is essential to document after inserting a peripheral IV catheter?", "o": ["The nurse's personal opinion about the patient's veins", "Insertion site, catheter gauge, number of attempts, and patient's tolerance of the procedure", "Only the time of insertion", "The patient's insurance information"], "a": [1], "e": ["This is not appropriate or objective documentation.", "", "This omits essential clinical details required for continuity of care and quality/safety review.", "This is unrelated to IV insertion documentation."], "r": "Proper IV insertion documentation includes the site, catheter gauge, number of attempts, and the patient's tolerance of the procedure, which supports continuity of care and legal accountability.", "tip": "NCLEX Tip: Thorough IV documentation should always answer: where, what size, how many attempts, and how did the patient tolerate it."}, {"t": "mc", "q": "A nurse is calculating an infusion rate for a gravity IV set with a drop factor of 15 gtt/mL. The order is for 1000 mL to infuse over 8 hours. What is the correct drip rate in gtt/min? (Round to the nearest whole number.)", "o": ["21 gtt/min", "31 gtt/min", "15 gtt/min", "42 gtt/min"], "a": [1], "e": ["This is calculated incorrectly; recheck the formula (volume x drop factor / time in minutes).", "", "This value does not correctly apply the volume, time, and drop factor together.", "This value does not correctly apply the volume, time, and drop factor together."], "r": "Using the formula (Volume in mL x drop factor) / time in minutes: (1000 mL x 15 gtt/mL) / 480 minutes = 15000/480 ≈ 31.25, rounded to 31 gtt/min.", "tip": "NCLEX Tip: IV drip rate formula: (Volume to infuse x drop factor) ÷ time in minutes = gtt/min. Always convert hours to minutes before calculating."}, {"t": "mc", "q": "An infusion pump is set to deliver 125 mL/hr. How many mL will infuse in 6 hours?", "o": ["625 mL", "750 mL", "700 mL", "800 mL"], "a": [1], "e": ["This is an incorrect multiplication of the rate and time.", "", "This is an incorrect multiplication of the rate and time.", "This is an incorrect multiplication of the rate and time."], "r": "125 mL/hr x 6 hours = 750 mL total infused over the 6-hour period.", "tip": "NCLEX Tip: For simple pump-rate calculations, multiply mL/hr by the number of hours to find total volume infused."}, {"t": "fib", "q": "Fill in the blank: To calculate an IV drip rate for a gravity infusion, the nurse uses the formula: (Volume to be infused x drop factor) ÷ ______ (in minutes) = gtt/min.", "blanks": [["time", "infusion time"]], "r": "The gravity IV drip rate formula requires dividing the product of volume and drop factor by the total infusion time expressed in minutes.", "tip": "NCLEX Tip: Always double-check that time has been converted to minutes before performing this calculation, as this is the most common source of calculation errors."}, {"t": "mc", "q": "Which statement about central venous access devices (CVADs) compared to peripheral IV catheters is accurate?", "o": ["CVADs are typically used for short-term therapy of less than 24 hours", "CVADs can be used for long-term therapy, vesicant medications, and administration of total parenteral nutrition (TPN)", "Peripheral IVs are preferred for administering vesicant chemotherapy over multiple weeks", "CVADs cannot be used to draw blood samples"], "a": [1], "e": ["CVADs are generally used for longer-term therapy, not short durations under 24 hours.", "", "Vesicant chemotherapy over an extended period is generally administered via a central line, not a peripheral IV, to reduce the risk of extravasation.", "Many CVADs can be used for blood sampling, unlike this statement suggests."], "r": "Central venous access devices are appropriate for long-term therapy, vesicant or irritant medications, TPN, and frequent blood draws, whereas peripheral IVs are best suited for short-term, non-vesicant therapies.", "tip": "NCLEX Tip: Peripheral IV = short-term, non-vesicant fluids/meds. Central line = long-term therapy, vesicants, TPN, and frequent lab draws."}, {"t": "mc", "q": "Which of the following would be an appropriate use for a peripheral IV catheter?", "o": ["Long-term chemotherapy with vesicant agents over several months", "Short-term administration of isotonic IV fluids or antibiotics", "Total parenteral nutrition (TPN) with high osmolarity", "Continuous vasopressor infusion requiring central access"], "a": [1], "e": ["This should be administered via a central venous access device, not a peripheral IV.", "", "TPN with high osmolarity requires central access due to the risk of vessel damage from a hyperosmolar solution.", "Vasopressors are typically administered via central access due to the risk of tissue damage with extravasation from a peripheral line."], "r": "Peripheral IV catheters are appropriate for short-term administration of isotonic fluids, routine medications, and antibiotics, but not for long-term vesicant therapy, high-osmolarity solutions, or vasopressors, which require central access.", "tip": "NCLEX Tip: High-osmolarity solutions (like TPN) and vesicant/vasoactive medications should generally be given through central access to prevent vessel damage."}, {"t": "mc", "q": "When initiating IV therapy in a pediatric patient, which modification is most appropriate?", "o": ["Use the largest gauge catheter available to ensure adequate flow", "Consider smaller veins, use age-appropriate distraction techniques, and select an appropriately sized (often smaller-gauge) catheter", "Avoid using a tourniquet under any circumstances", "Skip explaining the procedure since children won't understand"], "a": [1], "e": ["Pediatric veins are typically smaller and more fragile, making the largest gauge catheter inappropriate and potentially harmful.", "", "A tourniquet can still be used cautiously in pediatric patients, with attention to appropriate size and pressure.", "Even young children benefit from developmentally appropriate explanations, which can reduce fear and improve cooperation."], "r": "IV therapy across the lifespan requires adjustments such as using smaller-gauge catheters appropriate to smaller pediatric veins, incorporating distraction and comfort techniques, and using developmentally appropriate communication.", "tip": "NCLEX Tip: Lifespan considerations for IV therapy: pediatric patients need smaller catheters and distraction techniques; older adults often have fragile veins requiring gentler technique and smaller gauges as well, but for different physiological reasons."}, {"t": "mc", "q": "Which modification is appropriate when initiating IV therapy in an older adult with fragile, thin-walled veins?", "o": ["Apply the tourniquet as tightly as possible for as long as needed", "Use a lower angle of insertion, avoid excessive tourniquet time, and consider a smaller gauge catheter", "Avoid stabilizing the vein prior to insertion", "Choose the largest available gauge to prevent multiple attempts"], "a": [1], "e": ["Excessive tourniquet tightness or duration can increase the risk of vein rupture in fragile veins.", "", "Stabilizing fragile, rolling veins is especially important in older adults to improve first-attempt success.", "A large gauge catheter increases the risk of trauma to fragile veins; a smaller gauge is generally preferred."], "r": "In older adults, fragile veins require gentler technique: a lower insertion angle, minimal tourniquet time, vein stabilization, and often a smaller-gauge catheter to reduce the risk of vessel trauma or rupture.", "tip": "NCLEX Tip: Fragile veins (common in older adults, patients on long-term steroids, or those who are chronically ill) require adjusted technique to prevent hematoma or vessel rupture during insertion."}, {"t": "mc", "q": "A patient asks the nurse how long their IV will remain in place. The best patient education response is:", "o": ["\"It will stay in as long as the doctor forgets to remove it.\"", "\"The IV will be evaluated regularly and stay in place for as long as your treatment requires, per our facility's guidelines, or until there's a concern with the site.\"", "\"It doesn't matter, we just leave IVs in indefinitely.\"", "\"You won't need it removed unless you ask for it to be taken out.\""], "a": [1], "e": ["This response is unprofessional and not evidence-based.", "", "IVs are not simply left in indefinitely; they are monitored and may be changed per policy or clinical need.", "IV removal is a clinical decision based on ongoing need and site assessment, not solely up to patient request."], "r": "Patient education about IV therapy should include the purpose, expected duration based on treatment needs, and reassurance that the site will be monitored regularly for any signs of complications.", "tip": "NCLEX Tip: Patient education responses should always be accurate, professional, and grounded in patient-centered communication."}, {"t": "mc", "q": "Which statement by a patient indicates a need for further teaching about signs of IV complications to report?", "o": ["\"I should tell the nurse if I notice swelling or redness at the site.\"", "\"I don't need to say anything unless the IV completely falls out.\"", "\"I'll let someone know if I feel pain or notice any leaking at the site.\"", "\"I understand I should report if the area feels warm or tender.\""], "a": [1], "e": ["This statement reflects correct understanding of appropriate reporting.", "", "This statement reflects correct understanding of appropriate reporting.", "This statement reflects correct understanding of appropriate reporting."], "r": "Patients should be taught to report any pain, swelling, redness, warmth, tenderness, or leakage at the IV site promptly, not wait until a major problem (like complete dislodgement) occurs.", "tip": "NCLEX Tip: 'Needs further teaching' questions require identifying the statement that reflects a misunderstanding — look for responses that minimize or delay reporting of concerning symptoms."}, {"t": "mc", "q": "A nurse is preparing to administer two IV medications through the same line. Before doing so, the priority action is to:", "o": ["Administer both medications simultaneously through the same port without checking", "Verify compatibility of the IV medications and solutions before administration", "Assume all IV medications are compatible unless stated otherwise", "Skip checking compatibility if both medications were ordered by the same provider"], "a": [1], "e": ["Administering incompatible medications together can cause precipitation, reduced efficacy, or patient harm.", "", "Compatibility should never be assumed; it must be verified using a reliable reference or pharmacist consultation.", "Compatibility must be verified regardless of who ordered the medications."], "r": "Before administering multiple IV medications through the same line, the nurse must verify compatibility using a reliable drug compatibility reference or by consulting pharmacy, to prevent precipitation or adverse reactions.", "tip": "NCLEX Tip: When in doubt about IV compatibility, flush the line between incompatible medications or use a separate access site/lumen."}, {"t": "sata", "q": "Which are appropriate methods for obtaining a blood sample from a patient with an existing peripheral IV catheter? Select all that apply.", "o": ["Following facility policy regarding drawing blood from a newly inserted IV catheter before fluids have been infused", "Using proper technique to avoid hemolysis of the sample", "Drawing the sample from a vein distal to the current infusing IV without regard for accuracy", "Discarding an appropriate initial volume per protocol to avoid dilution of the sample", "Ignoring the fluid currently infusing through the line when interpreting lab values"], "a": [0, 1, 3], "e": ["", "", "Drawing blood without attention to appropriate technique and site increases the risk of an inaccurate/diluted sample.", "", "Fluid currently infusing (e.g., dextrose affecting glucose results) should be considered when interpreting lab values drawn near an infusing line."], "r": "Blood samples may be drawn from a peripheral IV under specific conditions per policy, using proper technique to avoid hemolysis, discarding an appropriate initial volume to avoid dilution, and considering the effect of infusing fluids on lab accuracy.", "tip": "NCLEX Tip: Blood draws from an existing IV line carry a higher risk of hemolysis and dilution — always follow facility-specific protocols for this technique."}, {"t": "mc", "q": "A nurse notes that a peripheral IV site has been in place for the maximum duration allowed by facility policy without complications. What should the nurse do?", "o": ["Leave it in place indefinitely since there are no complications", "Follow facility policy regarding site rotation, which may include planned removal/restart at a new site", "Remove the IV and not replace it since the patient no longer needs any IV access", "Increase the infusion rate to compensate for the aging catheter"], "a": [1], "e": ["Facility policies on maximum dwell time exist to reduce infection and phlebitis risk, even without current complications.", "", "This choice ignores the ongoing clinical need for IV access, which the scenario does not indicate has ended.", "Adjust
