<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NRSG 3333 - Exam 1 Practice Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E4E6ED;
  --bg-alt:#D7DAE3;
  --card:#FFFFFF;
  --ink:#1C2333;
  --ink-soft:#525B6E;
  --ink-faint:#8991A3;
  --line:#E1E5EC;

  --primary:#25335C;      /* deep indigo navy - headers, brand */
  --primary-dark:#161E3B;
  --primary-pale:#E7EAF3;

  --gold:#7C58D1;         /* violet - checkpoint / interactive accent */
  --gold-dark:#5E3FAE;
  --gold-pale:#EFE9FB;

  --red:#C2402F;          /* critical */
  --red-pale:#FBE5E1;

  --amber:#B9821A;        /* caution */
  --amber-pale:#FAF0DB;

  --blue:#2C74B3;         /* info */
  --blue-pale:#E4EFF8;

  --green:#2E8F5C;        /* tip / reassurance */
  --green-pale:#E3F3EA;

  --teal:#1E8A99;         /* flash cards theme */
  --teal-pale:#DFF1F3;

  /* per-tab theme colors */
  --t-mod1:#7C58D1;
  --t-mod2:#2C74B3;
  --t-mod3:#9B4FBD;
  --t-drugs:#C23B6E;
  --t-priority:#C2402F;
  --t-flash:#1E8A99;

  --t-mod3-pale:#F2E7F7;
  --t-drugs-pale:#FBE6ED;

  --sidebar-w:246px;

  --radius:14px;
  --shadow: 0 2px 10px rgba(28,35,51,0.07), 0 1px 2px rgba(28,35,51,0.06);
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:'Inter',sans-serif;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{
  font-family:'Source Serif 4',serif;
  color:var(--primary-dark);
  margin:0 0 .4em 0;
  font-weight:600;
  letter-spacing:-0.01em;
}
.mono{font-family:'IBM Plex Mono',monospace;}
a{color:var(--primary);}
p{margin:0 0 .8em 0;}
ul,ol{margin:.3em 0 .9em 0; padding-left:1.3em;}
li{margin-bottom:.3em;}
button{font-family:'Inter',sans-serif;}

/* ---------- minimal top accent bar ---------- */
.top-accent-bar{
  width:100%;height:5px;
  background:linear-gradient(90deg,var(--primary) 0%,var(--primary) 55%,var(--gold) 100%);
}

/* ---------- Simple full-width layout ---------- */
.content-area{width:100%;}

.home-btn{
  display:inline-flex;align-items:center;gap:8px;
  background:rgba(255,255,255,.1);border:1.5px solid rgba(255,255,255,.28);color:#fff;
  padding:9px 16px;border-radius:9px;font-weight:700;font-size:13.5px;cursor:pointer;
  font-family:'Inter',sans-serif;transition:background .15s;flex-shrink:0;
}
.home-btn:hover{background:rgba(255,255,255,.2);}
.home-btn svg{width:15px;height:15px;flex-shrink:0;}

/* ---------- Top banner (dark purple/blue) ---------- */
header.top{
  background:linear-gradient(135deg,var(--primary-dark),var(--primary));
  position:relative;overflow:hidden;
}
header.top::before{
  content:"";position:absolute;width:340px;height:340px;border-radius:50%;
  background:radial-gradient(circle, rgba(124,88,209,0.35), transparent 70%);
  top:-160px;right:60px;pointer-events:none;
}
header.top::after{
  content:"";position:absolute;width:220px;height:220px;border-radius:50%;
  background:radial-gradient(circle, rgba(30,138,153,0.28), transparent 70%);
  bottom:-130px;left:8%;pointer-events:none;
}
.header-inner{
  max-width:1180px;margin:0 auto;padding:30px 32px 34px 32px;position:relative;
  display:flex;justify-content:space-between;align-items:flex-start;gap:20px;flex-wrap:wrap;
}
.brand-eyebrow{
  font-family:'IBM Plex Mono',monospace;
  font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:#B9A8EA;font-weight:600;margin-bottom:4px;
}
h1.title{font-size:28px;margin-bottom:2px;color:#fff;}
.subtitle{color:#C6CBE6;font-size:14.5px;max-width:660px;}
.header-side{display:flex;flex-direction:column;align-items:flex-end;gap:8px;}
.header-progress{min-width:220px;}
.header-progress .ptrack{height:7px;background:rgba(255,255,255,.14);border-radius:99px;overflow:hidden;}
.header-progress .pfill{height:100%;background:linear-gradient(90deg,var(--gold),var(--teal));border-radius:99px;transition:width .25s;}
.header-progress .plabel{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:#C6CBE6;margin-top:5px;text-align:right;text-transform:uppercase;letter-spacing:.06em;}

main{max-width:1180px;margin:0 auto;padding:30px 32px 80px 32px;}
.panel{animation:fade .25s ease;}
@keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

/* per-module accent scoping */
.scope-mod1{--accent:var(--t-mod1);--accent-pale:var(--gold-pale);}
.scope-mod2{--accent:var(--t-mod2);--accent-pale:var(--blue-pale);}
.scope-mod3{--accent:var(--t-mod3);--accent-pale:var(--t-mod3-pale);}
.scope-home{--accent:var(--gold);--accent-pale:var(--gold-pale);}
.scope-remediation{--accent:var(--red);--accent-pale:var(--red-pale);}

/* module intro hero */
.mod-hero{
  background:linear-gradient(135deg,var(--primary-dark),var(--primary));
  color:#E9ECF6;border-radius:var(--radius);padding:26px 28px;margin-bottom:26px;
  border-left:6px solid var(--accent, var(--gold));
}
.mod-hero .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent, #B9A8EA);font-weight:600;margin-bottom:6px;}
.mod-hero h2{color:#fff;font-size:26px;margin-bottom:8px;}
.mod-hero p{color:#D4D9EC;max-width:760px;margin-bottom:0;font-size:14.5px;}

/* section blocks */
section.block{margin-bottom:12px;}
.block h3{
  font-size:20px;border-bottom:2px solid var(--accent, var(--line));padding-bottom:8px;margin-bottom:14px;
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
}
.block h3 .tag{
  font-family:'IBM Plex Mono',monospace;font-size:10.5px;font-weight:600;
  background:var(--accent-pale, var(--primary-pale));color:var(--primary-dark);padding:3px 8px;border-radius:20px;
  letter-spacing:.04em;
}
.block h4{font-size:16px;color:var(--ink);margin-top:18px;}

.card{
  background:var(--card);border:1px solid var(--line);border-left:4px solid var(--accent, var(--line));
  border-radius:var(--radius);
  padding:18px 20px;box-shadow:var(--shadow);margin-bottom:16px;
}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;}
.module-cards-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;align-items:start;}
@media (max-width:820px){.grid2,.grid3,.module-cards-grid{grid-template-columns:1fr;}}

table{width:100%;border-collapse:collapse;font-size:14px;margin-bottom:10px;}
th{
  text-align:left;background:var(--accent-pale, var(--primary-pale));color:var(--primary-dark);
  font-family:'IBM Plex Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:.04em;
  padding:9px 10px;border-bottom:2px solid var(--accent, #C7CEE5);
}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top;}
tr:last-child td{border-bottom:none;}
.data-table-wrap{overflow-x:auto;}

/* callouts */
.callout{border-radius:10px;padding:14px 16px;margin:14px 0;font-size:14.5px;border-left:5px solid;}
.callout.high{background:var(--red-pale);border-color:var(--red);}
.callout.caution{background:var(--amber-pale);border-color:var(--amber);}
.callout.info{background:var(--blue-pale);border-color:var(--blue);}
.callout.tip{background:var(--green-pale);border-color:var(--green);}
.callout .label{
  font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:700;text-transform:uppercase;
  letter-spacing:.06em;display:block;margin-bottom:5px;
}
.callout.high .label{color:var(--red);}
.callout.caution .label{color:var(--amber);}
.callout.info .label{color:var(--blue);}
.callout.tip .label{color:var(--green);}

/* pill list */
.pill-row{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0;}
.pill{background:var(--bg-alt);border:1px solid var(--line);border-radius:20px;padding:6px 13px;font-size:13px;font-family:'IBM Plex Mono',monospace;}

/* selectable filter chips (module / type toggles) */
.fc-filter{
  background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:8px 16px;
  font-size:13.5px;font-weight:600;cursor:pointer;color:var(--ink-soft);font-family:'Inter',sans-serif;
  display:inline-flex;align-items:center;gap:8px;transition:background .15s,border-color .15s,color .15s;
}
.fc-filter .dot{width:9px;height:9px;border-radius:50%;background:var(--ink-faint);flex-shrink:0;}
.fc-filter.active{background:var(--accent, var(--primary));border-color:var(--accent, var(--primary));color:#fff;}
.fc-filter.active .dot{background:#fff;}
.fc-controls{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:6px;}

/* checkpoint-style trigger button */
.cp-trigger{
  display:inline-flex;align-items:center;gap:7px;
  background:var(--accent-pale, var(--gold-pale));color:var(--accent, var(--gold-dark));border:1.5px solid var(--accent, var(--gold));
  padding:9px 16px;border-radius:9px;font-weight:700;font-size:13.5px;cursor:pointer;
  margin:4px 0 4px 0;font-family:'Inter',sans-serif;transition:background .15s,color .15s;
}
.cp-trigger:hover{background:var(--accent, var(--gold));color:#fff;}
.cp-trigger .badge{
  background:var(--accent, var(--gold));color:#fff;border-radius:50%;width:18px;height:18px;
  display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-family:'IBM Plex Mono',monospace;
}
.cp-trigger:hover .badge{background:#fff;color:var(--accent, var(--gold-dark));}
.cp-trigger:disabled{opacity:.45;cursor:default;}
.cp-trigger:disabled:hover{background:var(--accent-pale, var(--gold-pale));color:var(--accent, var(--gold-dark));}

/* count stepper */
.count-row{display:flex;align-items:center;gap:10px;margin-top:12px;}
.count-row label{font-family:'IBM Plex Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-faint);}
.stepper{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:9px;overflow:hidden;}
.stepper button{background:var(--bg-alt);border:none;width:30px;height:32px;font-size:16px;cursor:pointer;color:var(--primary-dark);font-weight:700;}
.stepper button:hover{background:var(--accent-pale, var(--primary-pale));}
.stepper input{width:52px;border:none;text-align:center;font-family:'IBM Plex Mono',monospace;font-size:14px;height:32px;color:var(--ink);}
.stepper input:focus{outline:none;}

/* modal-opt style option buttons, used inline for quiz answers */
.modal-opt{
  display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;background:var(--bg);
  border:1.5px solid var(--line);color:var(--ink);border-radius:9px;
  padding:13px 15px;margin-bottom:9px;cursor:pointer;font-size:14.5px;font-family:'Inter',sans-serif;
  transition:border-color .15s,background .15s;position:relative;
}
.modal-opt:hover:not(:disabled){border-color:var(--accent, var(--primary));}
.modal-opt .opt-letter{
  font-family:'IBM Plex Mono',monospace;font-size:11.5px;font-weight:700;color:var(--ink-faint);
  border:1.5px solid var(--line);border-radius:50%;width:22px;height:22px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;margin-top:1px;
}
.modal-opt.sata .opt-letter{border-radius:6px;}
.modal-opt.picked{border-color:var(--accent, var(--primary));background:var(--accent-pale, var(--primary-pale));}
.modal-opt.picked .opt-letter{border-color:var(--accent, var(--primary));background:var(--accent, var(--primary));color:#fff;}
.modal-opt.correct{background:var(--green-pale);border-color:var(--green);color:var(--green);font-weight:600;}
.modal-opt.correct .opt-letter{background:var(--green);border-color:var(--green);color:#fff;}
.modal-opt.incorrect{background:var(--red-pale);border-color:var(--red);color:var(--red);font-weight:600;}
.modal-opt.incorrect .opt-letter{background:var(--red);border-color:var(--red);color:#fff;}
.modal-opt:disabled,.modal-opt.locked{cursor:default;}
.modal-opt .opt-tooltip{
  display:none;position:absolute;left:0;top:104%;z-index:5;background:var(--primary-dark);color:#fff;
  padding:10px 14px;border-radius:9px;font-size:13px;line-height:1.4;width:100%;font-weight:400;
  box-shadow:0 10px 24px rgba(0,0,0,.2);
}
.modal-opt.revealable:hover .opt-tooltip{display:block;}

.fib-input-wrap input[type=text]{
  padding:12px 15px;border:1.5px solid var(--line);border-radius:9px;font-size:14.5px;width:100%;max-width:380px;
  font-family:'Inter',sans-serif;color:var(--ink);
}
.fib-input-wrap input[type=text]:focus{outline:none;border-color:var(--accent, var(--primary));}
.fib-input-wrap input.correct{border-color:var(--green);background:var(--green-pale);}
.fib-input-wrap input.incorrect{border-color:var(--red);background:var(--red-pale);}
.fib-reveal{font-size:13.5px;color:var(--ink-soft);margin-top:8px;font-family:'IBM Plex Mono',monospace;}

.q-count{
  font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-faint);
  text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;
}
.q-text{font-size:17px;font-weight:600;color:var(--ink);margin-bottom:16px;line-height:1.5;}

/* modal-style nav footer (reused inline, not an actual modal) */
.modal-nav{
  display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;
  padding:16px 0 0 0;margin-top:8px;border-top:1px solid var(--line);
}
.modal-nav .side{display:flex;gap:8px;flex-wrap:wrap;}
.nav-btn{
  background:#fff;border:1.5px solid var(--line);color:var(--ink-soft);border-radius:8px;
  padding:9px 15px;font-weight:600;font-size:13.5px;cursor:pointer;font-family:'Inter',sans-serif;
}
.nav-btn:hover:not(:disabled){border-color:var(--accent, var(--primary));color:var(--primary-dark);}
.nav-btn:disabled{opacity:.4;cursor:default;}
.nav-btn.primary{background:var(--accent, var(--primary));border-color:var(--accent, var(--primary));color:#fff;}
.nav-btn.primary:hover{filter:brightness(0.92);}
.nav-btn.exit{background:var(--red-pale);border-color:var(--red);color:var(--red);}
.nav-btn.exit:hover{background:var(--red);color:#fff;}

/* bowtie */
.bowtie-cond-wrap{max-width:520px;margin:0 auto 18px;}
.bowtie-grid{display:grid;grid-template-columns:1fr auto 1fr;gap:0;align-items:stretch;}
.bowtie-col h4{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-faint);margin:0 0 10px;text-align:center;font-family:'IBM Plex Mono',monospace;font-weight:600;}
.bowtie-center{display:flex;align-items:center;justify-content:center;padding:0 16px;}
.bowtie-center svg{width:54px;height:100px;}

/* score circle */
.score-circle{width:150px;height:150px;border-radius:50%;margin:10px auto 20px;display:flex;align-items:center;justify-content:center;flex-direction:column;background:conic-gradient(var(--accent, var(--gold)) calc(var(--pct)*1%), var(--bg-alt) 0);}
.score-circle .inner{width:118px;height:118px;border-radius:50%;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;}
.score-circle .pctnum{font-size:30px;font-weight:800;color:var(--primary-dark);font-family:'Source Serif 4',serif;}
.score-circle .pctlabel{font-size:11px;color:var(--ink-faint);text-transform:uppercase;font-family:'IBM Plex Mono',monospace;letter-spacing:.05em;}

canvas#confetti{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:999;}

footer{
  text-align:center;padding:30px 20px;color:var(--ink-faint);font-size:12.5px;
  border-top:1px solid var(--line);margin-top:20px;
}
</style>
</head>
<body>
<canvas id="confetti" class="hidden" style="display:none;"></canvas>

<div class="content-area">

<header class="top">
  <div class="top-accent-bar"></div>
  <div class="header-inner">
    <div style="display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;">
      <button class="home-btn" id="btnHome"><svg viewBox="0 0 24 24"><path d="M3 11 L12 4 L21 11 V20 H15 V14 H9 V20 H3 Z" fill="#fff"/></svg>Home</button>
      <div>
        <div class="brand-eyebrow" id="headerEyebrow">NRSG 3333 &middot; Comprehensive Assessment &amp; Advanced Nursing Skills</div>
        <h1 class="title" id="headerTitle">Exam 1 Practice Quiz</h1>
        <div class="subtitle" id="headerSubtitle">Build a custom practice quiz from Modules 1&ndash;3, in NCLEX question styles.</div>
      </div>
    </div>
    <div class="header-side" id="headerSide"></div>
  </div>
</header>

<main>
<section class="panel" id="app-panel"></section>
</main>

</div>

 is a probing 'why' question, which can feel confrontational and is generally discouraged in therapeutic communication.", "This is 'giving false reassurance/sharing personal experience,' which shifts focus away from the patient and is a nontherapeutic technique."], "r": "Restating repeats the main idea of what the patient said, in similar words, to show the nurse is listening and to encourage the patient to continue.", "tip": "NCLEX Tip: Learn to distinguish restating (repeats content) from reflecting (repeats/names the underlying feeling) — both are tested frequently and often appear as answer-choice pairs."}, {"t": "mc", "q": "A patient states, \"I feel like nobody on this floor really cares what happens to me.\" Which nursing response best reflects the technique of 'reflecting feelings'?", "o": ["\"That's not true, we all care about you very much.\"", "\"You're feeling like you're not getting enough attention from the staff.\"", "\"What makes you say that?\"", "\"I'll let the charge nurse know you're unhappy with your care.\""], "a": [1], "e": ["This denies the patient's feelings outright and offers false reassurance instead of exploring the emotion behind the statement.", "", "This is a 'why' style question that can put the patient on the defensive rather than validating the emotion expressed.", "This jumps immediately to problem-solving/reporting rather than first acknowledging and exploring the patient's emotional experience."], "r": "Reflecting feelings names the emotion the patient is expressing (feeling uncared for) and mirrors it back, which validates the patient and opens the door for further discussion.", "tip": "NCLEX Tip: Prioritize responses that acknowledge emotion before responses that jump straight to fixing the problem."}, {"t": "sata", "q": "A nurse is using therapeutic communication techniques with a patient who is anxious before surgery. Which of the following are examples of therapeutic techniques? Select all that apply.", "o": ["Using silence to allow the patient time to gather thoughts", "Offering self by staying with the patient", "Telling the patient, \"Everything will be fine, don't worry\"", "Using open-ended questions such as \"What concerns you most about tomorrow?\"", "Changing the subject to something more pleasant when the patient becomes tearful", "Clarifying by asking the patient to explain what they mean"], "a": [0, 1, 3, 5], "e": ["", "", "This is false reassurance, a nontherapeutic technique that dismisses the patient's real concerns.", "", "This is changing the subject, a nontherapeutic technique that blocks communication and can make the patient feel unheard.", ""], "r": "Silence, offering self, open-ended questions, and clarifying are all therapeutic techniques that encourage the patient to express feelings and remain the focus of the interaction. False reassurance and changing the subject are nontherapeutic blocks to communication.", "tip": "NCLEX Tip: On SATA communication questions, eliminate any option that minimizes feelings, gives advice, or redirects away from the patient's stated concern."}, {"t": "mc", "q": "Which of the following is considered a barrier (nontherapeutic technique) to communication?", "o": ["Active listening", "Giving advice, such as \"If I were you, I would...\"", "Using broad opening statements", "Summarizing the conversation at its close"], "a": [1], "e": ["", "", "", ""], "r": "Giving advice removes the patient's autonomy in decision-making and implies the nurse knows what is best for the patient, which blocks the patient from working through their own feelings and choices.", "tip": "NCLEX Tip: Watch for phrases like \"If I were you\" or \"You should\" — these signal advice-giving, a classic nontherapeutic communication block."}, {"t": "mc", "q": "The nurse says to a grieving spouse, \"Losing a partner after 40 years together must feel like losing a part of yourself.\" This is an example of which therapeutic technique?", "o": ["Empathy", "Confrontation", "Focusing", "Presenting reality"], "a": [0], "e": ["", "This technique points out discrepancies between words and behaviors; it is not being used here.", "Focusing narrows the conversation to a specific topic; this statement instead validates a broad emotional experience.", "Presenting reality is used to gently correct a misperception, which is not occurring in this statement."], "r": "Empathy involves recognizing and acknowledging another person's feelings and communicating that understanding back to them, which builds trust and rapport.", "tip": "NCLEX Tip: Empathy statements typically name a feeling and connect it to the patient's specific situation ('It sounds like...', 'That must feel...')."}, {"t": "mc", "q": "A nurse is calling a provider about a patient with a new fever and decreased urine output. Using SBAR, which statement belongs in the 'Assessment' portion of the report?", "o": ["\"This is Mrs. Lee in room 412, day two post-op from a hip replacement.\"", "\"Her temperature is 102.4°F and urine output has been 15 mL/hr for the last two hours.\"", "\"I'm concerned she may be developing early sepsis or acute kidney injury related to hypovolemia.\"", "\"I recommend a STAT CBC, blood cultures, and a fluid bolus be ordered.\""], "a": [2], "e": ["This identifying information belongs in the 'Situation' section, not 'Assessment.'", "These objective vital sign and intake/output findings belong in the 'Background/Assessment data' but represent raw data rather than the nurse's clinical interpretation.", "", "This is a specific request for orders and belongs in the 'Recommendation' section."], "r": "The 'Assessment' component of SBAR is the nurse's clinical judgment or interpretation of the data — what the nurse thinks is going on — distinguishing it from the raw situation/background facts and the concrete recommendation.", "tip": "NCLEX Tip: Remember SBAR = Situation (what's happening now), Background (relevant history/context), Assessment (your interpretation), Recommendation (what you want done)."}, {"t": "mc", "q": "SBAR is primarily used in nursing practice to:", "o": ["Document a patient's discharge instructions", "Structure handoff communication and critical information sharing between members of the healthcare team", "Replace the need for a full head-to-toe physical assessment", "Provide patients with education about their diagnosis"], "a": [1], "e": ["", "", "SBAR is a communication tool, not a substitute for a physical assessment.", ""], "r": "SBAR (Situation, Background, Assessment, Recommendation) is a standardized communication framework designed to improve clarity and efficiency during handoffs and urgent provider notifications.", "tip": "NCLEX Tip: SBAR questions often test whether you can correctly sort a fact into the right one of the four categories — practice categorizing sample statements."}, {"t": "fib", "q": "Fill in the blank: In the SBAR communication tool, the letter 'B' stands for ______.", "blanks": [["background", "Background"]], "r": "The 'Background' component provides relevant clinical context such as admitting diagnosis, pertinent history, and recent treatments that led up to the current situation.", "tip": "NCLEX Tip: Memorize the SBAR acronym exactly — Situation, Background, Assessment, Recommendation — spelling questions and fill-in-the-blank formats test this directly."}, {"t": "mc", "q": "A new nurse is unsure how to organize an urgent phone call to the on-call provider about a patient's chest pain. Which framework should the charge nurse recommend?", "o": ["PIE charting", "SBAR", "The nursing process (ADPIE)", "SOAP notes"], "a": [1], "e": ["PIE (Problem, Intervention, Evaluation) is a charting format, not a verbal handoff communication tool.", "", "ADPIE is the nursing process framework used for planning care, not for a structured urgent verbal report.", "SOAP notes are a documentation format for progress notes, not designed for a real-time verbal safety report."], "r": "SBAR is specifically designed to standardize urgent, critical verbal communication between team members so that key information is not omitted.", "tip": "NCLEX Tip: SBAR = spoken/handoff communication tool; SOAP and PIE = written documentation formats. Don't confuse the two categories."}, {"t": "mc", "q": "According to Tanner's Model of Clinical Judgment, which of the following is the correct order of the four phases?", "o": ["Interpreting, Noticing, Responding, Reflecting", "Noticing, Interpreting, Responding, Reflecting", "Responding, Noticing, Reflecting, Interpreting", "Noticing, Responding, Interpreting, Reflecting"], "a": [1], "e": ["", "", "", ""], "r": "Tanner's Model of Clinical Judgment describes four interrelated phases: Noticing (perceiving the clinical situation), Interpreting (making sense of the data), Responding (deciding on and carrying out a course of action), and Reflecting (evaluating outcomes and learning for the future).", "tip": "NCLEX Tip: Remember the mnemonic 'N-I-R-R': Notice, Interpret, Respond, Reflect."}, {"t": "mc", "q": "A nurse observes that a patient is diaphoretic, appears fatigued, and becomes short of breath while walking to the exam room. According to Tanner's Model, this initial observation represents which phase?", "o": ["Reflecting", "Responding", "Noticing", "Interpreting"], "a": [2], "e": ["Reflecting occurs after the encounter, when the nurse reviews what happened and how care could be improved.", "Responding involves taking action based on a clinical judgment, which has not yet occurred here.", "", "Interpreting involves making sense of the data collected, which comes after the initial perception."], "r": "Noticing is the initial perceptual grasp of a clinical situation — recognizing relevant cues such as appearance, behavior, and vital signs before any interpretation has occurred.", "tip": "NCLEX Tip: 'Noticing' questions typically describe the nurse simply observing or gathering data, without any analysis or action yet."}, {"t": "mc", "q": "After integrating a patient's vital signs, occupational history, and socioeconomic barriers to conclude that the patient may have poorly controlled hypertension with early cardiopulmonary compromise, the nurse is engaging in which phase of Tanner's Model?", "o": ["Noticing", "Interpreting", "Responding", "Reflecting"], "a": [1], "e": ["Noticing is the initial data-gathering phase, which has already occurred by this point.", "", "Responding involves acting on the interpretation (e.g., notifying the provider), which has not yet happened in this scenario.", "Reflecting happens after the encounter is complete."], "r": "Interpreting is the phase where the nurse develops a sufficient understanding of the situation to respond, synthesizing subjective and objective data into a clinical picture.", "tip": "NCLEX Tip: Interpreting = 'making sense of it' — look for language about analyzing, integrating, or synthesizing data."}, {"t": "mc", "q": "A nurse notifies the provider, arranges diagnostic testing, and connects the patient with social work for medication assistance. According to Tanner's Model, this represents which phase?", "o": ["Interpreting", "Reflecting", "Responding", "Noticing"], "a": [2], "e": ["", "", "", ""], "r": "Responding is the phase in which the nurse selects and carries out an appropriate course of action based on the clinical judgment formed during interpreting.", "tip": "NCLEX Tip: Responding = the action phase — advocacy, notifying providers, and implementing interventions all belong here."}, {"t": "mc", "q": "After the patient visit, the nurse thinks about whether she missed any contributing factors and decides to discuss workplace-related illness patterns with her team. This is an example of which phase of Tanner's Model?", "o": ["Responding", "Reflecting", "Noticing", "Interpreting"], "a": [1], "e": ["", "", "", ""], "r": "Reflecting involves reviewing the encounter afterward to evaluate the effectiveness of the response and to identify ways to improve future clinical judgment — sometimes called reflection-on-action.", "tip": "NCLEX Tip: Reflecting is the only phase that occurs after the patient encounter has ended, and it drives ongoing clinical growth."}, {"t": "sata", "q": "Which of the following nursing actions align with the 'Reflecting' phase of Tanner's Clinical Judgment Model? Select all that apply.", "o": ["Considering whether social determinants of health were adequately assessed", "Auscultating the patient's heart and lung sounds", "Bringing a case to a team huddle to discuss improving future assessments", "Notifying the provider of abnormal vital signs", "Evaluating whether the chosen intervention achieved the desired outcome"], "a": [0, 2, 4], "e": ["", "This is data collection, which belongs to the Noticing phase.", "", "This is an action taken during the Responding phase.", ""], "r": "Reflecting involves evaluating the encounter after the fact — assessing whether assessments were thorough, whether outcomes were achieved, and identifying opportunities for practice improvement.", "tip": "NCLEX Tip: If an option describes an action happening during the visit, it's Noticing/Interpreting/Responding; if it happens afterward and involves self-evaluation, it's Reflecting."}, {"t": "mc", "q": "A nursing student asks why Tanner's Model is important in clinical practice. The best response is:", "o": ["\"It replaces the need to follow facility protocols.\"", "\"It provides a framework for understanding how nurses develop clinical judgment through an ongoing cycle of noticing, interpreting, responding, and reflecting.\"", "\"It is only used for new graduate nurses during orientation.\"", "\"It focuses solely on documentation accuracy.\""], "a": [1], "e": ["", "", "Tanner's Model applies to nurses at all experience levels, not just new graduates.", "Tanner's Model addresses the thinking process behind clinical decisions, not documentation specifically."], "r": "Tanner's Model of Clinical Judgment describes clinical reasoning as a cyclical, reflective process that helps nurses recognize patterns, make sound decisions, and continuously improve their practice.", "tip": "NCLEX Tip: Clinical judgment models like Tanner's often appear on exams as conceptual/'why' questions — know the purpose, not just the steps."}, {"t": "mc", "q": "A patient recently diagnosed with terminal cancer tells the nurse, \"If I promise to be a better person, maybe I'll get more time.\" This statement reflects which stage of Kübler-Ross's stages of grief?", "o": ["Denial", "Anger", "Bargaining", "Depression"], "a": [2], "e": ["Denial involves refusing to accept the diagnosis or its severity, not attempting to negotiate an outcome.", "Anger typically presents as frustration or resentment directed outward, not negotiation.", "", "Depression is characterized by sadness and withdrawal, not attempts to negotiate for more time."], "r": "Bargaining is the stage in which a person attempts to negotiate, often with a higher power, to postpone or reverse a loss, frequently framed as promises in exchange for more time or a better outcome.", "tip": "NCLEX Tip: Bargaining statements usually contain 'if...then' language ('If I do X, maybe Y will happen')."}, {"t": "mc", "q": "A patient states, \"There's no way these test results are right, there must be a mix-up with someone else's chart.\" This best reflects which stage of grief?", "o": ["Denial", "Acceptance", "Bargaining", "Anger"], "a": [0], "e": ["", "Acceptance involves coming to terms with the situation, which is the opposite of what is described here.", "Bargaining involves negotiating for a different outcome, not disbelief in the facts.", "Anger involves frustration or resentment, not disbelief of the diagnosis itself."], "r": "Denial is a defense mechanism in which the person refuses to believe the reality of the situation, often as an initial buffer against overwhelming news.", "tip": "NCLEX Tip: Denial = disbelief/refusal to accept facts; distinguish it from anger, which involves emotional frustration once the facts are acknowledged."}, {"t": "mc", "q": "Which nursing intervention is most appropriate for a patient in the anger stage of grief?", "o": ["Arguing with the patient to correct their misperceptions", "Avoiding the patient until the anger subsides", "Remaining nonjudgmental, allowing the patient to express emotion safely, and not taking the anger personally", "Immediately medicating the patient with a sedative"], "a": [2], "e": ["Arguing can escalate the patient's distress and damage the therapeutic relationship.", "Avoiding the patient can make them feel abandoned during a vulnerable time.", "", "Sedation is not an appropriate first-line response to a normal grief reaction and does not address the patient's emotional needs."], "r": "Nurses should recognize anger as a normal part of the grieving process, provide a safe outlet for emotional expression, and avoid becoming defensive or taking the behavior personally.", "tip": "NCLEX Tip: For emotional/behavioral stages of grief, the correct answer usually involves therapeutic presence and nonjudgmental listening rather than confrontation or avoidance."}, {"t": "sata", "q": "Which of the following are recognized stages in Kübler-Ross's model of grief? Select all that apply.", "o": ["Denial", "Bargaining", "Confrontation", "Depression", "Acceptance", "Delegation"], "a": [0, 1, 3, 4], "e": ["", "", "Confrontation is a communication technique, not one of Kübler-Ross's stages of grief.", "", "", "Delegation is a nursing management concept, not a stage of grief."], "r": "Kübler-Ross identified five stages of grief: denial, anger, bargaining, depression, and acceptance. Patients may move through these stages nonlinearly or revisit stages multiple times.", "tip": "NCLEX Tip: The five stages are Denial, Anger, Bargaining, Depression, Acceptance (mnemonic: DABDA)."}, {"t": "mc", "q": "A patient in the terminal stages of illness appears withdrawn, tearful, and states, \"What's the point of doing anything anymore?\" The nurse recognizes this as which stage of grief, and what is the priority nursing action?", "o": ["Anger; set firm limits on the patient's behavior", "Depression; sit with the patient, offer presence, and assess for safety/suicidal ideation", "Denial; correct the patient's misunderstanding of their prognosis", "Bargaining; encourage the patient to pray for more time"], "a": [1], "e": ["This is not an anger presentation, and limit-setting is not the priority response to sadness and withdrawal.", "", "The patient is not expressing disbelief of the diagnosis, so this is not denial.", "There is no bargaining language present in this statement."], "r": "Depression in the grieving process often involves sadness, withdrawal, and hopelessness; the nurse should provide a supportive presence and assess for safety concerns, including suicidal ideation, given the statement made.", "tip": "NCLEX Tip: Whenever a patient expresses hopelessness or 'what's the point,' always screen for safety/suicidal ideation as a priority, regardless of the underlying stage of grief."}, {"t": "mc", "q": "Which self-care strategy is most appropriate for a nurse who frequently cares for terminally ill patients and is experiencing signs of compassion fatigue?", "o": ["Taking on additional overtime shifts caring for similar patients to build resilience", "Avoiding emotional connection with future patients to prevent further distress", "Engaging in peer debriefing, setting boundaries, and seeking support from colleagues or counseling resources", "Suppressing feelings and focusing solely on task completion"], "a": [2], "e": ["Additional overtime without recovery time typically worsens compassion fatigue and burnout.", "Emotional detachment can compromise therapeutic relationships and does not resolve underlying compassion fatigue.", "", "Suppressing emotions is associated with increased burnout and does not provide healthy processing of grief."], "r": "Effective self-care for nurses experiencing compassion fatigue includes peer support, debriefing after difficult cases, setting healthy boundaries, and utilizing counseling or employee assistance resources.", "tip": "NCLEX Tip: Self-care questions favor answers involving support-seeking, boundary-setting, and healthy coping over avoidance or suppression."}, {"t": "mc", "q": "A dying patient's family asks the nurse, \"How long does she have?\" Which response demonstrates honest yet compassionate communication?", "o": ["\"I really can't say, you'll have to ask the doctor.\"", "\"It's impossible to know exactly, but based on the changes we're seeing, it may be a matter of days. I'll make sure you're kept informed as things change.\"", "\"Don't worry, she still has plenty of time.\"", "\"She could pass any minute now, you should prepare for the worst immediately.\""], "a": [1], "e": ["This deflects the question entirely rather than offering the honest, compassionate information the nurse is able to provide.", "", "This offers false reassurance that isn't necessarily accurate and avoids the family's real question.", "This is unnecessarily blunt and alarming without acknowledging the uncertainty inherent in prognosis."], "r": "Honest, compassionate communication acknowledges uncertainty while providing the clinical picture the family needs, and reassures them that they will be kept updated as the patient's condition evolves.", "tip": "NCLEX Tip: End-of-life communication should balance honesty with compassion — avoid false reassurance, avoid deflecting, and avoid unnecessarily harsh delivery."}, {"t": "mc", "q": "Which statement best reflects addressing a dying patient's spiritual needs?", "o": ["\"I'll go ahead and schedule a chaplain visit for you regardless of your preference.\"", "\"Would it be helpful for you to talk with a chaplain or spiritual leader, or is there anything else that would bring you comfort right now?\"", "\"Let's not talk about anything religious, it might upset you.\"", "\"I'm not comfortable discussing spiritual matters, so let's focus on your medications instead.\""], "a": [1], "e": ["Scheduling a visit without asking the patient's preference does not respect patient autonomy.", "", "Avoiding spiritual topics entirely may leave an important need unmet, especially near end of life.", "Deflecting the conversation dismisses a legitimate patient need and is not patient-centered."], "r": "Addressing spiritual needs should be patient-centered, offering options while respecting the patient's autonomy and individual beliefs.", "tip": "NCLEX Tip: Spiritual care questions favor open offers of support ('Would it help to...') over assumptions about what the patient needs or avoidance of the topic."}, {"t": "fib", "q": "Fill in the blank: The stage of grief in which a person attempts to negotiate for more time or a different outcome, often using 'if...then' language, is called ______.", "blanks": [["bargaining", "Bargaining"]], "r": "Bargaining involves attempting to negotiate, often with a higher power, in hopes of delaying or reversing a loss.", "tip": "NCLEX Tip: DABDA — Denial, Anger, Bargaining, Depression, Acceptance — memorize this order for Kübler-Ross's stages."}, {"t": "mc", "q": "The primary goal of palliative care is to:", "o": ["Cure the underlying terminal illness", "Relieve suffering and improve quality of life for patients with serious illness, regardless of prognosis", "Provide care only during the final 24 to 48 hours of life", "Replace curative treatment entirely once it is initiated"], "a": [1], "e": ["Palliative care focuses on comfort and symptom management rather than curing the disease itself.", "", "Palliative care can be provided at any point during a serious illness, not only in the final hours of life.", "Palliative care can be provided alongside curative treatment; it does not require that curative treatment be stopped."], "r": "Palliative care aims to relieve suffering and improve quality of life for patients facing serious illness, and it can be provided concurrently with curative treatment at any stage of the illness trajectory.", "tip": "NCLEX Tip: Palliative care ≠ only end-of-life care; hospice is end-of-life focused, but palliative care can begin at diagnosis."}, {"t": "mc", "q": "A patient receiving hospice care for end-stage heart failure develops increased dyspnea. Which nursing action is the priority?", "o": ["Encourage aggressive fluid resuscitation to improve cardiac output", "Administer prescribed opioids and position the patient to ease the work of breathing, focused on comfort", "Prepare the patient for transfer to the ICU for intubation", "Withhold all medications since the patient is on hospice"], "a": [1], "e": ["Aggressive fluid resuscitation is a curative-focused intervention that would not align with comfort-focused hospice goals.", "", "ICU transfer and intubation are not consistent with the goals of hospice/comfort care.", "Hospice patients still receive medications aimed at comfort and symptom relief; care is not withheld entirely."], "r": "In hospice/palliative care, the priority is comfort — using measures such as opioids for dyspnea and positioning to ease breathing — rather than curative or aggressive interventions.", "tip": "NCLEX Tip: For hospice/palliative questions, always choose the option that maximizes comfort over the option that is curative or invasive."}, {"t": "mc", "q": "Which of the following is an early sign that a patient is approaching the final hours of life?", "o": ["Increased appetite and thirst", "Cheyne-Stokes respirations and mottling of the extremities", "Improved level of consciousness", "Decreased need for pain medication"], "a": [1], "e": ["A decreased, not increased, appetite and thirst is typically seen near end of life.", "", "A decreasing, not improving, level of consciousness is expected as death approaches.", "Pain medication needs often remain the same or increase, not decrease, near end of life."], "r": "Physical signs of impending death include Cheyne-Stokes respirations (a pattern of waxing and waning breathing with periods of apnea), mottling, decreased urine output, and decreasing level of consciousness.", "tip": "NCLEX Tip: Learn the classic end-of-life signs: decreased intake, mottling, Cheyne-Stokes or irregular respirations, decreased urine output, and withdrawal from surroundings."}, {"t": "mc", "q": "Immediately after a patient's death is verified, what should the nurse do before beginning postmortem care?", "o": ["Immediately remove all tubes and lines regardless of circumstances", "Notify the responsible provider and check for any organ donation or autopsy orders before touching lines, tubes, or dressings", "Begin bathing the body right away to prepare for family viewing", "Discard the patient's personal belongings to make room for the next admission"], "a": [1], "e": ["Tubes and lines should not be removed until it is confirmed that no autopsy or organ donation restrictions apply.", "", "Bathing should not begin until notifications are complete and any donation/autopsy orders have been checked, as this may affect what can be done to the body.", "Personal belongings must be inventoried and secured per facility policy, not discarded."], "r": "Before beginning postmortem care, the nurse must verify death per policy, notify the responsible provider, and check for organ donation or autopsy orders, since these may restrict removal of lines, tubes, or dressings.", "tip": "NCLEX Tip: Sequence matters in postmortem care questions — verification and notification always come before physical care of the body."}, {"t": "sata", "q": "Which actions are appropriate during postmortem care when no autopsy or organ donation is pending? Select all that apply.", "o": ["Positioning the body supine with a pillow under the head to slightly flex the neck", "Removing intravenous lines and catheters per policy, then documenting the action", "Leaving the eyes open per standard protocol", "Placing an identification tag on the body per facility protocol", "Cleansing the body, including a gentle bed bath and oral care", "Discarding the patient's dentures if they do not stay in place"], "a": [0, 1, 3, 4], "e": ["", "", "Eyes should be gently closed, often with a moistened compress, not left open.", "", "", "Dentures that do not stay in place should be placed in a labeled cup and sent with the patient, not discarded."], "r": "Appropriate postmortem care includes proper positioning, removal of lines/tubes per policy (when no autopsy/donation restrictions apply), identification tagging, and gentle cleansing of the body, always preserving dignity.", "tip": "NCLEX Tip: Postmortem care questions often test attention to detail — watch for 'trick' distractors like discarding items or leaving eyes open that violate dignity and policy."}, {"t": "mc", "q": "A family member asks to help wash and dress their deceased loved one during postmortem care. What is the nurse's best response?", "o": ["\"I'm sorry, only staff are allowed to touch the body.\"", "\"Of course, I can guide you through helping with the care if you'd like to participate.\"", "\"That's not necessary, we'll take care of everything.\"", "\"You'll need to wait outside until we're completely finished.\""], "a": [1], "e": ["Family involvement in postmortem care is generally welcomed and can be therapeutic, when appropriate and per family wishes.", "", "This dismisses the family's expressed wish to participate in a meaningful ritual of care.", "Excluding the family from a process they wish to be part of removes an opportunity for closure and connection."], "r": "Postmortem care should offer the family the choice to participate in preparing the body, as this can be a meaningful part of the grieving process and honors the family's cultural and personal preferences.", "tip": "NCLEX Tip: Family-centered care extends to postmortem care — offering choices and involvement to the family is almost always the therapeutic answer."}, {"t": "mc", "q": "If a patient's death is due to an infectious disease such as tuberculosis, the nurse should:", "o": ["Skip standard precautions since the patient has already died", "Follow isolation and morgue transfer protocols and continue to use appropriate PPE", "Remove all PPE immediately after pronouncement of death", "Only use PPE if the family requests it"], "a": [1], "e": ["Standard precautions still apply after death and should not be skipped.", "", "PPE must continue to be used throughout postmortem care and transfer when an infectious disease is involved.", "PPE use is based on infection control policy and risk, not family preference."], "r": "When death is due to an infectious disease, the nurse must continue to follow isolation precautions, use appropriate PPE, and follow facility/institutional protocols for morgue transfer to protect staff and others.", "tip": "NCLEX Tip: Standard precautions and transmission-based precautions remain in effect after death — infection control does not stop at the time of death."}, {"t": "mc", "q": "Prior to postmortem care, the nurse should inventory and secure the patient's valuables. Why is this step important?", "o": ["It is not actually necessary if the family is present", "To ensure accountability, prevent loss, and provide the family with documentation of the patient's belongings", "So the hospital can retain the items for administrative use", "It is only required if the patient died of natural causes"], "a": [1], "e": ["Inventorying valuables should occur regardless of whether family is present, to ensure proper documentation and accountability.", "", "Hospitals do not retain patient valuables for their own use; items are secured for the family.", "Inventorying and securing valuables is standard practice regardless of the cause of death."], "r": "Inventorying and securing valuables protects against loss, provides legal accountability, and allows the family to receive an accurate accounting/receipt of the patient's belongings.", "tip": "NCLEX Tip: Documentation and accountability (who was present, what was inventoried, and at what time) are recurring themes in postmortem care questions."}, {"t": "fib", "q": "Fill in the blank: During postmortem care, if dentures do not stay in place in the patient's mouth, they should be placed in a labeled ______ and sent with the patient.", "blanks": [["cup", "denture cup"]], "r": "If dentures cannot be kept in place in the mouth, they should be placed in a labeled denture cup so they are not lost and can accompany the patient to the morgue or funeral home.", "tip": "NCLEX Tip: Always look for the 'labeling' detail in postmortem care scenarios — mislabeling or losing items is a common safety/quality concern tested on exams."}, {"t": "mc", "q": "Which communication practice is most effective for promoting patient safety during a shift handoff?", "o": ["Handoff communication conducted quickly in the hallway with minimal detail", "A structured handoff (e.g., SBAR) that includes an opportunity for the receiving nurse to ask questions", "Written notes left at the nurses' station with no verbal report", "Handoff communication given only if time allows"], "a": [1], "e": ["Rushed, low-detail handoffs increase the risk of missed or miscommunicated critical information.", "", "Written notes without verbal exchange remove the opportunity for real-time clarification and questions.", "Handoff communication is a required patient safety practice and should never be optional or skipped due to time constraints."], "r": "Structured handoff tools such as SBAR, combined with an interactive opportunity for questions, reduce communication errors and support continuity and safety of patient care.", "tip": "NCLEX Tip: Safety-focused communication questions favor structured, interactive handoff processes over informal or one-way communication."}, {"t": "mc", "q": "A nurse notices a colleague did not perform hand hygiene before entering a patient's room. Using principles of assertive communication, the best response is:", "o": ["Say nothing to avoid conflict", "Report the colleague to management without speaking to them first", "Directly and respectfully remind the colleague, \"I noticed you didn't sanitize before going in — let's make sure we both do that for patient safety.\"", "Complain about the colleague to other coworkers"], "a": [2], "e": ["Saying nothing allows a patient safety risk to go unaddressed.", "Escalating without first addressing the issue directly can damage trust and skips an opportunity for immediate correction.", "", "Gossiping about a colleague is unprofessional and does not resolve the safety concern."], "r": "Assertive, respectful, direct communication that addresses a safety concern in the moment is the most effective and professional approach, and models a just culture of safety.", "tip": "NCLEX Tip: On interprofessional communication questions, prioritize direct, respectful, and immediate communication over avoidance, gossip, or bypassing the individual entirely."}, {"t": "mc", "q": "A nurse is caring for a patient who speaks limited English. What is the priority action when discussing a new terminal diagnosis?", "o": ["Have a family member interpret to save time", "Use a qualified medical interpreter to ensure accurate, unbiased communication", "Use simple gestures and hope the patient understands", "Postpone the conversation indefinitely until the patient learns English"], "a": [1], "e": ["Family members may unintentionally filter, omit, or misinterpret sensitive medical information and should not be relied upon for formal interpretation of serious diagnoses.", "", "Gestures alone are inadequate for conveying complex, sensitive medical information such as a terminal diagnosis.", "Delaying indefinitely denies the patient timely, necessary information about their condition."], "r": "A qualified medical interpreter should be used to ensure accurate communication, protect patient confidentiality, and reduce the risk of miscommunication, especially for sensitive or complex information.", "tip": "NCLEX Tip: Family members should not serve as medical interpreters for sensitive information — always prioritize a qualified/certified interpreter."}, {"t": "mc", "q": "Which nonverbal behavior by the nurse best demonstrates active, therapeutic listening?", "o": ["Standing near the doorway while checking the time", "Maintaining appropriate eye contact, an open posture, and leaning slightly toward the patient", "Crossing arms and looking at the computer screen while the patient speaks", "Multitasking with charting while nodding occasionally"], "a": [1], "e": ["This posture signals disengagement and time pressure rather than attentiveness.", "", "Crossed arms and lack of eye contact are closed, disengaged nonverbal cues.", "Multitasking during a sensitive conversation suggests divided attention rather than full presence."], "r": "Open body posture, appropriate eye contact, and leaning slightly toward the patient are nonverbal behaviors that convey attentiveness and build therapeutic rapport.", "tip": "NCLEX Tip: Nonverbal communication (SOLER: Sit squarely, Open posture, Lean in, Eye contact, Relax) is frequently tested alongside verbal techniques."}, {"t": "mc", "q": "A patient becomes tearful while discussing a new cancer diagnosis. The nurse remains quietly present without speaking for a moment. This use of silence is:", "o": ["Nontherapeutic because it fails to fill an awkward gap", "Therapeutic because it allows the patient time to process emotions and continue at their own pace", "A sign the nurse does not know what to say", "Only appropriate with pediatric patients"], "a": [1], "e": ["Silence in this context is a purposeful and therapeutic technique, not a failure of communication.", "", "When used purposefully, silence reflects skilled communication rather than a lack of knowledge.", "Therapeutic silence is appropriate across the lifespan, not limited to pediatric patients."], "r": "Silence gives the patient time to process emotions, organize thoughts, and continue sharing at a comfortable pace; it is a recognized therapeutic communication technique.", "tip": "NCLEX Tip: Don't assume silence is a communication failure — purposeful silence is one of the core therapeutic techniques tested on nursing exams."}, {"t": "mc", "q": "Which of the following best distinguishes a therapeutic nurse-patient relationship from a social relationship?", "o": ["A therapeutic relationship is focused on meeting the mutual needs of both parties", "A therapeutic relationship is goal-directed and focused on meeting the patient's needs, with defined professional boundaries", "A therapeutic relationship has no defined beginning or end", "A therapeutic relationship allows the nurse to share personal problems with the patient for emotional support"], "a": [1], "e": ["Social relationships are typically mutual; therapeutic relationships are patient-centered, not mutual in focus.", "", "Therapeutic relationships have defined phases (orientation, working, termination), unlike open-ended social relationships.", "Sharing personal problems with the patient for the nurse's own support crosses a professional boundary and is inappropriate."], "r": "A therapeutic relationship is purposeful, patient-centered, and time-limited with clear professional boundaries, distinguishing it from a social relationship that is mutual and boundaryless.", "tip": "NCLEX Tip: Boundary questions test whether you recognize when a nurse is meeting their own needs instead of the patient's — this is always a red flag."}, {"t": "mc", "q": "When delivering serious news to a patient using a stepwise communication approach, which action should occur first?", "o": ["Immediately state the diagnosis without preamble", "Assess the patient's current understanding and readiness to receive information before sharing details", "Provide a detailed treatment plan before confirming the diagnosis", "Leave the room immediately after sharing the news to give the patient privacy"], "a": [1], "e": ["Delivering the diagnosis abruptly without first assessing readiness can increase distress and reduce the patient's ability to process the information.", "", "Discussing treatment before confirming understanding of the diagnosis skips a necessary step in breaking bad news.", "Leaving immediately after delivering difficult news does not provide needed emotional support."], "r": "Structured approaches to breaking bad news (such as SPIKES) begin by assessing the patient's perception and readiness before delivering information, then provide support afterward rather than leaving the patient alone.", "tip": "NCLEX Tip: When breaking bad news, the sequence generally includes assessing understanding, warning the patient information is coming, delivering it clearly, and providing emotional support afterward."}, {"t": "mc", "q": "A nurse is caring for a pediatric patient who is frightened about an upcoming procedure. Which communication approach is most developmentally appropriate for a 5-year-old child?", "o": ["Provide a detailed technical explanation of the procedure", "Use simple, concrete language and allow the child to handle safe equipment before the procedure", "Speak only to the parents and exclude the child from the conversation", "Tell the child there is nothing to worry about and change the subject"], "a": [1], "e": ["Detailed technical explanations exceed a 5-year-old's cognitive developmental level and may increase confusion or fear.", "", "Excluding the child ignores their developmental need for age-appropriate involvement and can increase anxiety and mistrust.", "Dismissing the child's fear and changing the subject does not address their legitimate concerns."], "r": "Young children benefit from simple, concrete explanations and hands-on, non-threatening exposure to equipment, which reduces fear and supports developmentally appropriate coping.", "tip": "NCLEX Tip: Match communication strategies to developmental stage — preschool-age children respond well to concrete, hands-on explanations rather than abstract or lengthy verbal information."}, {"t": "sata", "q": "Which of the following are appropriate nursing actions when communicating with a patient from a different cultural background regarding end-of-life decisions? Select all that apply.", "o": ["Ask the patient and family about their cultural and religious preferences regarding death and dying", "Assume the patient shares the nurse's own beliefs about end-of-life care", "Use a qualified interpreter if there is a language barrier", "Involve family members in decision-making if that aligns with the patient's cultural values", "Insist that all decisions be made solely by the patient regardless of cultural context"], "a": [0, 2, 3], "e": ["", "Assuming shared beliefs ignores the patient's individual cultural context and can lead to culturally insensitive care.", "", "", "Some cultures value family or collective decision-making; insisting on isolated individual decision-making regardless of cultural values ignores patient- and family-centered, culturally sensitive care."], "r": "Culturally sensitive end-of-life communication involves asking about and respecting the patient's/family's cultural and religious preferences, using interpreters as needed, and adapting decision-making processes to align with the patient's values rather than making assumptions.", "tip": "NCLEX Tip: Cultural competence questions favor asking and individualizing care over assuming or applying a one-size-fits-all Western model of autonomy."}, {"t": "mc", "q": "A nurse is documenting a difficult conversation with a family about goals of care. Which entry best reflects objective, professional documentation?", "o": ["\"Family was rude and difficult to deal with today.\"", "\"Family verbalized understanding of the patient's prognosis and requested time to discuss options; social work notified per family request.\"", "\"Family seemed upset, not sure why.\"", "\"Spent too long talking to an unreasonable family.\""], "a": [1], "e": ["This is a subjective, judgmental statement rather than objective documentation.", "", "This lacks the objective specificity expected in professional documentation.", "This is unprofessional, judgmental language and is not appropriate for the medical record."], "r": "Professional documentation should be objective, factual, and free of judgmental language, describing what was communicated and any actions taken as a result.", "tip": "NCLEX Tip: Avoid subjective or judgmental language (e.g., 'rude,' 'unreasonable') in documentation — stick to observable facts and direct quotes when relevant."}, {"t": "mc", "q": "Case-based question: Mr. James (52, hypertension, smoker, financial barriers to care) reports fatigue and exertional dyspnea. During the visit, Susan speaks empathetically about his job stress and provides low-cost dietary education. This best demonstrates the integration of which two concepts?", "o": ["SBAR and hand hygiene", "Therapeutic communication and awareness of social determinants of health (SDOH)", "Postmortem care and grief stages", "The EKG lead placement and heart block interpretation"], "a": [1], "e": ["SBAR and hand hygiene are not the focus of this interaction.", "", "Postmortem care and grief are unrelated to this outpatient visit.", "This scenario does not involve EKG interpretation."], "r": "This scenario illustrates how therapeutic communication (empathetic listening, tailored education) is integrated with recognition of social determinants of health (financial strain, occupational exposure) to provide holistic, patient-centered care.", "tip": "NCLEX Tip: SDOH-focused case scenarios test whether you recognize nonclinical barriers (income, housing, occupation) that affect a patient's ability to manage chronic disease."}, {"t": "mc", "q": "Which best describes why Susan (the nurse in the Mr. James case) reflects on her assessment after the visit and brings the case to a team huddle?", "o": ["To assign blame for missing the diagnosis initially", "To engage in reflective practice that improves future assessment of SDOH and identifies community health patterns", "Because it is a mandatory reporting requirement for all patient visits", "To avoid documenting the visit formally"], "a": [1], "e": ["Reflective practice is about growth and improvement, not blame.", "", "This is not describing a mandatory reporting requirement but a voluntary professional reflective practice.", "Reflection and team discussion do not replace or avoid formal documentation."], "r": "Bringing a case to a team huddle for discussion reflects the 'Reflecting' phase of Tanner's Model — using the experience to improve future clinical judgment and identify broader patterns, such as workplace-related illness in the community.", "tip": "NCLEX Tip: Reflective practice case questions test whether you understand that reflection drives quality improvement, not blame or punitive action."}, {"t": "bowtie", "q": "The nurse is caring for a patient whose spouse died 2 hours ago. The patient's adult child is present and the family has indicated no autopsy or organ donation is planned.", "conditionOptions": ["Uncomplicated expected death, routine postmortem care indicated", "Suspected homicide requiring medical examiner involvement", "Active resuscitation still required", "Suspected infectious outbreak requiring CDC notification"], "correctCondition": 0, "conditionExplain": ["", "This scenario describes an expected death with no indication of foul play.", "The patient has already died; resuscitation is not the focus of this scenario.", "No infectious disease concern is described in this scenario."], "actions": ["Verify death and notify the responsible provider", "Immediately remove all lines without checking policy", "Offer the family privacy and the option to help with care", "Discard the patient's belongings to save time", "Position the body supine with a pillow under the head"], "correctActions": [0, 2], "actionsExplain": ["", "Lines should only be removed after confirming no autopsy/organ donation restrictions and per policy — doing so 'immediately without checking' is unsafe practice.", "", "Belongings must be inventoried and secured, never discarded.", "This is an appropriate step in body preparation, but verifying death/notifying the provider and supporting the family take priority as the immediate next actions in this scenario."], "monitor": ["Family's emotional response and coping", "Patient's identification band and valuables inventory", "Patient's blood glucose trend", "Patient's most recent physical therapy notes"], "correctMonitor": [0, 1], "monitorExplain": ["", "", "Blood glucose trends are not relevant to postmortem care.", "Physical therapy notes are not a priority in this context."], "r": "For an uncomplicated, expected death, the priority actions are verification/notification, offering the family privacy and involvement, and proper body positioning, while monitoring the family's emotional needs and ensuring accurate identification/valuables documentation.", "tip": "NCLEX Tip: Bowtie questions require choosing the client's likely condition, the 2 most appropriate actions, and 2 parameters to monitor — read the full stem carefully before selecting the condition, since it anchors the rest of your choices.", "actionsCount": 2, "monitorCount": 2}, {"t": "mc", "q": "A patient says, \"I don't want to talk about my diagnosis right now.\" The nurse's best response is:", "o": ["\"You really should talk about it, it will help you cope.\"", "\"That's fine, I'm here whenever you're ready to talk.\"", "\"Okay, I'll just tell your family instead.\"", "\"You have to talk about it eventually, so let's do it now.\""], "a": [1], "e": ["This pressures the patient against their stated wishes and disregards their autonomy.", "", "This bypasses the patient's own right to decide when and with whom to share information.", "This pressures the patient and does not respect their expressed boundary."], "r": "Respecting a patient's stated wish not to discuss a topic while remaining available conveys acceptance and preserves trust, a core element of a therapeutic relationship.", "tip": "NCLEX Tip: Respecting patient autonomy and pacing, especially around emotionally difficult topics, is almost always the correct nursing approach."}, {"t": "mc", "q": "Which of the following is an example of 'offering self' as a therapeutic communication technique?", "o": ["\"I don't have time to sit with you right now.\"", "\"I'll stay here with you for a while if that would help.\"", "\"Someone will be in to see you eventually.\"", "\"You should call a friend if you're feeling lonely.\""], "a": [1], "e": ["This declines to be present, the opposite of offering self.", "", "This is vague and does not offer the nurse's presence.", "This redirects to another person rather than the nurse offering their own presence."], "r": "Offering self involves making time available to a patient without expecting a specific response, communicating genuine care and availability.", "tip": "NCLEX Tip: 'Offering self' specifically means offering your presence/time, not offering advice or resources."}, {"t": "mc", "q": "A nurse says to a patient, \"So, if I understand correctly, you're most worried about how your family will manage financially?\" This is an example of:", "o": ["Clarifying", "Giving advice", "Presenting reality", "Defending"], "a": [0], "e": ["", "This does not tell the patient what to do; it checks understanding.", "Presenting reality would gently correct a misperception, not check understanding.", "Defending would protect a third party from criticism, which is not occurring here."], "r": "Clarifying involves checking that the nurse's understanding of the patient's message is accurate, which promotes mutual understanding.", "tip": "NCLEX Tip: Clarifying statements often begin with 'So you're saying...' or 'If I understand correctly...'"}, {"t": "mc", "q": "Which response is an example of the nontherapeutic technique of 'stereotyping'?", "o": ["\"Every man in his 50s worries about his health, so don't feel bad.\"", "\"Tell me more about what's worrying you.\"", "\"It sounds like you're feeling anxious about your test results.\"", "\"What would help you feel more at ease right now?\""], "a": [0], "e": ["", "This is an open-ended exploring statement.", "This is reflecting feelings.", "This is an open-ended question inviting further discussion."], "r": "Stereotyping applies a generalized assumption to an individual based on a category (age, gender, diagnosis) rather than treating the patient as a unique person, which can minimize their specific experience.", "tip": "NCLEX Tip: Watch for generalizations like 'everyone' or 'most people your age' — these are classic stereotyping distractors."}, {"t": "mc", "q": "A patient asks the nurse, \"Do you think I'm going to die from this?\" Which response best demonstrates therapeutic honesty?", "o": ["\"Of course not, you'll be just fine.\"", "\"That's a hard question. What has the care team told you so far about your condition?\"", "\"I really don't know anything about your case.\"", "\"Let's not talk about such negative things.\""], "a": [1], "e": ["This offers false reassurance about an uncertain outcome.", "", "This deflects responsibility and avoids engaging with the patient's fear.", "This dismisses a legitimate and important concern."], "r": "Exploring what the patient already understands and inviting them to share their concerns respects their need for honest information while assessing their current understanding before providing further details.", "tip": "NCLEX Tip: When faced with a difficult existential question, explore the patient's own understanding and feelings first rather than answering definitively or avoiding the topic."}, {"t": "mc", "q": "Which of the following best demonstrates 'validation' as a therapeutic communication technique?", "o": ["\"You shouldn't feel that way about your diagnosis.\"", "\"It makes sense that you'd feel overwhelmed given everything you're facing.\"", "\"Everyone deals with this differently, so it's hard to say what's normal.\"", "\"Let's change the subject to something happier.\""], "a": [1], "e": ["This denies the legitimacy of the patient's feelings.", "", "This is vague and does not validate the patient's specific feelings.", "This avoids the patient's feelings altogether."], "r": "Validation acknowledges that a patient's emotional response is understandable and legitimate given their circumstances, which builds trust and rapport.", "tip": "NCLEX Tip: Validating statements normalize a patient's feelings as a reasonable reaction to their situation, without judgment."}, {"t": "mc", "q": "A nurse practicing motivational interviewing with a patient who smokes would most likely use which technique?", "o": ["Telling the patient they must quit smoking immediately", "Asking open-ended questions to explore the patient's own reasons for wanting to change", "Ignoring the smoking behavior entirely", "Threatening to withhold care unless the patient quits"], "a": [1], "e": ["This is directive and does not engage the patient's own motivation.", "", "Ignoring the behavior misses an opportunity for supportive engagement.", "This is coercive and unethical, damaging the therapeutic relationship."], "r": "Motivational interviewing uses open-ended questions, reflective listening, and exploration of the patient's own values and reasons for change to build internal motivation, rather than external pressure.", "tip": "NCLEX Tip: Motivational interviewing is patient-centered and avoids confrontation, judgment, or ultimatums."}, {"t": "sata", "q": "Which of the following are examples of nontherapeutic communication techniques? Select all that apply.", "o": ["Asking 'why' questions that put the patient on the defensive", "Using clarifying statements", "Giving generalized reassurance without basis", "Belittling a patient's expressed feelings", "Reflecting feelings back to the patient"], "a": [0, 2, 3], "e": ["", "This is a therapeutic technique.", "", "", "This is a therapeutic technique."], "r": "Nontherapeutic techniques include defensive 'why' questioning, false/generalized reassurance, and belittling feelings, all of which can shut down communication and damage trust; clarifying and reflecting are therapeutic techniques.", "tip": "NCLEX Tip: Build a mental checklist of therapeutic vs. nontherapeutic techniques so you can quickly sort SATA options."}, {"t": "mc", "q": "A nurse is caring for a patient who has just received an unexpected poor prognosis. According to principles of therapeutic communication, the nurse's INITIAL response should focus on:", "o": ["Providing a detailed explanation of all treatment options", "Acknowledging the emotional impact of the news and allowing the patient time to process", "Immediately contacting the family without the patient's input", "Changing the subject to future appointment scheduling"], "a": [1], "e": ["Detailed treatment discussions are often better delayed until the patient has processed the initial emotional shock.", "", "Contacting family without patient input bypasses the patient's autonomy and privacy rights.", "Moving to logistics before addressing emotional impact can feel dismissive."], "r": "Immediately after receiving difficult news, patients need time and space to process emotions; the nurse's priority is emotional support and presence before moving into detailed information or logistics.", "tip": "NCLEX Tip: After delivering or witnessing bad news, address emotional needs first — detailed planning discussions can typically wait."}, {"t": "mc", "q": "Which best demonstrates the therapeutic technique of 'summarizing' at the end of a patient interaction?", "o": ["\"Well, I have to go now.\"", "\"So today we talked about your pain management plan and your concerns about going home. Let's follow up on both tomorrow.\"", "\"You didn't really tell me anything useful today.\"", "\"I'll just read your chart for updates instead of asking you.\""], "a": [1], "e": ["This ends the conversation without providing closure or review.", "", "This is dismissive and inaccurate framing of the conversation.", "This bypasses direct patient communication."], "r": "Summarizing reviews the main points discussed during an interaction, providing closure and ensuring shared understanding of what was covered and any follow-up needed.", "tip": "NCLEX Tip: Summarizing is typically used to close a conversation, distinguishing it from restating or reflecting, which occur mid-conversation."}, {"t": "mc", "q": "The nurse notices a patient's words express calm acceptance, but their body language shows clenched fists and a tense jaw. Using the technique of 'confrontation,' the nurse might say:", "o": ["\"You seem calm, so I won't worry about you.\"", "\"I notice you say you're okay, but your body seems tense. Can you tell me more about how you're really feeling?\"", "\"I don't believe anything you're telling me.\"", "\"Let's just move on to the next topic.\""], "a": [1], "e": ["This ignores an observed discrepancy that could reveal important information.", "", "This is accusatory rather than gently pointing out an observed discrepancy.", "This avoids addressing an important observed inconsistency."], "r": "Confrontation, used therapeutically, involves gently pointing out discrepancies between a patient's words and nonverbal behavior to help them gain insight, without being accusatory.", "tip": "NCLEX Tip: Therapeutic confrontation is gentle and curious, not accusatory or confrontational in tone."}, {"t": "mc", "q": "A nurse is teaching a patient about a new diagnosis and periodically asks the patient to explain the information back in their own words. This technique is called:", "o": ["Restating", "Teach-back", "Confrontation", "Stereotyping"], "a": [1], "e": ["Restating repeats the patient's own words back to them, which is different from having them explain new information.", "", "Confrontation addresses discrepancies, not comprehension of education.", "Stereotyping applies generalized assumptions, unrelated to this scenario."], "r": "Teach-back is a technique where the patient explains new information in their own words, allowing the nurse to verify understanding and correct any misconceptions.", "tip": "NCLEX Tip: Teach-back is a key patient safety and health literacy strategy, especially for discharge teaching and medication instructions."}, {"t": "mc", "q": "During a bedside shift report, the outgoing nurse states, \"Mr. Diaz has a Foley catheter, is NPO after midnight for surgery, and his last set of vitals were stable.\" This best fits which part of SBAR?", "o": ["Situation", "Background", "Assessment", "Recommendation"], "a": [1], "e": ["Situation is typically a brief statement of who the patient is and the current issue.", "", "Assessment reflects clinical interpretation, not straightforward background facts.", "Recommendation involves a specific request or suggested action."], "r": "This statement provides relevant background information (current orders/status) that gives context for the shift, fitting the 'Background' component of SBAR.", "tip": "NCLEX Tip: Background includes relevant history, current orders, and recent changes — think of it as 'what you need to know to understand the situation.'"}, {"t": "mc", "q": "A nurse calling with an SBAR report says, \"I recommend we obtain an order for a repeat potassium level given her cardiac history.\" This is an example of:", "o": ["Situation", "Background", "Assessment", "Recommendation"], "a": [3], "e": ["", "", "", ""], "r": "This is the 'Recommendation' component, where the nurse suggests a specific, actionable next step based on their assessment of the situation.", "tip": "NCLEX Tip: Recommendation statements
