ing the infusion rate does not address catheter dwell time concerns."], "r": "Nurses should follow facility policy regarding IV site rotation and maximum dwell time, which helps to reduce the risk of phlebitis and infection even in the absence of current complications.", "tip": "NCLEX Tip: Even an IV site that looks fine should be rotated per policy/clinical indication to minimize complication risk over time."}, {"t": "mc", "q": "Which of the following best describes the purpose of using an infusion pump rather than gravity for IV administration?", "o": ["Infusion pumps eliminate the need for any nursing assessment of the IV site", "Infusion pumps provide more precise control over infusion rate and volume, which is important for medications requiring exact dosing", "Infusion pumps are only used for oral medications", "Infusion pumps are interchangeable with gravity administration with no difference in accuracy"], "a": [1], "e": ["Pumps still require regular nursing assessment of the site and system.", "", "Infusion pumps are used for IV, not oral, medication delivery.", "Pumps provide more precise, consistent control than gravity infusion, which can be affected by patient position and tubing height."], "r": "Infusion pumps provide precise, consistent control of infusion rate and volume, which is especially critical for high-alert medications, pediatric patients, and therapies requiring exact titration.", "tip": "NCLEX Tip: Use infusion pumps for high-alert medications, vasoactive drips, and situations requiring precise titration; gravity may be used for routine, less critical infusions per policy."}, {"t": "mc", "q": "Which patient teaching point is most appropriate regarding hand hygiene and IV site care at home for a patient being discharged with a peripheral IV for outpatient antibiotic therapy?", "o": ["\"You don't need to worry about hand hygiene since the dressing covers the site.\"", "\"Wash your hands before and after touching the IV site or dressing, and keep the site clean and dry.\"", "\"It's fine to get the IV site wet in the shower without any covering.\"", "\"You should remove the dressing yourself daily to inspect the site.\""], "a": [1], "e": ["Hand hygiene remains important even with a dressing in place, to prevent introducing pathogens during any site contact.", "", "The IV site and dressing should typically be protected from becoming wet to reduce infection risk, per facility/home care instructions.", "Patients should generally be instructed not to remove the dressing themselves unless specifically taught to do so, and should follow specific home care instructions for site monitoring."], "r": "Patient education for home IV care should include hand hygiene before and after touching the site or dressing, keeping the site clean and dry, and recognizing signs of complications to report.", "tip": "NCLEX Tip: Discharge teaching about IV therapy should always emphasize infection prevention practices the patient can perform independently at home."}, {"t": "mc", "q": "A nurse is comparing methods for obtaining venous blood samples in a patient without an existing IV. Which method is described as the standard technique taught in this course (excluding arterial sampling)?", "o": ["Arterial puncture", "Venipuncture using a needle and vacuum tube system, or a butterfly/winged needle set", "Capillary heel stick only", "Central line blood draw exclusively"], "a": [1], "e": ["Arterial techniques are explicitly excluded from this course's scope per the lesson content.", "", "Capillary heel sticks are primarily used in neonates/infants for small-volume sampling, not the standard adult venous blood draw method.", "While central line draws are possible when a central line is present, this is not the general/standard method taught for routine venous sampling."], "r": "Standard venous blood sampling methods include venipuncture using a needle and vacuum tube system or a butterfly (winged) needle set; arterial blood sampling and arterial lines are outside the scope of this particular course.", "tip": "NCLEX Tip: Read course-specific scope notes carefully — some content areas (like arterial line care) may be explicitly excluded from what you're responsible for knowing on a given exam."}, {"t": "mc", "q": "A patient develops localized erythema, warmth, and purulent drainage at a peripheral IV site 3 days after insertion. This finding is most consistent with:", "o": ["Infiltration", "Local site infection", "Air embolism", "Fluid overload"], "a": [1], "e": ["Infiltration does not typically produce purulent drainage.", "", "Air embolism causes systemic cardiopulmonary symptoms, not localized site drainage.", "Fluid overload causes systemic symptoms, not localized purulent drainage."], "r": "Purulent drainage, erythema, and warmth at an IV site suggest a local infection, requiring catheter removal, culture per policy, and monitoring for systemic signs of infection.", "tip": "NCLEX Tip: Purulent drainage is a hallmark of infection, distinguishing it from the serous/clear fluid that might be seen with infiltration."}, {"t": "mc", "q": "Which action should the nurse take FIRST upon suspecting infiltration at a peripheral IV site?", "o": ["Increase the infusion rate to flush the tissue", "Stop the infusion and remove the catheter, then apply appropriate treatment per protocol", "Apply heat immediately regardless of the type of fluid infiltrated", "Continue the infusion at the same rate and monitor for 24 hours"], "a": [1], "e": ["Increasing the rate would worsen tissue infiltration and damage.", "", "The type of solution should guide whether heat or cold is applied; this should not be assumed to be appropriate 'regardless' of fluid type.", "Continuing the infusion into infiltrated tissue can worsen tissue damage and is inappropriate."], "r": "When infiltration is suspected, the nurse should immediately stop the infusion, remove the catheter, elevate the extremity, and apply treatment (warm or cold compress depending on the infusing solution) per facility protocol.", "tip": "NCLEX Tip: Stopping the infusion and removing the catheter is always the first step for infiltration or extravasation — do not simply slow the rate and continue."}, {"t": "mc", "q": "Which of the following would be an appropriate nursing action for a patient with suspected phlebitis at an IV site?", "o": ["Continue the infusion in the same site and monitor every shift", "Discontinue the IV, apply a warm compress, and restart the IV in a different site", "Increase the flow rate to reduce vein irritation", "Apply a tourniquet above the site and leave the IV running"], "a": [1], "e": ["Continuing to infuse into an inflamed vein can worsen phlebitis and increase risk of thrombophlebitis.", "", "Increasing the flow rate would not reduce, and could worsen, vein irritation.", "Applying a tourniquet above an inflamed IV site is not an appropriate intervention."], "r": "When phlebitis is identified, the nurse should discontinue the IV at that site, apply a warm compress to promote comfort and resolution of inflammation, and restart the IV at a different site.", "tip": "NCLEX Tip: For phlebitis: DC the IV, warm compress, restart elsewhere. For infiltration: DC the IV, elevate, cold or warm compress per solution type, restart elsewhere."}, {"t": "mc", "q": "Which type of IV solution poses the greatest risk of phlebitis if administered peripherally over an extended period?", "o": ["Isotonic normal saline (0.9%)", "A highly concentrated, hypertonic solution such as high-dextrose TPN", "Lactated Ringer's solution", "Plain D5W administered briefly"], "a": [1], "e": ["Isotonic solutions are generally well tolerated peripherally.", "", "Lactated Ringer's is an isotonic solution generally well tolerated in short-term peripheral use.", "Brief infusion of D5W carries lower risk than prolonged infusion of a hypertonic solution."], "r": "Hypertonic solutions, such as high-concentration dextrose used in TPN, are highly irritating to peripheral veins and significantly increase the risk of phlebitis, which is why they typically require central venous access for administration.", "tip": "NCLEX Tip: The higher the osmolarity of a solution, the greater the risk of phlebitis when given peripherally — hypertonic solutions generally require central access."}, {"t": "sata", "q": "Which are recognized systemic complications of peripheral IV therapy? Select all that apply.", "o": ["Fluid overload", "Air embolism", "Local phlebitis", "Sepsis from catheter-related bloodstream infection", "Localized infiltration"], "a": [0, 1, 3], "e": ["", "", "Phlebitis is a local complication, not systemic.", "", "Infiltration is a local complication, not systemic."], "r": "Systemic complications of IV therapy include fluid overload, air embolism, and catheter-related bloodstream infection (sepsis), while phlebitis and infiltration are considered local complications confined to the IV site and surrounding tissue.", "tip": "NCLEX Tip: Sort IV complications into 'local' (infiltration, extravasation, phlebitis, thrombophlebitis, local infection) versus 'systemic' (fluid overload, air embolism, sepsis) categories for easier recall."}, {"t": "mc", "q": "A nurse caring for a patient receiving IV fluids assesses the four rights specific to IV therapy safety, including checking the IV solution against the order. Which additional check is essential before hanging a new IV bag?", "o": ["Checking the expiration date and inspecting the solution for clarity and particulate matter", "Assuming the solution is safe since it came from the pharmacy", "Skipping the label check if the nurse recognizes the bag from experience", "Only checking the bag if it is the patient's first IV fluid of the shift"], "a": [0], "e": ["", "Even pharmacy-prepared solutions must be independently verified by the nurse before administration.", "Labels must always be checked, regardless of the nurse's familiarity or experience.", "Every new IV bag requires verification, not just the first one of a shift."], "r": "Before hanging any IV solution, the nurse should check the expiration date, inspect for clarity and particulate matter or discoloration, and verify the solution against the order and patient identifiers.", "tip": "NCLEX Tip: Never assume a solution is safe just because it arrived from pharmacy — always independently verify the order, label, expiration, and solution appearance."}, {"t": "mc", "q": "Which nursing action reflects proper technique for changing a peripheral IV dressing?", "o": ["Using clean technique to remove the old dressing and sterile/aseptic technique to apply antiseptic and the new dressing", "Reusing the same dressing if it looks acceptable to save supplies", "Applying the new dressing without first assessing the insertion site", "Skipping hand hygiene since gloves will be worn"], "a": [0], "e": ["", "Dressings should be changed per policy or when soiled/loose, not simply reused to conserve supplies if change is indicated.", "The site should always be assessed for signs of complication before applying a new dressing.", "Hand hygiene must be performed even when gloves will be worn, both before donning and after removing them."], "r": "Proper technique for an IV dressing change includes removing the old dressing, assessing the site, applying antiseptic using sterile/aseptic technique, and securing a new, clean dressing, with hand hygiene performed throughout.", "tip": "NCLEX Tip: Hand hygiene should occur before and after glove use — gloves are not a substitute for hand hygiene."}, {"t": "mc", "q": "Which of the following patients would be the LEAST appropriate candidate for a standard peripheral IV catheter, and would more likely require central access instead?", "o": ["A patient needing a single dose of IV antibiotics", "A patient requiring long-term total parenteral nutrition (TPN)", "A patient receiving a routine isotonic fluid bolus", "A patient needing short-term pain medication via IV push"], "a": [1], "e": ["This is an appropriate use for a peripheral IV.", "", "This is an appropriate use for a peripheral IV.", "This is an appropriate use for a peripheral IV."], "r": "Long-term TPN requires a hypertonic solution that is highly irritating to peripheral veins and is best delivered through a central venous access device to prevent phlebitis and vein damage.", "tip": "NCLEX Tip: TPN, vesicants, and long-term or hyperosmolar therapies all point toward central access rather than peripheral IV therapy."}, {"t": "fib", "q": "Fill in the blank: A 22-gauge IV catheter is color-coded ______ and has a maximal flow rate of approximately 31 mL/min.", "blanks": [["blue", "Blue"]], "r": "A 22-gauge catheter is color-coded blue and has a maximal flow rate of approximately 31 mL/min, making it suitable for routine infusions in adults with normal-sized veins.", "tip": "NCLEX Tip: Memorize the full color-gauge-flow rate table: Yellow 24G/13, Blue 22G/31, Pink 20G/67, Green 18G/103, Gray 16G/236, Orange 14G/270."}, {"t": "mc", "q": "A nurse assesses a patient's IV site prior to administering a scheduled IV medication and notes no redness, swelling, or tenderness, with a brisk blood return upon aspiration. What should the nurse conclude?", "o": ["The site is likely infiltrated and should not be used", "The site appears patent and appropriate for medication administration", "The catheter must be removed immediately regardless of these findings", "No further assessment is needed for the remainder of the shift"], "a": [1], "e": ["These findings actually suggest a healthy, patent site, not infiltration.", "", "These reassuring findings do not indicate a need for immediate removal.", "IV sites should be reassessed periodically throughout the shift, not just once."], "r": "A patent IV site typically shows no signs of infiltration, phlebitis, or infection, and a brisk blood return on aspiration supports that the catheter tip remains within the vein, making it appropriate for medication administration.", "tip": "NCLEX Tip: Always assess IV site patency before administering IV push medications, particularly vesicant or irritant drugs."}, {"t": "mc", "q": "Which of the following best reflects appropriate nurse management of a peripheral IV access device throughout a shift?", "o": ["Assess the site once at the beginning of the shift only", "Regularly assess the site for complications, verify infusion rate and settings, and monitor the patient's response to therapy", "Rely solely on the infusion pump alarms to identify any problems", "Delegate all IV site assessments to unlicensed assistive personnel"], "a": [1], "e": ["A single assessment at the start of the shift is insufficient for ongoing monitoring of complications.", "", "Pump alarms do not identify all complications, such as early infiltration or phlebitis, so visual/physical assessment remains essential.", "Assessment of IV therapy is a nursing responsibility requiring clinical judgment and should not be delegated to unlicensed personnel."], "r": "Ongoing nurse management of IV therapy includes regular site assessment for complications, verification of infusion settings against the order, and monitoring the patient's response, since not all complications will trigger a pump alarm.", "tip": "NCLEX Tip: Never rely on pump alarms alone — infiltration and phlebitis can occur without triggering any alarm, so hands-on assessment is essential."}, {"t": "sata", "q": "A nurse is teaching a patient about home care of a peripheral IV site used for outpatient antibiotic therapy. Which statements by the patient indicate correct understanding? Select all that apply.", "o": ["\"I will call if I notice redness, swelling, or pain at the site.\"", "\"I can go swimming with the IV site uncovered.\"", "\"I should keep the dressing clean and dry.\"", "\"I will report any leaking fluid or the dressing coming loose.\"", "\"It's fine if the IV tubing gets kinked for a few hours.\""], "a": [0, 2, 3], "e": ["", "Swimming with the site uncovered increases infection risk and should be avoided per home care instructions.", "", "", "Kinked tubing can interrupt therapy and should be addressed promptly, not left kinked for an extended period."], "r": "Correct home care understanding includes reporting signs of complications (redness, swelling, pain, leaking, loose dressing) and keeping the site clean and dry; swimming with an uncovered site and prolonged tubing kinks are incorrect practices that should be corrected with further teaching.", "tip": "NCLEX Tip: 'Select all that apply' teaching evaluation questions require you to identify only the statements reflecting correct, safe understanding."}, {"t": "mc", "q": "Which of the following best describes the appropriate use of a saline lock (intermittent IV access device)?", "o": ["It requires continuous fluid infusion at all times", "It provides IV access for intermittent medication administration without continuous fluids, and is flushed per protocol to maintain patency", "It cannot be used for medication administration, only for continuous fluids", "It never needs to be flushed once inserted"], "a": [1], "e": ["A saline lock is specifically used when continuous fluids are not required.", "", "A saline lock is specifically designed for intermittent medication administration.", "Saline locks require periodic flushing per protocol to maintain patency and prevent clot formation."], "r": "A saline lock (intermittent access device) allows IV access to be maintained for intermittent medication administration without continuous fluid infusion, and requires periodic flushing (per facility protocol) to maintain patency.", "tip": "NCLEX Tip: Saline locks still require flushing before and after medication administration, and periodically per policy, to prevent occlusion."}, {"t": "mc", "q": "A patient is due for a scheduled IV antibiotic through a saline lock. Before administration, what should the nurse do first?", "o": ["Administer the antibiotic immediately without any assessment", "Assess the site for complications and flush the lock to verify patency before administering the medication", "Remove the saline lock and insert a new IV in a different extremity", "Skip flushing since antibiotics are not irritating to veins"], "a": [1], "e": ["Skipping assessment increases the risk of administering medication into an infiltrated or otherwise compromised site.", "", "There is no indication in this scenario that a new IV site is required if the current site is patent and free of complications.", "Flushing is necessary to verify patency and clear the line, regardless of the medication type."], "r": "Before administering any IV medication through a saline lock, the nurse should assess the site for complications and flush the line to confirm patency, ensuring safe delivery of the medication.", "tip": "NCLEX Tip: 'Assess and flush before administering' is a safety step that should never be skipped, even for medications thought to be less irritating."}, {"t": "bowtie", "q": "A patient receiving a peripheral IV infusion of normal saline reports increasing pain at the site. The nurse notes the site is cool, swollen, and taut, and the infusion pump is alarming for occlusion. There is no redness or warmth.", "conditionOptions": ["Infiltration of a non-vesicant IV fluid", "Local site infection", "Air embolism", "Fluid overload"], "correctCondition": 0, "conditionExplain": ["", "Infection would typically show warmth, redness, and possibly purulent drainage, not coolness.", "Air embolism causes systemic respiratory/cardiac symptoms, not a localized cool, swollen site.", "Fluid overload causes systemic symptoms (dyspnea, JVD), not a localized swollen, cool IV site."], "actions": ["Stop the infusion immediately", "Increase the infusion rate to clear the occlusion", "Remove the catheter after stopping the infusion", "Elevate the affected extremity", "Apply a tourniquet above the site and continue infusing"], "correctActions": [0, 2], "actionsExplain": ["", "Increasing the rate would push more fluid into the tissue, worsening the infiltration.", "", "Elevating the extremity is an appropriate supportive measure, but stopping the infusion and removing the catheter are the more immediate priority actions.", "Continuing to infuse into infiltrated tissue with a tourniquet applied would worsen tissue damage."], "monitor": ["Circulation, sensation, and movement of the affected extremity", "Degree and progression of swelling at the site", "Blood glucose every hour", "Sputum color and consistency"], "correctMonitor": [0, 1], "monitorExplain": ["", "", "Blood glucose monitoring is not indicated by this scenario.", "Sputum assessment is not relevant to this local IV complication."], "r": "Coolness, swelling, taut skin, and pump occlusion with an infusing non-vesicant fluid and no redness/warmth are classic for infiltration. Priority actions are to stop the infusion, remove the catheter, and elevate the extremity, while monitoring circulation/sensation/movement and the progression of swelling.", "tip": "NCLEX Tip: Distinguish infiltration (cool, no redness) from phlebitis (warm, red, tender) carefully before choosing bowtie actions — the two are commonly confused but require different interventions.", "actionsCount": 2, "monitorCount": 2}, {"t": "mc", "q": "Which IV fluid is classified as isotonic?", "o": ["3% Normal Saline", "0.45% Normal Saline", "0.9% Normal Saline", "0.33% Normal Saline"], "a": [2], "e": ["This is a hypertonic solution.", "This is a hypotonic solution.", "", "This is a hypotonic solution."], "r": "0.9% Normal Saline (NS) is isotonic, meaning it has approximately the same osmolality as plasma, and expands intravascular volume without causing significant fluid shifts into or out of cells.", "tip": "NCLEX Tip: Common isotonic fluids: 0.9% NS, Lactated Ringer's, D5W (isotonic in the bag)."}, {"t": "mc", "q": "Which IV fluid would be most appropriate for a patient with increased intracranial pressure, and which type should generally be AVOIDED?", "o": ["Isotonic fluids are preferred; hypotonic fluids should generally be avoided", "Hypotonic fluids are preferred; isotonic fluids should be avoided", "Hypertonic fluids should never be used in any neuro patient", "There is no difference in fluid choice for neuro patients"], "a": [0], "e": ["", "Hypotonic fluids can worsen cerebral edema and increased ICP and should generally be avoided in this population.", "Hypertonic saline (e.g., 3% NS) is actually sometimes used to treat cerebral edema under close monitoring, so this is inaccurate.", "Fluid tonicity has a significant, well-documented impact on cerebral edema and ICP."], "r": "In patients with increased intracranial pressure, isotonic fluids are generally preferred, while hypotonic fluids are avoided because they can shift fluid into cells and worsen cerebral edema.", "tip": "NCLEX Tip: Avoid hypotonic fluids in head injury/increased ICP patients due to the risk of worsening cerebral edema."}, {"t": "mc", "q": "A patient receiving 3% hypertonic saline should be monitored closely for which potential complication?", "o": ["Hypernatremia and intravascular volume overload", "Hyponatremia", "Hypoglycemia", "Hypocalcemia"], "a": [0], "e": ["", "Hypertonic saline would be expected to increase, not decrease, serum sodium.", "Hypertonic saline does not directly cause hypoglycemia.", "Hypertonic saline is not primarily associated with causing hypocalcemia."], "r": "Hypertonic solutions like 3% NS pull fluid out of cells into the vascular space, which can cause intravascular volume overload and hypernatremia if not carefully monitored; these solutions are typically administered slowly and often require central access at higher concentrations.", "tip": "NCLEX Tip: Hypertonic saline requires slow administration and close monitoring of sodium levels and fluid status due to its significant osmotic effect."}, {"t": "mc", "q": "Which of the following IV fluids would cause fluid to shift into the intracellular space, potentially worsening cerebral edema?", "o": ["0.9% Normal Saline", "Lactated Ringer's", "0.45% Normal Saline (hypotonic)", "3% Normal Saline"], "a": [2], "e": ["This is isotonic and does not cause significant fluid shifts into cells.", "This is isotonic and does not cause significant fluid shifts into cells.", "", "This is hypertonic and pulls fluid out of cells, not into them."], "r": "Hypotonic solutions such as 0.45% NS have a lower osmolality than plasma, causing fluid to shift into cells (rehydrating them), which can worsen cerebral edema in susceptible patients.", "tip": "NCLEX Tip: Hypotonic = fluid into cells (risk of cellular edema); Hypertonic = fluid out of cells (risk of cellular dehydration, intravascular overload)."}, {"t": "mc", "q": "Which IV fluid is often used post-operatively or with blood product administration due to its isotonic, physiologic composition?", "o": ["3% Normal Saline", "Lactated Ringer's", "0.45% Normal Saline", "0.33% Normal Saline"], "a": [1], "e": ["This is hypertonic and not typically the default choice for these situations.", "", "This is hypotonic, not the typical first choice for post-op fluid resuscitation.", "This is hypotonic and not the typical choice for these clinical situations."], "r": "Lactated Ringer's is an isotonic solution with an electrolyte composition similar to plasma, making it a common choice for surgical patients, trauma resuscitation, and general fluid replacement.", "tip": "NCLEX Tip: Lactated Ringer's contains potassium and should generally be avoided in patients with significant renal failure or hyperkalemia."}, {"t": "mc", "q": "A nurse notes that D5W (5% Dextrose in Water) is technically isotonic in the bag but acts as a hypotonic solution once infused. Why is this?", "o": ["The dextrose crystallizes immediately upon infusion", "The dextrose is rapidly metabolized, leaving free water behind, which is hypotonic relative to plasma", "D5W actually becomes hypertonic after infusion", "D5W has no clinical effect once infused"], "a": [1], "e": ["Dextrose does not crystallize in this way once infused.", "", "This is the opposite of what actually occurs.", "D5W does have physiologic effects, including free water distribution once dextrose is metabolized."], "r": "D5W is isotonic in the bag, but once the dextrose is metabolized by the body, it leaves behind free water, which distributes throughout body fluid compartments similarly to a hypotonic solution.", "tip": "NCLEX Tip: D5W is often used as a vehicle for medications or free water replacement, but is not ideal for rapid intravascular volume expansion."}, {"t": "mc", "q": "Which of the following patients would be the best candidate for a hypotonic IV solution such as 0.45% NS?", "o": ["A patient with increased intracranial pressure", "A patient who is cellularly dehydrated and needs fluid to shift into cells", "A patient with severe hypervolemia", "A patient in hypovolemic shock needing rapid volume expansion"], "a": [1], "e": ["Hypotonic fluids are avoided in patients with increased ICP.", "", "Hypervolemic patients generally do not need additional fluid shifting into cells.", "Rapid volume expansion in shock is generally better achieved with isotonic fluids."], "r": "Hypotonic solutions are appropriate for patients who are cellularly dehydrated, as these fluids shift water into cells to rehydrate them, but they are avoided in conditions like increased ICP or significant hypervolemia.", "tip": "NCLEX Tip: Match fluid tonicity to the underlying fluid shift problem: hypotonic for cellular dehydration, hypertonic for cellular edema/intravascular volume needs, isotonic for general volume replacement."}, {"t": "mc", "q": "Which of the following is the priority nursing assessment before initiating any IV fluid therapy?", "o": ["The patient's shoe size", "The patient's cardiac, renal, and fluid volume status", "The patient's favorite color", "The patient's most recent meal"], "a": [1], "e": ["This is irrelevant to IV fluid therapy safety.", "", "This is irrelevant to IV fluid therapy safety.", "While relevant to some procedures, this is not the priority assessment for initiating IV fluids specifically."], "r": "Before initiating IV fluid therapy, the nurse should assess the patient's cardiac, renal, and overall fluid volume status to select an appropriate fluid type and rate and to prevent complications like fluid overload.", "tip": "NCLEX Tip: Cardiac and renal status heavily influence fluid choice and rate — always assess before hanging IV fluids, especially in older adults or those with organ dysfunction."}, {"t": "mc", "q": "A nurse calculates that a patient needs 100 mL/hr of IV fluid via gravity, using tubing with a drop factor of 10 gtt/mL. What is the correct drip rate in gtt/min?", "o": ["10 gtt/min", "17 gtt/min", "20 gtt/min", "25 gtt/min"], "a": [1], "e": ["This does not correctly apply the formula.", "", "This does not correctly apply the formula.", "This does not correctly apply the formula."], "r": "Using the formula (Volume x drop factor) / time in minutes: (100 mL x 10 gtt/mL) / 60 minutes = 1000/60 ≈ 16.7, rounded to 17 gtt/min.", "tip": "NCLEX Tip: For gtt/min calculations with an hourly rate, you can simplify: (mL/hr x drop factor) / 60 = gtt/min."}, {"t": "mc", "q": "A provider orders 500 mL of D5W to infuse over 4 hours via an infusion pump. What rate, in mL/hr, should the nurse program into the pump?", "o": ["100 mL/hr", "125 mL/hr", "150 mL/hr", "200 mL/hr"], "a": [1], "e": ["This does not correctly divide 500 mL by 4 hours.", "", "This does not correctly divide 500 mL by 4 hours.", "This does not correctly divide 500 mL by 4 hours."], "r": "500 mL divided by 4 hours equals 125 mL/hr, which is the correct rate to program into the infusion pump.", "tip": "NCLEX Tip: For infusion pump rate calculations, simply divide total volume by total hours to get mL/hr."}, {"t": "mc", "q": "A patient is to receive 1 liter of Lactated Ringer's over 10 hours via an infusion pump. What is the correct pump rate?", "o": ["50 mL/hr", "100 mL/hr", "150 mL/hr", "10 mL/hr"], "a": [1], "e": ["This does not correctly divide 1000 mL by 10 hours.", "", "This does not correctly divide 1000 mL by 10 hours.", "This does not correctly divide 1000 mL by 10 hours."], "r": "1000 mL (1 liter) divided by 10 hours equals 100 mL/hr, the correct infusion pump rate.", "tip": "NCLEX Tip: Always convert liters to mL (1 L = 1000 mL) before performing infusion rate calculations."}, {"t": "mc", "q": "Using a microdrip set with a drop factor of 60 gtt/mL, a nurse needs to infuse 60 mL/hr via gravity. What is the correct drip rate?", "o": ["60 gtt/min", "30 gtt/min", "15 gtt/min", "6 gtt/min"], "a": [0], "e": ["", "This does not reflect the microdrip conversion correctly.", "This does not reflect the microdrip conversion correctly.", "This does not reflect the microdrip conversion correctly."], "r": "With a microdrip set (60 gtt/mL), the drip rate in gtt/min is always numerically equal to the mL/hr rate, so 60 mL/hr equals 60 gtt/min.", "tip": "NCLEX Tip: With a 60 gtt/mL microdrip set, gtt/min always equals mL/hr — a helpful shortcut for pediatric or precise low-volume infusions."}, {"t": "mc", "q": "A nurse needs to infuse 250 mL of antibiotic over 30 minutes via an infusion pump. What rate should be programmed, in mL/hr?", "o": ["250 mL/hr", "500 mL/hr", "125 mL/hr", "1000 mL/hr"], "a": [1], "e": ["This does not correctly convert the 30-minute infusion time to an hourly rate.", "", "This does not correctly convert the 30-minute infusion time to an hourly rate.", "This does not correctly convert the 30-minute infusion time to an hourly rate."], "r": "Since 30 minutes is half an hour, the rate needed to infuse 250 mL in that time is 250 mL x 2 = 500 mL/hr.", "tip": "NCLEX Tip: For infusion times less than an hour, calculate the equivalent hourly rate by scaling the volume proportionally."}, {"t": "mc", "q": "Which type of IV administration set should be used for a pediatric patient requiring precise, small-volume fluid administration via gravity?", "o": ["A macrodrip set with a drop factor of 10 gtt/mL", "A macrodrip set with a drop factor of 15 gtt/mL", "A microdrip set with a drop factor of 60 gtt/mL", "Any set is equally appropriate regardless of drop factor"], "a": [2], "e": ["Macrodrip sets deliver larger drops, less precise for very small volumes.", "Macrodrip sets deliver larger drops, less precise for very small volumes.", "", "Drop factor selection significantly affects precision, especially in pediatric or critical dosing."], "r": "A microdrip set (60 gtt/mL) delivers smaller drops, allowing for more precise control of small-volume infusions, which is especially important in pediatric patients or when giving potent medications.", "tip": "NCLEX Tip: Microdrip sets (60 gtt/mL) are used for pediatric patients, critical care, or any situation requiring precise, low-volume infusion control."}, {"t": "mc", "q": "Which of the following best describes 'phlebitis scale' documentation in nursing practice?", "o": ["A tool to grade renal function", "A standardized scale used to grade the severity of vein inflammation at an IV site", "A scale to measure blood pressure", "A scale used only for measuring pain"], "a": [1], "e": ["", "", "", ""], "r": "A phlebitis scale is a standardized tool nurses use to grade and document the severity of vein inflammation (e.g., redness, pain, palpable cord) at an IV insertion site, supporting consistent monitoring and communication.", "tip": "NCLEX Tip: Objective, standardized scales (like phlebitis or infiltration scales) improve consistency in IV site assessment documentation across shifts and staff."}, {"t": "mc", "q": "An infiltration scale grade of 4 (the most severe) would most likely include which finding?", "o": ["No visible swelling", "Skin blanched, translucent, and tight, with severe pain and possible circulatory compromise", "Slight swelling with no pain", "Mild redness only"], "a": [1], "e": ["This would correspond to a low or zero grade on the scale, not the most severe.", "", "This would correspond to a low-grade finding, not the most severe.", "Redness alone without other severe findings would not represent the highest severity grade."], "r": "A grade 4 infiltration typically involves severe skin changes (blanching, tightness, translucency), significant pain, and possible compromised circulation, requiring immediate intervention.", "tip": "NCLEX Tip: Higher numbers on infiltration/phlebitis scales indicate more severe findings requiring more urgent intervention."}, {"t": "mc", "q": "Which of the following best represents proper technique when flushing a peripheral IV line with normal saline?", "o": ["Using a large syringe with high pressure to clear any resistance quickly", "Using a push-pause technique with an appropriately sized syringe to assess patency and clear the line gently", "Never flushing the line unless a medication is being given", "Using tap water instead of saline if saline is unavailable"], "a": [1], "e": ["High pressure or forceful flushing risks vessel damage and should never be used to overcome resistance.", "", "Routine flushing helps maintain patency and should be done per protocol, not only with medication administration.", "Tap water is not sterile and should never be substituted for saline in IV flushing."], "r": "Proper IV flushing technique uses a push-pause method with an appropriately sized syringe (typically 10 mL or larger barrel to avoid excessive pressure), assessing for resistance or pain, which could indicate a complication.", "tip": "NCLEX Tip: Never force a flush against resistance — this can cause vessel damage or dislodge a clot into circulation; stop and assess further instead."}, {"t": "mc", "q": "Which syringe size is generally recommended for flushing a peripheral IV line to avoid excessive pressure on the catheter?", "o": ["1 mL syringe", "3 mL syringe", "10 mL syringe or larger", "50 mL syringe"], "a": [2], "e": ["Very small syringes can generate excessive pressure due to their small barrel diameter.", "Small syringes can still generate excessive pressure.", "", "While larger syringes reduce pressure risk, a 10 mL syringe is the generally recommended minimum size, not this larger option specifically for routine flushing."], "r": "A 10 mL syringe (or larger) is generally recommended for flushing peripheral IV catheters because smaller syringes generate more pressure per unit of force, increasing the risk of catheter or vessel damage.", "tip": "NCLEX Tip: Smaller syringes generate more psi (pressure) for the same amount of force — always use a 10 mL or larger syringe for IV flushing unless otherwise directed."}, {"t": "mc", "q": "A nurse observes blood backflow into the IV tubing during a peripheral IV infusion. This is most likely due to:", "o": ["A properly functioning gravity infusion with no cause for concern", "The infusion bag being lower than the IV site or the roller clamp being closed/occluded", "An air embolism in progress", "Fluid overload"], "a": [1], "e": ["Blood backflow is generally a sign of altered flow, not an expected normal finding.", "", "This is not the typical cause of visible blood backflow into tubing.", "Fluid overload is a distinct systemic complication not directly indicated by tubing backflow."], "r": "Blood backflow into IV tubing often occurs when the infusion bag is positioned too low relative to the IV site, or when the tubing is kinked, clamped, or occluded, disrupting the normal downward flow of fluid.", "tip": "NCLEX Tip: Checking bag height, tubing patency, and clamps is the first troubleshooting step when blood backflow is noted in the tubing."}, {"t": "mc", "q": "Which of the following would be the most appropriate initial nursing action if a peripheral IV pump alarms for 'occlusion'?", "o": ["Silence the alarm and ignore it", "Check the tubing for kinks, verify the roller clamp is open, and assess the IV site", "Immediately remove the catheter without further assessment", "Increase the infusion rate to overcome the occlusion"], "a": [1], "e": ["Ignoring alarms can delay recognition of a significant problem.", "", "The site and system should be assessed before removing the catheter, unless a serious complication is confirmed.", "Increasing the rate to overcome an occlusion could worsen tissue damage if the occlusion is due to infiltration."], "r": "When an occlusion alarm sounds, the nurse should systematically check for kinks in the tubing, verify the clamp is open, and assess the IV site for complications such as infiltration before taking further action.", "tip": "NCLEX Tip: Systematic troubleshooting (tubing → clamps → site) is safer and more effective than immediately silencing alarms or escalating the infusion rate."}, {"t": "mc", "q": "A patient's IV pump alarms 'air-in-line.' What is the nurse's priority action?", "o": ["Ignore the alarm since small amounts of air are never harmful", "Stop the infusion, clear the air from the tubing per manufacturer/facility protocol, and then resume", "Increase the infusion rate to push the air through quickly", "Disconnect the tubing from the patient and leave it disconnected"], "a": [1], "e": ["While small amounts of air are often not clinically significant, alarms should not be ignored without addressing the underlying air in the line.", "", "Increasing the rate to push air through is unsafe practice.", "Disconnecting and leaving the line open increases infection risk and does not address the alarm appropriately."], "r": "When an air-in-line alarm occurs, the nurse should stop the infusion, safely clear the air from the tubing according to protocol, and then resume the infusion, rather than ignoring the alarm or pushing air through at a faster rate.", "tip": "NCLEX Tip: Even though small air bubbles are often clinically insignificant, alarms should always be properly addressed rather than dismissed or bypassed."}, {"t": "mc", "q": "Which of the following patient populations requires special consideration for slower, more cautious IV fluid administration to prevent fluid overload?", "o": ["A healthy young adult with normal cardiac and renal function", "An older adult with heart failure and chronic kidney disease", "A well-hydrated adult receiving a single antibiotic dose", "A patient receiving a small-volume IV flush only"], "a": [1], "e": ["", "", "", ""], "r": "Older adults with heart failure and chronic kidney disease have reduced capacity to handle fluid shifts and are at higher risk of fluid overload, requiring more cautious, often slower IV fluid administration with close monitoring.", "tip": "NCLEX Tip: Always consider cardiac and renal reserve when determining IV fluid rates, particularly in older adults or those with chronic organ dysfunction."}, {"t": "mc", "q": "Which nursing action best reflects the 'six rights' principle of 'right time' when administering a scheduled IV antibiotic?", "o": ["Administering the medication whenever convenient during the shift", "Administering the medication within the facility's accepted time window around the scheduled time", "Administering the medication only if the patient requests it", "Skipping the dose if it is more than 10 minutes late, without further action"], "a": [1], "e": ["Administering 'whenever convenient' does not respect medication timing requirements essential for maintaining therapeutic levels.", "", "Medication timing is a nursing responsibility based on the order, not solely a patient request.", "Doses should not simply be skipped without appropriate follow-up per facility policy; the provider or pharmacy may need to be notified depending on the medication and delay."], "r": "The 'right time' component of safe medication administration requires giving medications within the facility's accepted time window around the scheduled time, which is especially important for antibiotics to maintain therapeutic blood levels.", "tip": "NCLEX Tip: Time-critical medications, like many IV antibiotics, have narrower acceptable administration windows than routine scheduled medications."}, {"t": "mc", "q": "Which of the following best demonstrates the 'right documentation' component of safe IV medication administration?", "o": ["Documenting the medication only if a complication occurs", "Documenting the medication, dose, time, route, and patient response immediately after administration", "Waiting until the end of the shift to document all medications given", "Documenting medications based on memory the next day"], "a": [1], "e": ["Documentation should occur for every medication given, not only when problems arise.", "", "Delayed documentation increases the risk of inaccuracies and omissions.", "Relying on memory the next day is unsafe and can result in significant documentation errors."], "r": "Proper documentation of IV medication administration should occur promptly after giving the medication and include the drug, dose, time, route, and the patient's response, supporting accuracy and continuity of care.", "tip": "NCLEX Tip: Documentation should be timely (as close to real-time as possible) — 'chart as you go' rather than batching it at the end of a shift."}, {"t": "mc", "q": "Which of the following best reflects appropriate use of a central venous catheter (CVC) for blood sampling?", "o": ["CVCs should never be used for blood sampling under any circumstances", "Following facility protocol for flushing and appropriate technique to avoid line-related complications and inaccurate results", "Any technique is acceptable since central lines are more durable than peripheral IVs", "Blood should always be drawn without discarding any initial volume from a CVC"], "a": [1], "e": ["Many CVCs can be used for blood sampling when appropriate technique and protocol are followed.", "", "Central lines still require careful technique to prevent complications like infection or inaccurate lab draws.", "An appropriate discard volume is typically required to avoid dilutional or heparin-related inaccuracies when drawing from a CVC."], "r": "Blood sampling from a central venous catheter requires following facility-specific protocols, including proper flushing, discard volumes, and technique, to avoid contamination, infection risk, or inaccurate laboratory results.", "tip": "NCLEX Tip: Blood draws from any vascular access device (peripheral or central) require attention to technique to avoid hemolysis, dilution, or infection risk."}, {"t": "mc", "q": "A nurse notices redness spreading up the arm from a peripheral IV site, along with fever. This presentation is most concerning for:", "o": ["Simple infiltration", "A more significant local or systemic infection possibly progressing toward cellulitis or bacteremia", "Air embolism", "Fluid overload"], "a": [1], "e": ["Infiltration does not typically cause redness or fever.", "", "Air embolism presents with sudden cardiopulmonary symptoms, not localized skin changes with fever.", "Fluid overload does not cause localized skin redness with fever."], "r": "Spreading redness along with systemic fever suggests a worsening local infection potentially progressing to cellulitis or a bloodstream infection, requiring prompt catheter removal, culture, and provider notification.", "tip": "NCLEX Tip: Systemic signs (fever) combined with local findings (spreading redness) indicate a more serious, potentially systemic infectious process requiring urgent attention."}, {"t": "mc", "q": "Which of the following best describes an appropriate discharge instruction for a patient going home with a peripherally inserted central catheter (PICC) line?", "o": ["\"You can go swimming and submerge the PICC line in water.\"", "\"Keep the dressing clean, dry, and intact, and avoid activities that could dislodge or contaminate the line.\"", "\"You do not need to monitor for any signs of infection once you're home.\"", "\"It's fine to use scissors near the insertion site to trim the dressing if needed.\""], "a": [1], "e": ["PICC lines and their dressings should be protected from submersion in water to prevent infection.", "", "Patients must be taught to monitor for and report signs of infection or complications even after discharge.", "Patients should never use sharp objects near the insertion site due to risk of catheter damage or injury."], "r": "Appropriate PICC line discharge teaching includes keeping the dressing clean, dry, and intact; avoiding submersion in water; monitoring for signs of infection or complications; and avoiding activities that could dislodge or damage the catheter.", "tip": "NCLEX Tip: PICC line home care teaching parallels other central line care principles: dressing integrity, infection monitoring, and activity precautions."}, {"t": "mc", "q": "Which best reflects an appropriate response to a patient asking why a central line is being used instead of a peripheral IV for their chemotherapy?", "o": ["\"Central lines are always safer than peripheral IVs for every situation.\"", "\"Central lines allow safer administration of vesicant medications like some chemotherapy drugs, reducing the risk of tissue damage from a peripheral vein.\"", "\"There's no real difference, it's just facility preference.\"", "\"Central lines are used because peripheral IVs are too painful.\""], "a": [1], "e": ["Central lines are not universally 'safer' for all situations; they have their own risks (e.g., higher infection risk) and are chosen based on clinical need.", "", "There are clinically meaningful, evidence-based differences guiding this choice, not just preference.", "Pain level is not the primary reason central access is chosen for vesicant chemotherapy."], "r": "Central venous access reduces the risk of extravasation injury from vesicant medications like certain chemotherapy agents, since these drugs are less likely to cause tissue damage when administered into a larger, higher-flow central vein.", "tip": "NCLEX Tip: The primary clinical reason for choosing central access for vesicants is to reduce the risk and severity of extravasation injury."}, {"t": "sata", "q": "Which of the following are appropriate nursing considerations before administering a vesicant medication through a peripheral IV (when central access is not yet available)? Select all that apply.", "o": ["Selecting a large, healthy vein away from joints", "Assessing the IV site for patency and blood return before and during administration", "Administering the medication as a rapid IV push regardless of the specific drug's guidelines", "Having extravasation treatment protocols and antidotes readily available", "Ignoring any patient report of burning or pain during administration"], "a": [0, 1, 3], "e": ["", "", "Rate of administration should follow the specific medication's guidelines, not be uniformly rapid.", "", "Any reported burning or pain should be taken seriously and investigated immediately, not ignored, due to extravasation risk."], "r": "When administering a vesicant peripherally, the nurse should select an appropriate large vein, closely monitor patency and blood return, follow drug-specific administration guidelines, and have extravasation treatment protocols ready, while immediately investigating any reported pain or burning.", "tip": "NCLEX Tip: Vesicant administration requires heightened vigilance regardless of the access type, given the potential for serious tissue injury with extravasation."}, {"t": "mc", "q": "Which of the following statements about peripheral IV catheter dwell time is most accurate?", "o": ["All peripheral IVs must be changed every 24 hours regardless of condition", "Many current evidence-based guidelines support changing peripheral IVs based on clinical indication rather than a fixed time interval, per facility policy", "Peripheral IVs never need to be changed if they are still infusing", "Dwell time has no bearing on infection or phlebitis risk"], "a": [1], "e": ["Many current guidelines have moved away from a strict fixed-interval requirement toward clinically indicated changes, though this varies by facility policy.", "", "IVs still require monitoring and potential replacement based on clinical indication, even if currently infusing without obvious issue.", "Dwell time is directly related to increased risk of phlebitis and infection the longer a catheter remains in place."], "r": "Current evidence-based practice increasingly supports changing peripheral IV catheters based on clinical indication (e.g., signs of complications) rather than a strict fixed time interval, though nurses should always follow their specific facility's policy.", "tip": "NCLEX Tip: Always follow your facility's specific policy on IV dwell time, as practice has evolved over time based on updated evidence."}, {"t": "mc", "q": "A nurse assesses a new IV site 1 hour after insertion and finds no complications, with the infusion running well. What is the most appropriate next step?", "o": ["No further assessment is needed for the rest of the shift", "Continue to reassess the site periodically throughout the shift per facility policy", "Discontinue the IV since it is working well and no longer needed", "Increase the infusion rate since there are no complications"], "a": [1], "e": ["IV sites require ongoing, periodic reassessment throughout their use, not just an initial check.", "", "A well-functioning IV should not be discontinued simply because no early complications are found; it should be maintained per clinical need.", "There is no indication in this scenario to increase the infusion rate simply because the site looks fine."], "r": "IV sites require periodic ongoing reassessment throughout their use per facility policy, since complications such as infiltration or phlebitis can develop or progress at any time during therapy.", "tip": "NCLEX Tip: A single reassuring assessment does not eliminate the need for continued periodic monitoring throughout the duration of IV therapy."}, {"t": "mc", "q": "Which best represents an appropriate escalation when a nurse identifies a Stage 2 (or higher) infiltration at an IV site per facility scale?", "o": ["No action needed since infiltration is expected with all IVs", "Stop the infusion, remove the catheter, document findings using the facility's scale, and notify the provider if indicated", "Increase the infusion rate to compensate for reduced flow", "Apply ice directly to the skin without assessing the type of fluid infiltrated"], "a": [1], "e": ["Infiltration is a complication requiring intervention, not an expected, benign occurrence.", "", "Increasing the rate would worsen tissue injury from infiltration.", "Whether to apply heat or cold depends on the type of solution infiltrated; ice should not be applied indiscriminately without this assessment."], "r": "When a significant infiltration is identified, the nurse should stop the infusion, remove the catheter, document findings using a standardized scale, apply appropriate treatment based on the type of fluid infiltrated, and notify the provider as indicated by severity.", "tip": "NCLEX Tip: Standardized infiltration/phlebitis scales guide both documentation and the urgency of the nursing response."}, {"t": "mc", "q": "A nurse is teaching a nursing student about central line-associated bloodstream infection (CLABSI) prevention. Which statement by the student indicates a need for further teaching?", "o": ["\"We should perform hand hygiene before accessing the central line.\"", "\"It's fine to leave the central line dressing in place even if it becomes visibly soiled, as long as it's not due for a scheduled change.\"", "\"We should use chlorhexidine for skin antisepsis before insertion.\"", "\"We should review daily whether the central line is still necessary.\""], "a": [1], "e": ["This reflects correct understanding of CLABSI prevention.", "", "This reflects an incorrect understanding — a soiled or loose dressing should be changed regardless of the scheduled change date.", "This reflects correct understanding of CLABSI prevention (daily necessity review)."], "r": "A visibly soiled, loose, or damp central line dressing should be changed immediately regardless of the scheduled interval, since a compromised dressing increases infection risk; this statement indicates a need for further teaching.", "tip": "NCLEX Tip: 'Needs further teaching' questions often present a statement that sounds reasonable but violates a specific safety principle — look closely for exceptions like 'even if soiled.'"}, {"t": "mc", "q": "Which of the following best reflects safe practice when administering IV potassium chloride?", "o": ["Administering it as a rapid IV push", "Diluting appropriately and infusing via a controlled rate, typically using an infusion pump, per facility protocol", "Administering it undiluted through a peripheral IV", "Administering it without any cardiac monitoring regardless of the dose or rate"], "a": [1], "e": ["IV push administration of potassium chloride is dangerous and can cause fatal cardiac arrhythmias.", "", "Undiluted potassium chloride administration is unsafe and can cause severe complications, including cardiac arrest.", "Higher doses or rates of IV potassium often warrant cardiac monitoring per facility protocol due to arrhythmia risk."], "r": "IV potassium chloride must be appropriately diluted and administered via a controlled infusion rate, typically using an infusion pump, due to its high risk of causing life-threatening cardiac arrhythmias if given too quickly or in a concentrated form.", "tip": "NCLEX Tip: IV potassium chloride is a high-alert medication — never administer it via IV push, and always double-check dilution, rate, and monitoring requirements."}, {"t": "mc", "q": "A nurse is preparing to administer a blood transfusion. Which type of IV catheter gauge is generally recommended for this purpose in adults?", "o": ["24G", "22G", "18G or 20G", "A gauge size does not matter for blood transfusions"], "a": [2], "e": ["This gauge is too small and may cause hemolysis of blood cells during transfusion.", "This gauge may be too small for standard blood transfusion in adults, particularly for rapid administration.", "", "Gauge size does matter significantly for the safe, effective administration of blood products."], "r": "An 18G or 20G catheter is generally recommended for blood transfusions in adults, as these sizes allow adequate flow while minimizing the risk of hemolysis that can occur with smaller-gauge catheters.", "tip": "NCLEX Tip: Smaller-gauge catheters can cause mechanical hemolysis of red blood cells during transfusion — use an appropriately sized catheter (typically 18-20G) for blood products."}, {"t": "mc", "q": "Which of the following is the priority nursing action during the first 15 minutes of a blood transfusion?", "o": ["Leave the room to attend to other patients", "Remain with the patient and monitor closely for signs of a transfusion reaction", "Increase the infusion rate to complete the transfusion quickly", "Administer additional IV fluids through the same line simultaneously"], "a": [1], "e": ["The nurse should remain present during this high-risk period, not leave the room.", "", "The initial rate should typically start slow, not be increased, during the observation period.", "Only compatible fluids per protocol (typically normal saline) should run through the same line, and other fluids/medications generally should not be co-administered simultaneously with blood."], "r": "The first 15 minutes of a blood transfusion are the highest-risk period for an acute transfusion reaction, so the nurse should remain with the patient, infuse slowly, and monitor vital signs and symptoms closely during this time.", "tip": "NCLEX Tip: Most acute transfusion reactions occur within the first 15 minutes — always stay with the patient and monitor closely during this critical window."}, {"t": "mc", "q": "Which of the following signs would prompt the nurse to immediately stop a blood transfusion?", "o": ["Mild transient anxiety only", "Fever, chills, back pain, or hives developing during the transfusion", "A slightly elevated heart rate that quickly returns to baseline", "A patient asking questions about the transfusion"], "a": [1], "e": ["This alone is a vague, nonspecific symptom that would still warrant reporting and monitoring, but is not the classic reaction to stop for.", "", "This alone, especially if transient, does not typically indicate an acute transfusion reaction requiring immediate cessation.", "This is a normal, expected patient behavior and does not indicate a reaction."], "r": "Signs such as fever, chills, back pain, or hives during a transfusion suggest a possible acute transfusion reaction, requiring the nurse to immediately stop the transfusion, maintain IV access with normal saline, and notify the provider.", "tip": "NCLEX Tip: Classic transfusion reaction signs include fever, chills, back/flank pain, hives, and hypotension — stop the transfusion immediately if any of these occur."}, {"t": "fib", "q": "Fill in the blank: When a suspected transfusion reaction occurs, the nurse should immediately stop the transfusion and keep the IV line open with ______ while notifying the provider.", "blanks": [["normal saline", "saline", "0.9% normal saline"]], "r": "When a transfusion reaction is suspected, the blood product is stopped immediately, and the IV line is kept open with normal saline (not the blood product tubing) while the provider is notified and the reaction is managed per protocol.", "tip": "NCLEX Tip: Never continue infusing through the same blood tubing after stopping for a suspected reaction — switch to new tubing with normal saline."}, {"t": "mc", "q": "Which of the following best reflects appropriate nursing management of an IV site in a patient receiving continuous vasopressor therapy through a peripheral line as a temporary bridge to central access?", "o": ["No special monitoring is needed beyond routine site checks", "Very frequent site assessment for early signs of infiltration/extravasation, given the high risk of tissue injury with vasopressor extravasation", "Administering the vasopressor at the fastest possible rate to minimize peripheral exposure time", "Avoiding any documentation until central access is obtained"], "a": [1], "e": ["Vasopressors carry a high risk of significant tissue injury if extravasated, requiring more frequent, vigilant monitoring than routine site checks alone.", "", "Vasopressor rates should be titrated based on the patient's hemodynamic response and orders, not simply maximized to shorten peripheral exposure.", "Documentation should occur throughout care regardless of anticipated changes in access."], "r": "Vasopressors carry a significant risk of severe tissue injury if extravasated, so when administered peripherally (typically only as a temporary bridge), the nurse must perform very frequent site assessments and have extravasation treatment protocols ready.", "tip": "NCLEX Tip: Vasopressors are preferably given via central access; when given peripherally as a bridge, heightened vigilance for extravasation is critical."}, {"t": "mc", "q": "A nurse is comparing an implanted port to a standard PICC line. Which statement is accurate?", "o": ["An implanted port is fully external and requires no needle access", "An implanted port is placed under the skin and accessed with a special noncoring needle through the skin", "A PICC line is surgically implanted under the skin", "There is no difference between the two devices"], "a": [1], "e": ["Implanted ports are placed under the skin, not left fully external.", "", "PICC lines are inserted into a peripheral vein and threaded to a central location, not surgically implanted under the skin like a port.", "These are distinct types of central venous access devices with different insertion techniques and appearances."], "r": "An implanted port is a central venous access device placed entirely under the skin, accessed by inserting a special noncoring (Huber) needle through the skin into the port's septum, making it well-suited for long-term intermittent therapy.", "tip": "NCLEX Tip: Implanted ports are the least visible central access option and are often preferred for long-term intermittent therapies like chemotherapy due to lower daily maintenance needs."}, {"t": "mc", "q": "Which of the following is an advantage of a PICC line compared to a traditional centrally inserted central catheter (e.g., subclavian or internal jugular line)?", "o": ["Lower risk of any complications whatsoever", "Insertion via a peripheral vein (typically in the arm), which may reduce certain insertion-related risks compared to central-site insertion", "No need for any radiographic confirmation of placement", "No risk of infection at all"], "a": [1], "e": ["No vascular access device is entirely free of complication risk.", "", "Placement confirmation (e.g., chest X-ray) is still typically required for a PICC line.", "All central venous access devices carry some infection risk, including PICC lines."], "r": "PICC lines are inserted via a peripheral vein, typically in the upper arm, which may reduce certain risks (such as pneumothorax) associated with insertion at central sites like the subclavian or internal jugular vein, while still providing central venous access for longer-term therapy.", "tip": "NCLEX Tip: PICC lines still require placement confirmation and carry infection/thrombosis risks, but their peripheral insertion site can reduce risks associated with central-site insertion procedures."}, {"t": "mc", "q": "Which nursing action is important when caring for a patient with a midline catheter (a peripheral catheter that is longer than a standard IV but does not reach central circulation)?", "o": ["Treating it exactly the same as a central line, including using it for vesicant chemotherapy", safety-engineered devices."], "r": "Modern IV catheters often include a safety mechanism, such as a retractable or shielded needle, that engages immediately after use to reduce the risk of accidental needlestick injury to healthcare workers.", "tip": "NCLEX Tip: OSHA's Bloodborne Pathogens Standard requires the use of safety-engineered sharps devices whenever feasible to reduce needlestick injury risk."}, {"t": "mc", "q": "A patient is receiving a continuous IV infusion and the nurse notes the tubing was last changed 5 days ago. Per common infection control guidelines, primary continuous IV tubing is typically changed:", "o": ["Every 8 hours", "Every 24 hours only", "No less frequently than every 96 hours (per many facility policies), or sooner if visibly soiled or per specific solution requirements", "Only when it appears visibly dirty"], "a": [2], "e": ["This is far more frequent than most standard tubing change guidelines require.", "This is more frequent than the typical standard for primary continuous tubing.", "", "Tubing should be changed based on established time intervals per policy, not solely based on visible appearance, since contamination is not always visible."], "r": "Many facility policies follow guidelines recommending primary continuous IV administration tubing be changed no more frequently than every 96 hours, though this can vary by solution type (e.g., lipids, blood products have shorter intervals) and specific facility policy.", "tip": "NCLEX Tip: Tubing change intervals vary by fluid type — blood and lipid emulsions require much more frequent tubing changes than standard crystalloid solutions."}, {"t": "mc", "q": "Which of the following solutions requires IV tubing to be changed more frequently due to higher risk of microbial growth?", "o": ["0.9% Normal Saline", "Lactated Ringer's", "Lipid emulsions (e.g., IV fat emulsion or propofol)", "D5W"], "a": [2], "e": ["Standard crystalloid solutions like normal saline do not require unusually frequen uided access."}, {"t": "mc", "q": "A nurse is caring for an obese patient with difficult venous access. Which strategy may improve success with peripheral IV insertion?", "o": ["Avoiding any use of a tourniquet", "Using ultrasound guidance if available, along with careful site selection and patience", "Selecting the largest gauge catheter possible for the first attempt", "Refusing to attempt IV insertion and requiring a central line instead"], "a": [1], "e": ["A tourniquet is still generally used to help distend the vein, unless contraindicated.", "", "Choosing an excessively large gauge for a difficult vein increases the risk of a failed attempt or vessel trauma.", "Peripheral access should still be attempted using appropriate strategies before considering central access, unless truly clinically indicated."], "r": "For patients with difficult venous access, such as those with obesity, using ultrasound guidance (if available), careful site selection, adequate lighting, and patience can improve the likelihood of successful peripheral IV placement.", "tip": "NCLEX Tip: Ultrasound-guided peripheral IV insertion is increasingly used for patients with historically difficult venous access."}, {"t": "fib", "q": "Fill in the blank: The nursing action of assessing a peripheral IV site for redness, warmth, and tenderness along the vein is primarily used to detect ______.", "blanks": [["phlebitis", "Phlebitis"]], "r": "Assessing for redness, warmth, and tenderness along the vein path is specifically aimed at detecting phlebitis, or inflammation of the vein.", "tip": "NCLEX Tip: Redness + warmth + tenderness along the vein = phlebitis; always assess and document these specific findings during IV site checks."}, {"t": "mc", "q": "Which of the following best reflects safe practice when preparing to administer an IV medication via IV push through an existing peripheral line?", "o": ["Skipping site assessment since the line is already established and infusing fluids without issue", "Assessing the site for patency and complications, then administering the medication at the recommended rate per drug reference", "Administering all IV push medications as quickly as possible to save time", "Assuming compatibility with the currently infusing fluid without checking a reference"], "a": [1], "e": ["The site should still be assessed immediately before IV push administration, even if fluids are currently infusing without apparent issue.", "", "IV push medications have specific recommended administration rates; giving them too quickly can cause serious adverse effects.", "Compatibility should always be verified using a reliable reference before administering a medication alongside a currently infusing fluid."], "r": "Safe IV push administration includes assessing the site immediately before injection, verifying compatibility with any currently infusing fluid, and administering the medication at the rate recommended by a drug reference to avoid adverse effects.", "tip": "NCLEX Tip: Always check the recommended IV push rate for each specific medication — rates vary significantly and rapid administration can cause serious harm for many drugs."}]}
