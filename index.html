often begin with 'I recommend,' 'I suggest,' or 'I would like an order for...'"}, {"t": "fib", "q": "Fill in the blank: In SBAR, the letter 'S' stands for ______.", "blanks": [["situation", "Situation"]], "r": "'Situation' is the first component of SBAR and briefly identifies the patient and the current problem or reason for the communication.", "tip": "NCLEX Tip: Practice writing a one-sentence 'Situation' statement for practice scenarios — it should be concise and identify the core issue immediately."}, {"t": "mc", "q": "Which scenario best demonstrates appropriate use of SBAR?", "o": ["A nurse gives a rambling, unstructured report covering unrelated topics", "A nurse briefly states the patient's identity and problem, relevant history, clinical impression, and a specific request for action", "A nurse only provides vital signs without any context", "A nurse waits until the end of the shift to report a critical change"], "a": [1], "e": ["This lacks the structure SBAR is designed to provide.", "", "This omits necessary context and a clear ask.", "Critical changes should be reported promptly, not delayed to shift's end."], "r": "Effective SBAR communication is concise, structured, and includes all four components, ensuring the listener receives a clear, actionable picture of the situation.", "tip": "NCLEX Tip: SBAR reports should typically take less than one to two minutes when done well — practice being concise."}, {"t": "mc", "q": "A new nurse struggles to decide on an intervention despite having gathered thorough assessment data. This suggests difficulty with which phase of Tanner's Model?", "o": ["Noticing", "Interpreting", "Responding", "Reflecting"], "a": [1], "e": ["Noticing (data gathering) appears to have been done thoroughly in this scenario.", "", "Responding involves acting once a clinical judgment has been formed, which follows interpreting.", "Reflecting occurs after the encounter, not during initial decision-making."], "r": "Interpreting involves synthesizing the gathered data into a clinical picture sufficient to guide action; difficulty here suggests the nurse has data but hasn't yet made sense of it clinically.", "tip": "NCLEX Tip: Data gathering (Noticing) without synthesis (Interpreting) can leave a nurse with information but no clear direction for care."}, {"t": "mc", "q": "Which best illustrates the cyclical, ongoing nature of Tanner's Model in daily nursing practice?", "o": ["The four phases occur once per shift and are never repeated", "Reflection from one patient encounter informs noticing and interpreting in future encounters", "Each phase must be fully mastered before moving to nursing practice", "The model applies only to critical care nursing"], "a": [1], "e": ["The model is applied continuously and repeatedly throughout practice, not just once per shift.", "", "Tanner's Model describes an evolving clinical judgment process developed through experience, not a mastery checklist before practicing.", "Tanner's Model applies broadly across all nursing specialties and settings."], "r": "Tanner's Model describes clinical judgment as a continuous, cyclical process where reflection on past experiences shapes how a nurse notices and interprets future clinical situations, supporting ongoing professional growth.", "tip": "NCLEX Tip: The cyclical nature of Tanner's Model is a common conceptual theme tested — reflection feeds back into future noticing and interpreting."}, {"t": "mc", "q": "A nursing instructor asks students to identify which phase of Tanner's Model is most influenced by a nurse's past clinical experience and pattern recognition. The best answer is:", "o": ["Noticing", "Responding", "Reflecting", "None of the phases are influenced by experience"], "a": [0], "e": ["", "Responding is more about implementation of a decision already made.", "Reflecting occurs after the encounter and evaluates outcomes.", ""], "r": "Noticing is heavily influenced by a nurse's past clinical experience, as expert nurses often recognize subtle patterns and cues more quickly due to accumulated pattern recognition.", "tip": "NCLEX Tip: Expert nurses often 'notice' abnormal findings faster due to experience-based pattern recognition, a key concept from Benner's and Tanner's work."}, {"t": "mc", "q": "A patient in the acceptance stage of grief is most likely to state:", "o": ["\"This isn't happening to me.\"", "\"I've made peace with what's ahead, and I want to focus on time with my family.\"", "\"Why is this happening to me?\"", "\"If I do everything right, maybe I won't die.\""], "a": [1], "e": ["This reflects denial, not acceptance.", "", "This reflects anger, not acceptance.", "This reflects bargaining, not acceptance."], "r": "Acceptance involves coming to terms with the reality of the situation and often includes a shift in focus toward meaningful activities or relationships rather than resisting the outcome.", "tip": "NCLEX Tip: Acceptance does not necessarily mean happiness about the outcome — it means a realistic, peaceful acknowledgment of the situation."}, {"t": "mc", "q": "A widow whose grief is not acknowledged by others because her partner's death was by suicide is experiencing:", "o": ["Anticipatory grief", "Disenfranchised grief", "Complicated grief", "Normal grief"], "a": [1], "e": ["Anticipatory grief occurs before an expected loss, which does not describe this scenario.", "", "Complicated grief refers to grief that is prolonged or impairs functioning, which is not specified here.", "Normal (uncomplicated) grief resolves with support over time and does not typically involve lack of social acknowledgment."], "r": "Disenfranchised grief occurs when a person's loss is not openly acknowledged, socially sanctioned, or publicly supported, such as with stigmatized types of death or relationships.", "tip": "NCLEX Tip: Disenfranchised grief examples include miscarriage, suicide, and non-traditional relationships not recognized by society."}, {"t": "mc", "q": "Grief that begins before an actual loss occurs, such as while a family member is dying of a terminal illness, is called:", "o": ["Complicated grief", "Anticipatory grief", "Disenfranchised grief", "Delayed grief"], "a": [1], "e": ["Complicated grief refers to grief that persists or intensifies abnormally, not necessarily grief that occurs early.", "", "", "Delayed grief refers to a grief response that is postponed, not one that begins early."], "r": "Anticipatory grief occurs before the actual loss takes place, as family members and patients begin to process the impending death.", "tip": "NCLEX Tip: Anticipatory grief can actually be therapeutic, allowing families time to say goodbye and make preparations, though it doesn't eliminate grief after the loss."}, {"t": "mc", "q": "A nurse notices a colleague has become emotionally numb and cynical after caring for many dying patients over several months. This is most consistent with:", "o": ["Anticipatory grief", "Burnout or compassion fatigue", "Disenfranchised grief", "Normal bereavement"], "a": [1], "e": ["Anticipatory grief applies to grief experienced before a loss, not a caregiver's cumulative occupational stress.", "", "Disenfranchised grief refers to an unacknowledged personal loss, not caregiver burnout.", "Normal bereavement describes a grieving person's own loss response, not a caregiver's occupational stress reaction."], "r": "Compassion fatigue and burnout occur when caregivers experience emotional exhaustion and reduced empathy from repeated exposure to others' suffering, requiring self-care and support interventions.", "tip": "NCLEX Tip: Distinguish compassion fatigue (occupational, caregiver-focused) from grief (personal loss-focused) — both require support but through different strategies."}, {"t": "mc", "q": "Which statement by a new nurse suggests a need for further education about grief responses?", "o": ["\"Grief can look different for every patient and family.\"", "\"Everyone should move through the stages of grief in the same order and timeframe.\"", "\"A patient can experience more than one stage of grief at the same time.\"", "\"Grief doesn't always follow a neat, linear path.\""], "a": [1], "e": ["This reflects accurate understanding of grief's individualized nature.", "", "This reflects accurate understanding of the complexity of grief.", "This reflects accurate understanding of grief's nonlinear nature."], "r": "Grief is highly individualized and does not follow a fixed order or timeline; assuming a rigid, uniform process reflects a misunderstanding requiring further education.", "tip": "NCLEX Tip: 'Needs more teaching' questions often test whether a learner has an overly rigid or incorrect understanding of a nuanced concept like grief."}, {"t": "mc", "q": "Which nursing action best supports a family experiencing anticipatory grief while their loved one is actively dying?", "o": ["Discouraging the family from visiting to avoid distress", "Providing information about what to expect and creating opportunities for meaningful time together", "Telling the family not to cry in front of the patient", "Avoiding any discussion of the patient's prognosis"], "a": [1], "e": ["Visiting and presence are usually therapeutic, not something to discourage.", "", "Suppressing normal emotional expression is not therapeutic.", "Avoiding prognosis discussion can leave the family unprepared and increase distress."], "r": "Supporting anticipatory grief includes providing honest information, encouraging presence, and facilitating meaningful interactions, which can ease the grieving process for both patient and family.", "tip": "NCLEX Tip: Facilitating presence and honest communication generally supports healthy anticipatory grief processing."}, {"t": "mc", "q": "Which statement accurately differentiates palliative care from hospice care?", "o": ["Palliative care requires a prognosis of 6 months or less; hospice does not", "Hospice care requires that the patient forgo curative treatment for the terminal diagnosis, while palliative care does not", "Palliative care is only available in inpatient hospital settings", "Hospice care can be provided at any stage of a serious illness"], "a": [1], "e": ["This is reversed; hospice, not palliative care, requires a prognosis of 6 months or less.", "", "Palliative care can be delivered in many settings, not exclusively inpatient.", "Hospice care is specifically for patients with a terminal prognosis, typically 6 months or less."], "r": "A defining distinction is that hospice requires patients to forgo curative treatment for their terminal diagnosis, while palliative care can be provided alongside curative treatment at any stage of a serious illness.", "tip": "NCLEX Tip: 'All hospice care is palliative, but not all palliative care is hospice' is a useful phrase to remember this relationship."}, {"t": "mc", "q": "A patient with terminal cancer wants to continue chemotherapy while also receiving symptom management support. The most appropriate referral is to:", "o": ["Hospice care", "Palliative care", "Home health only", "No additional services are appropriate"], "a": [1], "e": ["Hospice would require the patient to forgo curative treatment such as chemotherapy.", "", "Home health alone does not provide the interdisciplinary symptom management palliative care offers.", "This patient would clearly benefit from palliative symptom management support."], "r": "Palliative care can be provided alongside curative or life-prolonging treatments such as chemotherapy, making it appropriate for a patient who wants to continue treatment while managing symptoms.", "tip": "NCLEX Tip: A patient continuing curative treatment while wanting symptom support should be referred to palliative care, not hospice."}, {"t": "mc", "q": "A dying patient develops noisy, wet-sounding respirations often called the 'death rattle.' The nurse understands this is due to:", "o": ["Active choking requiring the Heimlich maneuver", "Pooling of oral and airway secretions the patient can no longer clear", "A sign the patient is in severe pain", "An indication for immediate suctioning of the airway"], "a": [1], "e": ["This is not an acute choking event requiring the Heimlich maneuver.", "", "The death rattle is not primarily a pain indicator.", "Suctioning is typically avoided as it can cause discomfort and does not usually stop the death rattle, which arises from secretions the patient can no longer manage."], "r": "The 'death rattle' results from pooled oral and airway secretions that a dying patient can no longer clear due to a diminished cough and swallow reflex; repositioning and medications (e.g., anticholinergics) may be used for comfort, but suctioning is often avoided.", "tip": "NCLEX Tip: The death rattle is typically more distressing to family and staff than to the patient; education and comfort measures are prioritized over aggressive suctioning."}, {"t": "mc", "q": "Which of the following is an appropriate nursing action for managing anorexia and cachexia in a hospice patient?", "o": ["Insert a feeding tube to ensure adequate caloric intake", "Educate the family that decreased appetite is a natural part of the dying process, not a sign of giving up", "Force the patient to eat at each meal", "Withhold all oral comfort measures"], "a": [1], "e": ["Feeding tubes are generally avoided in hospice care as they do not improve comfort or prolong meaningful life and can increase complications.", "", "Forcing food intake can cause discomfort, aspiration risk, and distress without benefit near end of life.", "Oral comfort measures (ice chips, mouth care) should continue even when caloric intake decreases."], "r": "Decreased appetite and cachexia are expected, natural parts of the dying process; forcing nutrition does not improve comfort or outcomes, and family education helps reduce distress and misunderstanding.", "tip": "NCLEX Tip: In hospice care, comfort-focused nutrition (allowing the patient to eat as desired) is prioritized over forced caloric intake."}, {"t": "mc", "q": "Terminal delirium in a dying patient is best managed by:", "o": ["Physically restraining the patient to prevent injury", "Gently reorienting the patient, ensuring safety, and considering low-dose antipsychotics if needed, per orders", "Ignoring the behavior since it will resolve on its own without any intervention", "Increasing opioid doses regardless of pain assessment"], "a": [1], "e": ["Restraints are generally avoided as a first-line approach and can increase agitation and distress.", "", "While common, unmanaged agitation can cause distress and safety risks and should be addressed.", "Opioids should be titrated to pain assessment, not increased indiscriminately for agitation not related to pain."], "r": "Terminal delirium is managed with a calm environment, gentle reorientation, ensuring safety, and low-dose antipsychotic medication if needed, while educating the family that this is part of the dying process rather than unmanaged pain.", "tip": "NCLEX Tip: Distinguish terminal delirium (agitation/confusion near death) from undertreated pain — both may cause distress but require different interventions."}, {"t": "mc", "q": "A hospice patient reports dyspnea with an oxygen saturation of 95% on room air. The nurse should:", "o": ["Withhold treatment since the oxygen saturation is within normal limits", "Treat the subjective sensation of dyspnea, since it is a symptom to manage regardless of oxygen saturation", "Increase IV fluids rapidly to relieve the sensation", "Tell the patient the shortness of breath is not real since oxygen levels are normal"], "a": [1], "e": ["Dyspnea is treated as a subjective symptom, not solely based on oxygen saturation values.", "", "Rapid fluid administration is not an appropriate treatment for dyspnea in hospice care and could worsen symptoms.", "Dismissing the patient's subjective experience is invalidating and nontherapeutic."], "r": "Dyspnea in hospice/palliative care is treated as a subjective symptom requiring intervention (e.g., opioids, positioning, fan therapy) regardless of oxygen saturation, since the sensation of breathlessness may not correlate directly with oxygenation.", "tip": "NCLEX Tip: Always treat the patient's subjective report of dyspnea, not just the objective oxygen saturation number."}, {"t": "sata", "q": "Which of the following are appropriate components of symptom management at end of life? Select all that apply.", "o": ["Proactively dosing opioids around the clock for anticipated pain rather than only PRN", "Withholding all pain medication until the patient explicitly reports severe pain", "Using a fan or repositioning to help manage dyspnea", "Forcing oral intake to prevent malnutrition", "Providing gentle reorientation and ensuring safety for terminal delirium"], "a": [0, 2, 4], "e": ["", "Proactive, scheduled dosing is preferred over waiting for severe breakthrough pain at end of life.", "", "Forcing oral intake does not improve comfort or outcomes near end of life and can cause distress.", ""], "r": "End-of-life symptom management includes proactive, scheduled pain medication, non-pharmacologic comfort measures for dyspnea, and gentle management of terminal delirium, while avoiding forced feeding and reactive-only pain treatment.", "tip": "NCLEX Tip: End-of-life symptom management prioritizes comfort and proactive, scheduled interventions over reactive or curative-focused approaches."}, {"t": "mc", "q": "Which is the correct sequence of priority actions immediately following a patient's death?", "o": ["Bathe the body, then notify the provider, then verify death", "Verify death per policy, notify the provider, then check for autopsy/organ donation orders", "Remove all tubes, then verify death, then notify family", "Notify family first, then verify death, then document"], "a": [1], "e": ["Bathing should not occur before verification and required notifications.", "", "Tubes should not be removed before verifying death and checking for autopsy/donation restrictions.", "Verification of death per policy should generally precede family notification, and organ donation/autopsy status must be checked before any physical care."], "r": "The correct priority sequence is to verify death per facility policy, notify the responsible provider, and check for organ donation or autopsy orders before any physical care of the body begins.", "tip": "NCLEX Tip: Always default to 'verify, notify, check restrictions' before touching the body in postmortem care sequencing questions."}, {"t": "mc", "q": "A nurse is caring for a patient who has just died and organ donation has been approved. Which action is most appropriate?", "o": ["Remove all lines and tubes immediately per usual postmortem protocol", "Contact the organ procurement organization and follow their specific instructions regarding lines, tubes, and body care", "Proceed with standard postmortem care without any special considerations", "Inform the family that organ donation cancels the need for any further care"], "a": [1], "e": ["Standard tube/line removal may not be appropriate and could compromise organ viability.", "", "Standard postmortem care may need to be modified per organ procurement organization instructions.", "Organ donation does not eliminate the need for continued dignified care and communication with the family."], "r": "When organ donation is approved, the nurse should contact and follow the specific instructions of the organ procurement organization, since usual postmortem procedures (e.g., tube removal) may need to be modified to preserve organ viability.", "tip": "NCLEX Tip: Organ donation and pending autopsy/medical examiner cases both require checking with the relevant authority before altering the body in any way."}, {"t": "mc", "q": "Which is the best nursing action to preserve a family's cultural and religious preferences during postmortem care?", "o": ["Apply the same standard procedure to every patient regardless of preference", "Ask the family about specific cultural or religious practices they would like honored, when possible", "Assume most families prefer the same approach as the nurse's own background", "Avoid discussing preferences to save time"], "a": [1], "e": ["Standardized care without considering individual preferences can be culturally insensitive.", "", "Assuming shared preferences ignores the family's actual individual and cultural context.", "Avoiding this discussion can result in care that conflicts with important family/cultural wishes."], "r": "Nurses should ask about and accommodate cultural and religious preferences whenever possible during postmortem care, which supports family-centered, culturally sensitive practice.", "tip": "NCLEX Tip: Whenever a scenario involves end-of-life or postmortem care, look for the answer that asks about and honors individual/cultural preferences."}, {"t": "mc", "q": "Which finding would require the nurse to delay routine postmortem care and notify additional authorities?", "o": ["The family has requested to see the body before it is moved", "There is a pending police investigation into the circumstances of death", "The patient's dentures need to be located", "The family wants to assist with washing the body"], "a": [1], "e": ["This is a normal, expected request that does not require delaying appropriate steps.", "", "This is a routine detail addressed during standard postmortem care.", "This is a welcomed, therapeutic family request."], "r": "A pending police or medical examiner investigation requires the nurse to avoid altering the body (including removing lines/tubes) and to notify the appropriate authorities before proceeding with routine postmortem care.", "tip": "NCLEX Tip: Any indication of a medicolegal investigation is a 'stop and check' trigger before performing typical postmortem procedures."}, {"t": "mc", "q": "A new nurse asks why standard precautions must still be followed during postmortem care. The best response is:", "o": ["\"Standard precautions are not necessary once a patient has died.\"", "\"Pathogens can still be present in body fluids after death, so standard precautions continue to protect staff and others.\"", "\"Only gloves are needed, no other precautions are required.\"", "\"Precautions are only needed if the family requests them.\""], "a": [1], "e": ["Precautions remain necessary because biological risk does not end at the moment of death.", "", "Additional PPE (e.g., gown, mask) may be needed depending on the situation, not just gloves.", "Precautions are based on infection control principles and policy, not family preference."], "r": "Standard precautions continue after death because body fluids can still harbor infectious pathogens, and continued use of appropriate PPE protects healthcare workers and others involved in postmortem care.", "tip": "NCLEX Tip: Infection control principles do not stop applying simply because a patient has died — biological risk persists in body fluids and tissue."}, {"t": "mc", "q": "A nurse is caring for a patient whose family prefers that a diagnosis of terminal illness not be disclosed directly to the patient, based on their cultural beliefs. The best initial nursing action is:", "o": ["Immediately disclose the diagnosis to the patient regardless of family wishes", "Explore the family's concerns and involve the care team and, if appropriate, an ethics consult to balance patient autonomy and cultural values", "Refuse to provide any further care until the family agrees to disclosure", "Tell the family their request cannot legally be honored under any circumstances"], "a": [1], "e": ["Immediate unilateral disclosure without further exploration may conflict with cultural sensitivity and patient-centered care principles.", "", "Refusing care is an inappropriate and unprofessional response.", "Legal and ethical approaches to disclosure can vary; blanket refusal without further exploration is not the most appropriate initial response."], "r": "When cultural beliefs about disclosure conflict with typical practice, the nurse should explore the family's concerns, involve the interdisciplinary team, and consider an ethics consultation to navigate the situation thoughtfully while respecting both patient autonomy and cultural context.", "tip": "NCLEX Tip: Ethical dilemmas involving disclosure and cultural values are addressed through exploration, team collaboration, and ethics consultation rather than unilateral action."}, {"t": "mc", "q": "A nurse is caring for a non-English-speaking patient. Which action reflects best practice for communication?", "o": ["Speaking loudly and slowly in English", "Using a certified medical interpreter, either in person or via a qualified interpreter service", "Using translation apps as the sole means of complex medical communication", "Asking a bilingual housekeeping staff member to interpret medical information"], "a": [1], "e": ["Speaking loudly does not overcome a language barrier and does not respect the patient.", "", "Automated translation apps may not accurately convey nuanced or complex medical information and are not substitutes for certified interpreters.", "Non-certified staff should not be relied upon for medical interpretation, particularly for complex or sensitive information."], "r": "Best practice for language barriers involves the use of a certified/qualified medical interpreter, which ensures accuracy, confidentiality, and better health outcomes compared to informal interpretation methods.", "tip": "NCLEX Tip: Certified medical interpreters are preferred over family members, non-medical staff, or apps for any complex, sensitive, or informed-consent-related communication."}, {"t": "mc", "q": "Which nursing behavior best reflects professional boundaries in a therapeutic relationship?", "o": ["Accepting an invitation to a patient's family event after discharge", "Declining to share personal contact information with a patient and redirecting requests for support to appropriate resources", "Discussing the nurse's own personal problems with the patient for support", "Developing a romantic relationship with a patient after discharge"], "a": [1], "e": ["Accepting such invitations can blur professional boundaries.", "", "This crosses professional boundaries by making the patient responsible for the nurse's emotional needs.", "This is a serious boundary violation regardless of discharge status, especially given the power differential in the relationship."], "r": "Maintaining professional boundaries includes not sharing personal contact information, not relying on patients for the nurse's own emotional support, and directing patients to appropriate resources rather than personal involvement.", "tip": "NCLEX Tip: Boundary violation questions test recognition of behaviors that blur the professional line, even after a patient's discharge."}, {"t": "mc", "q": "A nurse disagrees with a colleague's approach to a family conversation about goals of care. The most professional response is to:", "o": ["Publicly criticize the colleague's approach in front of the family", "Discuss the concern privately and respectfully with the colleague afterward", "Say nothing and allow the same issue to happen repeatedly", "Complain about the colleague to unrelated staff members"], "a": [1], "e": ["Public criticism undermines team trust and is unprofessional in front of patients/families.", "", "Ignoring recurring practice concerns does not support patient safety or professional growth.", "Complaining to uninvolved staff does not resolve the concern and can be unprofessional."], "r": "Addressing practice concerns privately and respectfully with the involved colleague models professional communication and supports a collaborative, safe care environment.", "tip": "NCLEX Tip: Professional disagreements should be addressed directly and privately with the involved party whenever possible, not through public criticism or gossip."}, {"t": "mc", "q": "A nurse uses the phrase, \"Go on...\" while a patient is describing their feelings about a new diagnosis. This is an example of:", "o": ["General leads that encourage the patient to continue talking", "Giving advice", "Presenting reality", "Stereotyping"], "a": [0], "e": ["", "This does not tell the patient what to do.", "This does not correct a misperception.", "This does not apply a generalized assumption."], "r": "General leads such as 'go on,' 'and then?' or 'I see' encourage the patient to continue sharing without directing the conversation, keeping the focus on the patient's own narrative.", "tip": "NCLEX Tip: General leads are brief, neutral phrases that invite continued disclosure without redirecting the conversation."}, {"t": "mc", "q": "Which of the following best reflects 'giving information' as a therapeutic communication technique?", "o": ["\"You'll be fine, don't ask so many questions.\"", "\"Your procedure is scheduled for 9 a.m. tomorrow, and it typically takes about an hour.\"", "\"I really can't say when your procedure will happen.\"", "\"Why do you need to know the details?\""], "a": [1], "e": ["This dismisses the patient's need for information.", "", "This withholds available, relevant information from the patient.", "This questions the patient's right to information rather than providing it."], "r": "Giving information involves providing relevant facts a patient needs to make informed decisions or reduce anxiety, delivered clearly and directly.", "tip": "NCLEX Tip: Giving information differs from giving advice — information is factual and neutral, while advice tells the patient what they should do."}, {"t": "mc", "q": "A patient states, \"I just don't know what to do anymore.\" The nurse responds, \"You're feeling stuck and unsure of your next steps.\" This is an example of:", "o": ["Reflecting", "Restating", "Focusing", "Confrontation"], "a": [0], "e": ["", "Restating repeats the content, not the underlying feeling, in different words.", "Focusing narrows to one specific topic, which is not shown here.", "Confrontation addresses a discrepancy, not present in this example."], "r": "Reflecting identifies and mirrors back the underlying emotion a patient is expressing, helping them feel heard and understood.", "tip": "NCLEX Tip: Reflecting targets feelings ('You seem...' / 'You're feeling...'), while restating targets the literal content of what was said."}, {"t": "mc", "q": "Which is an example of 'focusing' as a therapeutic communication technique?", "o": ["\"You mentioned your pain earlier — can we go back to that for a moment?\"", "\"Let's talk about anything you'd like today.\"", "\"I think you should focus on getting more rest.\"", "\"Everyone feels that way sometimes.\""], "a": [0], "e": ["", "This is a broad opening statement, not focusing on a specific topic.", "This is giving advice.", "This is stereotyping/generalizing."], "r": "Focusing directs the conversation toward a specific, important topic the patient has mentioned, helping to explore it in greater depth.", "tip": "NCLEX Tip: Focusing is especially useful when a patient's conversation is scattered and needs to be centered on a key concern."}, {"t": "mc", "q": "A hospice nurse is educating a new staff member about anticipatory grief. Which statement should be included?", "o": ["\"Anticipatory grief means the family won't grieve after the death occurs.\"", "\"Anticipatory grief can allow families time to prepare and say goodbye, but grief still continues after the death.\"", "\"Anticipatory grief only occurs in pediatric patients.\"", "\"Anticipatory grief is a sign of a dysfunctional family.\""], "a": [1], "e": ["Anticipatory grief does not eliminate grief after the actual loss occurs.", "", "Anticipatory grief can occur in patients and families of any age.", "Anticipatory grief is a normal, common response, not a sign of dysfunction."], "r": "Anticipatory grief occurs before a loss and can help families begin to prepare and find closure, but it does not replace or eliminate the grief response that continues after the death occurs.", "tip": "NCLEX Tip: Anticipatory grief is protective/adaptive in many cases but does not shorten or eliminate post-death grief and bereavement needs."}, {"t": "mc", "q": "Which best reflects the concept of 'complicated grief'?", "o": ["Grief that resolves gradually over several months with support", "Grief that persists intensely, impairs daily functioning, and does not improve over an extended period", "Grief experienced before a loss occurs", "Grief that is not acknowledged by others"], "a": [1], "e": ["This describes normal, uncomplicated grief.", "", "This describes anticipatory grief.", "This describes disenfranchised grief."], "r": "Complicated (or prolonged) grief involves persistent, intense grief symptoms that impair functioning well beyond the expected timeframe and may require specialized mental health intervention.", "tip": "NCLEX Tip: Complicated grief may warrant referral to a grief counselor or mental health specialist when symptoms are severe or prolonged."}, {"t": "mc", "q": "A dying patient's daughter states she feels guilty for wanting her mother's suffering to end soon. The nurse's best response is:", "o": ["\"That's a terrible thing to think.\"", "\"It's common to have complicated feelings like that when someone you love is suffering — it doesn't mean you don't love her.\"", "\"You shouldn't feel that way at all.\"", "\"Let's not discuss those feelings.\""], "a": [1], "e": ["This judges and shames the daughter's normal feelings.", "", "This dismisses a very common and normal emotional experience.", "Avoiding the topic denies the daughter an opportunity for emotional support."], "r": "Validating that complex, sometimes conflicting feelings (such as wanting suffering to end while still loving the person) are a normal part of anticipatory grief helps reduce guilt and supports healthy coping.", "tip": "NCLEX Tip: Complicated or seemingly contradictory feelings during anticipatory grief are common and should be validated, not judged."}, {"t": "mc", "q": "Which best describes the role of an interdisciplinary team in palliative care, per the National Consensus Project's domains of care?", "o": ["Only physicians are involved in palliative care planning", "Palliative care addresses physical, psychological, social, and spiritual domains through a team-based approach", "Palliative care focuses exclusively on physical pain management", "Social workers and chaplains are not part of the palliative care team"], "a": [1], "e": ["Palliative care is inherently interdisciplinary, not limited to one discipline.", "", "Palliative care addresses multiple domains beyond physical pain, including psychological, social, and spiritual needs.", "Social workers and chaplains are core members of most palliative care teams."], "r": "Palliative care follows a holistic, interdisciplinary model addressing physical, psychological, social, and spiritual domains of care, typically involving physicians, nurses, social workers, chaplains, and other specialists.", "tip": "NCLEX Tip: Remember palliative care's holistic, multi-domain framework — it's not just about pain control."}, {"t": "mc", "q": "A patient's family requests that certain cultural rituals be performed immediately after death, before any postmortem care begins. The nurse's best response is:", "o": ["\"We don't have time for rituals, we need to prepare the body immediately.\"", "\"Let's accommodate that as much as possible within safety and policy guidelines.\"", "\"Rituals aren't part of our standard care, so we can't allow that.\"", "\"You'll need to do that after the body has left the unit.\""], "a": [1], "e": ["This dismisses an important cultural/religious need without attempting accommodation.", "", "This is dismissive of legitimate cultural and religious practices.", "Delaying important rituals until after the body has left the unit may not meet the family's needs or timing requirements."], "r": "Whenever possible, nurses should accommodate cultural and religious rituals surrounding death within the bounds of safety and facility policy, reflecting patient- and family-centered, culturally sensitive care.", "tip": "NCLEX Tip: Cultural accommodation questions almost always favor flexibility and accommodation over rigid adherence to standard procedure, when safety allows."}, {"t": "mc", "q": "Which of the following best reflects a nurse practicing self-awareness to provide effective therapeutic communication?", "o": ["Ignoring personal biases because they don't affect patient care", "Recognizing personal biases or discomfort and actively working to prevent them from affecting patient interactions", "Assuming personal beliefs should guide all patient education", "Avoiding reflection on personal reactions to difficult patient situations"], "a": [1], "e": ["Personal biases can affect care and should not be ignored.", "", "Patient education should be based on evidence and the patient's needs, not the nurse's personal beliefs.", "Reflection on personal reactions is an important part of professional growth and self-awareness."], "r": "Self-awareness involves recognizing one's own biases, emotional reactions, and discomfort, and actively managing them so they do not interfere with providing nonjudgmental, patient-centered therapeutic communication.", "tip": "NCLEX Tip: Self-awareness is a foundational component of therapeutic communication and professional nursing practice."}, {"t": "mc", "q": "Which best represents an appropriate way to address a patient's spiritual distress that is contributing to poor coping with a terminal diagnosis?", "o": ["Providing the nurse's own religious beliefs as the solution", "Offering a referral to chaplaincy or spiritual care services and remaining supportive of the patient's own beliefs", "Avoiding any mention of spirituality to prevent discomfort", "Telling the patient their beliefs are the cause of their distress"], "a": [1], "e": ["Imposing the nurse's personal beliefs is not appropriate or patient-centered.", "", "Avoidance can leave an important source of distress unaddressed.", "This blames the patient rather than offering support."], "r": "Nurses should recognize spiritual distress, offer appropriate referrals (e.g., chaplaincy), and support the patient's own beliefs and coping mechanisms rather than imposing personal views or avoiding the topic.", "tip": "NCLEX Tip: Spiritual care interventions should be patient-centered and non-imposing, typically involving referral to trained spiritual care providers when needed."}, {"t": "fib", "q": "Fill in the blank: A referral to chaplaincy or spiritual care services is an appropriate intervention when a patient is experiencing ______ distress related to their illness or prognosis.", "blanks": [["spiritual", "Spiritual"]], "r": "Spiritual distress refers to a disturbance in a person's belief system or spiritual well-being, often triggered by serious illness, and is appropriately addressed through chaplaincy or spiritual care referral alongside emotional support.", "tip": "NCLEX Tip: Recognize spiritual distress as a legitimate nursing diagnosis category requiring appropriate referral, not something to dismiss or manage alone."}], "m2": [{"t": "mc", "q": "Which heart sound corresponds to the closure of the mitral and tricuspid valves at the start of systole?", "o": ["S1", "S2", "S3", "S4"], "a": [0], "e": ["", "This sound corresponds to closure of the aortic and pulmonic valves at the start of diastole.", "This is an extra sound heard in early diastole, not related to AV valve closure at the start of systole.", "This is an extra sound heard in late diastole, not related to AV valve closure."], "r": "S1 ('lub') occurs with the closure of the mitral and tricuspid (atrioventricular) valves, marking the beginning of ventricular systole.", "tip": "NCLEX Tip: S1 = AV valves close = systole begins. S2 = semilunar valves close = diastole begins. Remember 'M-T for S1, A-P for S2.'"}, {"t": "mc", "q": "S2 ('dub') is produced by closure of which valves?", "o": ["Mitral and tricuspid", "Aortic and pulmonic", "Mitral and aortic", "Tricuspid and pulmonic"], "a": [1], "e": ["These valves close to produce S1, not S2.", "", "This pairing is incorrect; S2 involves both semilunar valves together.", "This pairing is incorrect; S2 involves both semilunar valves together."], "r": "S2 occurs with closure of the aortic and pulmonic (semilunar) valves, marking the start of diastole.", "tip": "NCLEX Tip: Semilunar valves (aortic, pulmonic) = S2; atrioventricular valves (mitral, tricuspid) = S1."}, {"t": "mc", "q": "A nurse auscultates an extra heart sound just after S2 in a patient with new-onset heart failure. This finding is most consistent with:", "o": ["S1", "A physiologic split S2", "S3 (ventricular gallop)", "S4 (atrial gallop)"], "a": [2], "e": ["S1 occurs at the start of systole, not after S2.", "A split S2 is a different, higher-pitched finding related to valve closure timing, not a distinct extra sound of ventricular filling.", "", "S4 occurs just before S1, not just after S2."], "r": "S3, or ventricular gallop, occurs just after S2 during early rapid ventricular filling and is classically associated with volume overload and heart failure.", "tip": "NCLEX Tip: S3 = 'Ken-tuc-KY' rhythm, heard best with the bell at the apex in left lateral decubitus position; associated with heart failure/volume overload."}, {"t": "mc", "q": "Which patient position and stethoscope component are best for auscultating an S3 or S4 heart sound?", "o": ["Supine position, using the diaphragm", "Left lateral decubitus position, using the bell", "Sitting upright leaning forward, using the diaphragm", "Trendelenburg position, using the bell"], "a": [1], "e": ["The diaphragm is used for high-pitched sounds; S3/S4 are low-pitched sounds best heard with the bell.", "", "This position and diaphragm combination is used for auscultating aortic regurgitation, not S3/S4.", "Trendelenburg position is not the recommended position for auscultating extra heart sounds."], "r": "S3 and S4 are low-pitched sounds best auscultated with the bell of the stethoscope at the apex (mitral area) with the patient in the left lateral decubitus position.", "tip": "NCLEX Tip: Bell = low-pitched sounds (S3, S4, mitral stenosis murmur); diaphragm = high-pitched sounds (S1, S2, most murmurs, aortic regurgitation)."}, {"t": "mc", "q": "An S4 heart sound is most commonly associated with which condition?", "o": ["Volume overload from heart failure", "Decreased ventricular compliance, such as from long-standing hypertension", "Normal finding in all healthy adults", "Mitral valve prolapse"], "a": [1], "e": ["Volume overload is associated with S3, not S4.", "", "S4 is generally considered an abnormal finding in adults, though it can be normal in children, young adults, and pregnancy.", "Mitral valve prolapse is typically associated with a midsystolic click, not S4."], "r": "S4, or atrial gallop, occurs just before S1 during atrial contraction and reflects decreased ventricular compliance often caused by long-standing hypertension, aortic stenosis, or ischemic heart disease.", "tip": "NCLEX Tip: S4 = 'Ten-nes-SEE' rhythm; think 'stiff ventricle' — hypertension, LVH, ischemia."}, {"t": "fib", "q": "Fill in the blank: The point of maximal impulse (PMI) is normally palpated at the ______ intercostal space at the midclavicular line.", "blanks": [["5th", "fifth", "5"]], "r": "The PMI is normally located at the 5th intercostal space, left midclavicular line, corresponding to the apex of the heart.", "tip": "NCLEX Tip: A PMI displaced laterally from this location may indicate cardiomegaly or ventricular hypertrophy."}, {"t": "mc", "q": "During cardiac auscultation, where should the nurse listen to best assess the mitral valve?", "o": ["2nd right intercostal space at the sternal border", "2nd left intercostal space at the sternal border", "4th left intercostal space at the sternal border", "5th left intercostal space at the midclavicular line"], "a": [3], "e": ["This location is used to auscultate the aortic valve.", "This location is used to auscultate the pulmonic valve.", "This location is used to auscultate the tricuspid valve.", ""], "r": "The mitral valve is best auscultated at the apex, located at the 5th left intercostal space, midclavicular line.", "tip": "NCLEX Tip: Remember the auscultation sites in order from base to apex: Aortic (2nd R), Pulmonic (2nd L), Tricuspid (4th L), Mitral (5th L midclavicular) — mnemonic: 'APT-M' or 'All Physicians Take Money.'"}, {"t": "sata", "q": "Which of the following are correct auscultation landmarks for cardiac assessment? Select all that apply.", "o": ["Aortic: 2nd right intercostal space at the sternal border", "Pulmonic: 2nd left intercostal space at the sternal border", "Tricuspid: 5th right intercostal space at the sternal border", "Mitral: 5th left intercostal space at the midclavicular line", "Erb's point: 3rd left intercostal space"], "a": [0, 1, 3, 4], "e": ["", "", "The tricuspid area is located at the 4th left intercostal space, not the 5th right intercostal space.", "", ""], "r": "Correct cardiac auscultation landmarks are: Aortic (2nd right ICS), Pulmonic (2nd left ICS), Tricuspid (4th left ICS), Mitral (5th left ICS, midclavicular line), and Erb's point (3rd left ICS), where sounds from both semilunar valves may be heard.", "tip": "NCLEX Tip: Draw out the 5 auscultation points on a diagram until you can identify them without hesitation — this is a heavily tested visual/spatial concept."}, {"t": "mc", "q": "Which formula correctly represents cardiac output?", "o": ["Heart rate x stroke volume", "Systolic BP - diastolic BP", "Stroke volume / heart rate", "Mean arterial pressure x heart rate"], "a": [0], "e": ["", "This describes pulse pressure, not cardiac output.", "This is an inverted, incorrect formula.", "This is not the formula for cardiac output."], "r": "Cardiac output is calculated as heart rate multiplied by stroke volume (CO = HR x SV) and reflects the volume of blood the heart pumps per minute.", "tip": "NCLEX Tip: CO = HR x SV. If either heart rate or stroke volume drops significantly, cardiac output — and tissue perfusion — falls."}, {"t": "mc", "q": "A nurse assesses a patient's peripheral pulses and grades the radial pulse as 1+. This finding indicates:", "o": ["Bounding pulse", "Normal pulse", "Diminished pulse", "Absent pulse"], "a": [2], "e": ["A bounding pulse is graded 4+.", "A normal pulse is graded 2+.", "", "An absent pulse is graded 0."], "r": "Pulse grading ranges from 0 (absent) to 4+ (bounding); a grade of 1+ indicates a diminished, weaker-than-normal pulse.", "tip": "NCLEX Tip: Pulse grading scale: 0 = absent, 1+ = diminished, 2+ = normal, 3+ = increased, 4+ = bounding."}, {"t": "mc", "q": "A patient has 3+ pitting edema noted in both lower extremities. The nurse understands this finding is most consistent with:", "o": ["Normal finding requiring no further assessment", "Possible heart failure, venous insufficiency, or fluid overload", "Arterial occlusion", "Dehydration"], "a": [1], "e": ["3+ pitting edema is an abnormal finding warranting further assessment, not a normal variant.", "", "Arterial occlusion typically presents with diminished pulses and pallor, not bilateral pitting edema.", "Dehydration would be more likely to present with decreased skin turgor, not peripheral edema."], "r": "Bilateral peripheral edema may indicate heart failure, venous insufficiency, or systemic fluid overload and requires further cardiovascular and renal assessment.", "tip": "NCLEX Tip: Edema grading (1+ to 4+) is based on depth of pitting and how long the indentation persists — 4+ pitting edema is deep and very slow to resolve."}, {"t": "mc", "q": "Which finding on inspection would be most concerning for right-sided heart failure?", "o": ["Capillary refill of 2 seconds", "Jugular venous distention (JVD) with the patient positioned at 30-45 degrees", "PMI at the 5th intercostal space, midclavicular line", "Regular pulse rhythm"], "a": [1], "e": ["A capillary refill of 2 seconds or less is a normal finding.", "", "A normally located PMI is an expected, normal finding.", "A regular pulse rhythm is a normal finding."], "r": "Jugular venous distention observed with the patient at 30-45 degrees suggests elevated right atrial pressure, commonly associated with right-sided heart failure or fluid overload.", "tip": "NCLEX Tip: JVD is assessed with the head of bed at 30-45 degrees — assessing at the wrong angle can lead to a false-negative or false-positive finding."}, {"t": "mc", "q": "Normal capillary refill time in the nail beds should be:", "o": ["Less than 2 seconds", "Greater than 4 seconds", "Exactly 5 seconds", "There is no normal range"], "a": [0], "e": ["", "A refill time greater than 2-3 seconds is considered delayed/abnormal.", "This is outside the normal range and would indicate poor perfusion.", ""], "r": "Normal capillary refill time is less than 2 seconds; a delayed capillary refill may indicate poor peripheral perfusion.", "tip": "NCLEX Tip: Always compare capillary refill bilaterally — a unilateral delay may point to a localized vascular problem rather than a systemic one."}, {"t": "sata", "q": "Which findings would the nurse expect to see with orthostatic hypotension? Select all that apply.", "o": ["A drop in systolic BP of 20 mmHg or more upon standing", "A drop in diastolic BP of 10 mmHg or more upon standing", "Increase in heart rate upon standing", "Improved level of consciousness upon standing", "Dizziness or lightheadedness upon standing"], "a": [0, 1, 2, 4], "e": ["", "", "", "Orthostatic hypotension typically causes dizziness or even syncope upon standing, not improved consciousness, due to transient cerebral hypoperfusion.", ""], "r": "Orthostatic hypotension is defined as a drop in systolic BP ≥20 mmHg or diastolic BP ≥10 mmHg within 3 minutes of standing, often accompanied by compensatory tachycardia and symptoms such as dizziness or lightheadedness.", "tip": "NCLEX Tip: Always check orthostatic vital signs in a sequence: supine, sitting, then standing, waiting about 1-3 minutes between position changes."}, {"t": "mc", "q": "A murmur that is crescendo-decrescendo, heard at the right upper sternal border, and radiates to the carotids is most characteristic of:", "o": ["Mitral regurgitation", "Aortic stenosis", "Mitral stenosis", "Tricuspid regurgitation"], "a": [1], "e": ["Mitral regurgitation produces a holosystolic, blowing murmur at the apex, not this pattern.", "", "Mitral stenosis produces a diastolic, low-pitched rumbling murmur, not a systolic crescendo-decrescendo murmur.", "Tricuspid regurgitation is heard at the left lower sternal border and increases with inspiration."], "r": "Aortic stenosis classically produces a crescendo-decrescendo (diamond-shaped) systolic murmur heard best at the right upper sternal border, radiating to the carotid arteries.", "tip": "NCLEX Tip: 'Crescendo-decrescendo + radiates to carotids' is a classic exam clue for aortic stenosis."}, {"t": "mc", "q": "A holosystolic, blowing murmur heard at the apex that radiates to the axilla is most consistent with:", "o": ["Aortic stenosis", "Mitral regurgitation", "Aortic regurgitation", "Mitral stenosis"], "a": [1], "e": ["Aortic stenosis produces a crescendo-decrescendo murmur at the right upper sternal border, not a holosystolic murmur at the apex.", "", "Aortic regurgitation produces an early diastolic murmur at the left sternal border.", "Mitral stenosis produces a diastolic, rumbling murmur with an opening snap."], "r": "Mitral regurgitation is characterized by a holosystolic, blowing murmur best heard at the apex, classically radiating to the axilla.", "tip": "NCLEX Tip: Mitral regurgitation = holosystolic + apex + radiates to axilla; Aortic stenosis = crescendo-decrescendo + right upper sternal border + radiates to carotids."}, {"t": "mc", "q": "Which murmur increases in intensity with inspiration?", "o": ["Aortic stenosis", "Mitral regurgitation", "Tricuspid regurgitation", "Aortic regurgitation"], "a": [2], "e": ["Aortic stenosis is not classically described as increasing with inspiration.", "Mitral regurgitation is not classically described as increasing with inspiration.", "", "Aortic regurgitation is not classically described as increasing with inspiration."], "r": "Tricuspid regurgitation produces a holosystolic murmur at the left lower sternal border that characteristically increases in intensity with inspiration, due to increased venous return to the right side of the heart (Carvallo's sign).", "tip": "NCLEX Tip: Right-sided murmurs (tricuspid, pulmonic) typically increase with inspiration; left-sided murmurs typically increase with expiration."}, {"t": "mc", "q": "A low-pitched, rumbling diastolic murmur with an opening snap heard at the apex is characteristic of:", "o": ["Aortic regurgitation", "Mitral stenosis", "Mitral regurgitation", "Aortic stenosis"], "a": [1], "e": ["Aortic regurgitation is an early diastolic, high-pitched, blowing murmur at the left sternal border.", "", "Mitral regurgitation is a systolic, not diastolic, murmur.", "Aortic stenosis is a systolic murmur."], "r": "Mitral stenosis produces a low-pitched, rumbling diastolic murmur heard at the apex, often accompanied by an opening snap.", "tip": "NCLEX Tip: Diastolic murmurs are generally more concerning/pathologic than innocent systolic flow murmurs and always warrant further workup."}, {"t": "mc", "q": "A nurse hears a soft, short systolic murmur in a healthy 8-year-old child during a routine exam, with no other symptoms. This is most likely:", "o": ["A pathologic murmur requiring immediate referral", "An innocent (physiologic) flow murmur", "A sign of infective endocarditis", "A sign of a septal defect requiring surgery"], "a": [1], "e": ["Not all murmurs in children are pathologic; findings must be correlated with the full clinical picture.", "", "Infective endocarditis would typically present with additional systemic signs such as fever.", "A definitive diagnosis of septal defect requiring surgery cannot be made from auscultation alone."], "r": "Innocent (physiologic) flow murmurs are common in children and young adults and are typically soft, short, and not associated with other symptoms or structural abnormalities.", "tip": "NCLEX Tip: Innocent murmurs are typically soft (grade I-II), don't radiate widely, and occur in an otherwise asymptomatic patient."}, {"t": "mc", "q": "A patient with a fever, IV drug use history, and a new heart murmur is most concerning for which condition?", "o": ["Innocent flow murmur", "Infective endocarditis", "Physiologic murmur of pregnancy", "Anemia-related flow murmur"], "a": [1], "e": ["Innocent flow murmurs occur without infectious risk factors or systemic symptoms like fever.", "", "This presentation is unrelated to pregnancy.", "While anemia can cause flow murmurs, the combination of fever and IV drug use is a classic risk profile for endocarditis."], "r": "A new murmur in a patient with fever and a history of IV drug use raises strong concern for infective endocarditis, which requires prompt further evaluation (e.g., blood cultures, echocardiogram).", "tip": "NCLEX Tip: Learn the risk factors for infective endocarditis: IV drug use, prosthetic valves, recent dental work, and structural heart disease."}, {"t": "mc", "q": "Murmurs graded at a VI on the intensity scale are best described as:", "o": ["Barely audible, only heard in a quiet room", "Audible without a stethoscope", "Heard with a palpable thrill", "Not clinically significant"], "a": [1], "e": ["Grade I murmurs are barely audible.", "", "A palpable thrill is typically associated with grade IV or higher, but grade VI specifically is audible without a stethoscope at all.", "High-grade murmurs are clinically significant and warrant further evaluation."], "r": "Murmur intensity is graded I (barely audible) through VI (audible without a stethoscope even off the chest wall).", "tip": "NCLEX Tip: Grades IV-VI are typically associated with a palpable thrill; grade VI is audible even with the stethoscope lifted off the chest."}, {"t": "mc", "q": "On a normal EKG tracing, the P wave represents:", "o": ["Ventricular depolarization", "Atrial depolarization", "Ventricular repolarization", "Atrial repolarization"], "a": [1], "e": ["Ventricular depolarization is represented by the QRS complex.", "", "Ventricular repolarization is represented by the T wave.", "Atrial repolarization is not typically visible as it is masked by the QRS complex."], "r": "The P wave represents atrial depolarization, reflecting the spread of the electrical impulse through the atria.", "tip": "NCLEX Tip: P wave = atria depolarize; QRS = ventricles depolarize; T wave = ventricles repolarize."}, {"t": "mc", "q": "A prolonged PR interval on an EKG most directly indicates a delay in conduction at which location?", "o": ["The SA node", "The AV node", "The bundle of His", "The Purkinje fibers"], "a": [1], "e": ["The SA node initiates the impulse; the PR interval reflects the delay after leaving the atria.", "", "The bundle of His is part of the ventricular conduction system, occurring after the PR interval delay.", "The Purkinje fibers are the final distribution pathway, not the site reflected by PR interval prolongation."], "r": "The PR interval represents the time from the onset of atrial depolarization to the onset of ventricular depolarization, primarily reflecting the delay at the AV node; a prolonged PR interval suggests a conduction delay there (e.g., first-degree heart block).", "tip": "NCLEX Tip: Normal PR interval = 0.12-0.20 seconds (3-5 small boxes). A PR interval greater than 0.20 seconds indicates first-degree heart block."}, {"t": "fib", "q": "Fill in the blank: The normal QRS complex duration should be less than ______ seconds.", "blanks": [["0.12", ".12"]], "r": "A normal QRS complex is less than 0.12 seconds (3 small boxes); a widened QRS suggests a ventricular origin of the rhythm or a bundle branch block.", "tip": "NCLEX Tip: Narrow QRS = supraventricular origin; wide QRS = ventricular origin or a conduction delay (bundle branch block)."}, {"t": "mc", "q": "A patient's EKG shows a QTc of 490 ms. This finding is most concerning because it increases the patient's risk for:", "o": ["First-degree heart block", "Torsades de pointes (a life-threatening ventricular arrhythmia)", "Sinus bradycardia", "Atrial flutter"], "a": [1], "e": ["A prolonged QTc is not directly linked to first-degree heart block.", "", "Sinus bradycardia is not caused by a prolonged QTc.", "Atrial flutter is not directly linked to a prolonged QTc."], "r": "A prolonged QTc (greater than 450 ms in men or 460 ms in women) increases the risk of torsades de pointes, a potentially life-threatening polymorphic ventricular tachycardia.", "tip": "NCLEX Tip: Common causes of QT prolongation include certain antiarrhythmics, antipsychotics, electrolyte imbalances (hypokalemia, hypomagnesemia), and congenital long QT syndrome."}, {"t": "mc", "q": "Peaked, tall T waves on an EKG are most classically associated with which electrolyte imbalance?", "o": ["Hypokalemia", "Hyperkalemia", "Hypocalcemia", "Hypercalcemia"], "a": [1], "e": ["Hypokalemia is associated with flattened T waves and U waves, not peaked T waves.", "", "Hypocalcemia is associated with a prolonged QT interval, not peaked T waves.", "Hypercalcemia is associated with a shortened QT interval, not peaked T waves."], "r": "Peaked, tall, narrow T waves are a classic early EKG finding in hyperkalemia and require prompt evaluation and treatment.", "tip": "NCLEX Tip: Hyperkalemia = peaked T waves, widened QRS, and eventually a sine-wave pattern if untreated. Hypokalemia = flattened T waves and U waves."}, {"t": "mc", "q": "ST segment elevation on an EKG is most indicative of:", "o": ["Normal variant in all patients", "Myocardial ischemia or acute myocardial infarction", "Atrial enlargement", "A benign finding requiring no further workup"], "a": [1], "e": ["ST elevation is an abnormal finding requiring investigation, not a universal normal variant.", "", "Atrial enlargement is reflected in P wave changes, not ST segment changes.", "ST elevation is a potentially life-threatening finding requiring urgent evaluation."], "r": "ST segment elevation suggests myocardial ischemia or infarction and requires immediate clinical correlation and intervention, such as activation of a STEMI protocol.", "tip": "NCLEX Tip: 'ST elevation = emergency' — treat as a potential STEMI until proven otherwise."}, {"t": "mc", "q": "When performing a systematic EKG interpretation, which step should be completed first?", "o": ["Assess the QT interval", "Determine the rate and rhythm", "Evaluate the ST segment", "Assess the axis"], "a": [1], "e": ["This is a later, more detailed step in the systematic approach.", "", "This is a later step, generally performed after establishing the basic rate and rhythm.", "Axis determination is typically one of the later steps in a systematic interpretation."], "r": "A systematic EKG interpretation begins with assessing rate and rhythm before proceeding to evaluate the P wave, PR interval, QRS complex, QT interval, ST segment, T waves, and axis.", "tip": "NCLEX Tip: Use a consistent systematic approach every time: Rate → Rhythm → P wave → PR interval → QRS → QT → ST segment → T wave → Axis."}, {"t": "mc", "q": "When placing limb leads for a 12-lead EKG, where should the white (RA) electrode be placed?", "o": ["Left arm", "Right arm", "Right leg", "Left leg"], "a": [1], "e": ["The left arm receives the black electrode.", "", "The right leg receives the green electrode.", "The left leg receives the red electrode."], "r": "The white electrode (RA) is placed on the right arm, following the standard U.S. color convention for limb lead placement.", "tip": "NCLEX Tip: Mnemonic — 'White on right, smoke (black) over fire (red), grass (green) under white' — helps recall limb lead colors and placement."}, {"t": "mc", "q": "Which precordial (chest) lead is placed at the 4th intercostal space, right sternal border?", "o": ["V1", "V2", "V4", "V6"], "a": [0], "e": ["", "V2 is placed at the 4th intercostal space, left sternal border.", "V4 is placed at the 5th intercostal space, midclavicular line.", "V6 is placed at the midaxillary line, horizontal to V4."], "r": "V1 is placed at the 4th intercostal space at the right sternal border and provides a septal view of the heart's electrical activity.", "tip": "NCLEX Tip: V1 and V2 = septal leads; V3 and V4 = anterior leads; V5 and V6 = lateral leads."}, {"t": "mc", "q": "A nurse is preparing a patient for a 12-lead EKG and notices a wavy, shaky baseline on the tracing. What is the most likely cause?", "o": ["The patient's skin was properly prepped", "The patient is talking or moving during the recording", "All electrodes are firmly attached", "There is no electrical interference nearby"], "a": [1], "e": ["Proper skin prep would reduce, not cause, artifact.", "", "Loose electrodes, not firmly attached ones, are typically the source of artifact.", "This describes the absence of a problem, not the cause of the artifact."], "r": "A wavy or shaky baseline (artifact) is commonly caused by patient movement or talking during the recording, or by loose electrode contact; the patient should be asked to remain still and quiet, and electrodes should be checked.", "tip": "NCLEX Tip: Artifact troubleshooting: wandering baseline → patient movement/loose leads; 60Hz interference → nearby electrical equipment/cords."}, {"t": "mc", "q": "Before placing EKG electrodes, which action best ensures good electrode-skin contact?", "o": ["Applying lotion to the skin first", "Wiping the skin with alcohol to remove oils and ensuring the skin is dry", "Leaving body hair and jewelry in place", "Placing electrodes over clothing"], "a": [1], "e": ["Lotion can actually interfere with electrode adhesion and conduction.", "", "Excess hair should be shaved if needed, and metal jewelry should be removed to prevent interference.", "Electrodes must be placed directly on skin, not over clothing, for an accurate tracing."], "r": "Proper skin prep includes shaving excess hair if needed, wiping with alcohol to remove oils and sweat, and ensuring skin is dry, which improves electrode adhesion and signal quality.", "tip": "NCLEX Tip: Good EKG tracings depend heavily on preparation — clean, dry skin and firmly attached electrodes prevent most artifact problems."}, {"t": "mc", "q": "A 12-lead EKG is most useful in detecting all of the following EXCEPT:", "o": ["Myocardial ischemia or infarction", "Dysrhythmias", "Electrolyte abnormalities", "Blood glucose levels"], "a": [3], "e": ["A 12-lead EKG is a primary tool for detecting ischemia/infarction.", "A 12-lead EKG is used to detect dysrhythmias such as atrial fibrillation and heart block.", "EKG changes can reflect electrolyte abnormalities such as hyperkalemia.", ""], "r": "A 12-lead EKG evaluates the heart's electrical activity and can reveal dysrhythmias, ischemia/infarction, electrolyte abnormalities, and conduction delays, but it does not measure blood glucose levels.", "tip": "NCLEX Tip: 'EXCEPT' questions test your ability to recognize the one option that does not belong — always re-read the stem carefully to identify what is being excluded."}, {"t": "sata", "q": "Which nursing actions are appropriate before obtaining a 12-lead EKG? Select all that apply.", "o": ["Position the patient supine with arms relaxed at the sides", "Ask the patient to hold their breath throughout the entire recording", "Remove metal jewelry such as necklaces and watches", "Explain the procedure to the patient before beginning", "Ensure the patient continues talking throughout the procedure to stay calm"], "a": [0, 2, 3], "e": ["", "Patients should breathe normally and remain still and quiet, not hold their breath throughout the entire recording.", "", "", "Talking during the procedure can introduce artifact into the tracing and should be avoided."], "r": "Proper preparation for a 12-lead EKG includes positioning the patient supine with arms relaxed, removing metal objects that could interfere with the tracing, and explaining the procedure, while asking the patient to remain still and quiet (not talking) during the actual recording.", "tip": "NCLEX Tip: Minimizing patient movement and talking during the recording reduces artifact and produces a clearer, more diagnostic tracing."}, {"t": "mc", "q": "Which of the following best describes normal sinus rhythm (NSR)?", "o": ["Heart rate 60-100 bpm, regular rhythm, P wave before every QRS", "Heart rate 40-60 bpm, irregular rhythm, absent P waves", "Heart rate over 150 bpm, regular rhythm, narrow QRS", "Heart rate 60-100 bpm, irregularly irregular rhythm"], "a": [0], "e": ["", "This describes sinus bradycardia with an atypical rhythm description; NSR is regular with P waves present.", "This describes a tachyarrhythmia such as SVT, not NSR.", "NSR is regular, not irregularly irregular; irregularly irregular describes AFib."], "r": "Normal sinus rhythm is characterized by a regular rhythm, a heart rate of 60-100 bpm, and a P wave with consistent, upright morphology preceding every QRS complex.", "tip": "NCLEX Tip: NSR requires all criteria to be met: rate 60-100, regular rhythm, P wave before every QRS, normal PR interval and QRS duration."}, {"t": "mc", "q": "A patient's EKG shows a heart rate of 48 bpm, with a regular rhythm and a normal P wave before each QRS. This rhythm is best identified as:", "o": ["Sinus tachycardia", "Sinus bradycardia", "Atrial fibrillation", "Third-degree heart block"], "a": [1], "e": ["Sinus tachycardia is defined by a rate over 100 bpm, which is not the case here.", "", "AFib is characterized by an irregularly irregular rhythm and absent P waves, not present here.", "Third-degree heart block shows dissociation between P waves and QRS complexes, which is not described here."], "r": "Sinus bradycardia is a sinus rhythm (regular, normal P waves) with a heart rate below 60 bpm; a rate of 48 bpm with an otherwise normal sinus pattern fits this description.", "tip": "NCLEX Tip: Sinus bradycardia = normal P-QRS-T pattern but rate <60 bpm; assess for symptoms (dizziness, hypotension) to determine if intervention is needed."}, {"t": "mc", "q": "Sinus tachycardia is defined as a normal sinus rhythm with a heart rate:", "o": ["Below 60 bpm", "Between 60-100 bpm", "Over 100 bpm", "Over 250 bpm"], "a": [2], "e": ["This describes sinus bradycardia.", "This describes normal sinus rhythm.", "", "This rate range is more consistent with atrial flutter or SVT, not typical sinus tachycardia."], "r": "Sinus tachycardia is a normal sinus rhythm pattern with a heart rate greater than 100 bpm, often triggered by exercise, fever, pain, anxiety, or other physiologic stressors.", "tip": "NCLEX Tip: Sinus tachycardia is usually a response to an underlying cause (fever, pain, hypovolemia) — treat the cause, not just the rate."}, {"t": "mc", "q": "Sinus arrhythmia, a rhythm variation commonly caused by respiration, is characterized by:", "o": ["A completely regular rhythm with no variation", "A rhythm that looks generally normal but has slight irregularities often correlating with the respiratory cycle", "Absent P waves", "A rate consistently over 150 bpm"], "a": [1], "e": ["Sinus arrhythmia by definition has some irregularity, unlike a perfectly regular rhythm.", "", "P waves are present and normal in sinus arrhythmia.", "Sinus arrhythmia does not involve a markedly elevated heart rate."], "r": "Sinus arrhythmia appears largely normal on EKG but has slight irregularities in rhythm, often related to respiration (rate increasing with inspiration and decreasing with expiration), and is frequently a normal variant, especially in younger patients.", "tip": "NCLEX Tip: Sinus arrhythmia tied to the respiratory cycle is usually a benign, normal finding, especially in children and young adults."}, {"t": "mc", "q": "The classic hallmark of atrial fibrillation on an EKG is:", "o": ["A sawtooth pattern of flutter waves", "Absent P waves with an irregularly irregular rhythm", "A regular, narrow-complex tachycardia", "A widened QRS with a compensatory pause"], "a": [1], "e": ["A sawtooth pattern describes atrial flutter, not atrial fibrillation.", "", "This description fits SVT, not atrial fibrillation.", "This describes a PVC, not atrial fibrillation."], "r": "Atrial fibrillation is characterized by the absence of distinct P waves and an irregularly irregular ventricular rhythm due to chaotic atrial electrical activity.", "tip": "NCLEX Tip: 'Irregularly irregular' + 'no P waves' = classic pairing for AFib on the exam."}, {"t": "mc", "q": "Atrial flutter is classically described on EKG as having:", "o": ["Sawtooth-shaped flutter waves", "Absent P waves with irregular rhythm", "A wide, bizarre QRS complex", "No identifiable rhythm at all"], "a": [0], "e": ["", "This describes atrial fibrillation, not atrial flutter.", "This describes a ventricular rhythm such as VT, not atrial flutter.", "Atrial flutter has an identifiable, often regular pattern, unlike a completely chaotic rhythm."], "r": "Atrial flutter is characterized by a distinctive sawtooth pattern of flutter waves on EKG, with an atrial rate of 250-350 bpm and a rhythm that may be regular or show variable conduction.", "tip": "NCLEX Tip: Sawtooth pattern = atrial flutter; irregularly irregular with no P waves = atrial fibrillation."}, {"t": "mc", "q": "A patient develops a sudden onset of a narrow-complex tachycardia with a regular rhythm and a heart rate of 180 bpm; P waves are not visible. This is most consistent with:", "o": ["Supraventricular tachycardia (SVT)", "Ventricular tachycardia", "Atrial fibrillation", "Third-degree heart block"], "a": [0], "e": ["", "Ventricular tachycardia typically presents with a wide QRS complex, not narrow.", "AFib has an irregularly irregular rhythm, not a regular one.", "Third-degree heart block does not typically present as a fast, narrow-complex tachycardia."], "r": "SVT presents as a rapid, regular, narrow-complex rhythm (typically 150-250 bpm) with P waves often hidden within the preceding T wave.", "tip": "NCLEX Tip: SVT = fast + regular + narrow QRS; this combination should immediately bring SVT to mind."}, {"t": "sata", "q": "Which features are consistent with atrial fibrillation? Select all that apply.", "o": ["Irregularly irregular ventricular rhythm", "Distinct, uniform P waves before every QRS", "Variable ventricular rate", "Atrial rate typically greater than 300 bpm", "Narrow, regular QRS complexes at a fixed interval"], "a": [0, 2, 3], "e": ["", "Distinct P waves are absent in atrial fibrillation, not present before every QRS.", "", "", "QRS complexes occur at irregular, not fixed, intervals in atrial fibrillation, although QRS width is usually normal."], "r": "Atrial fibrillation is characterized by chaotic atrial activity (atrial rate often >300 bpm), absence of distinct P waves, and an irregularly irregular ventricular rhythm with a variable ventricular rate.", "tip": "NCLEX Tip: On SATA rhythm questions, evaluate each feature (P waves, rhythm regularity, rate, QRS width) individually against the rhythm's known criteria."}, {"t": "mc", "q": "Premature atrial complexes (PACs) are best distinguished from premature ventricular complexes (PVCs) by which feature?", "o": ["PACs have a wide, bizarre QRS complex; PVCs have a normal QRS", "PACs have an early, abnormally shaped P wave with a normal QRS; PVCs lack a P wave and have a wide QRS", "PACs always require immediate defibrillation", "PVCs are always considered a normal variant"], "a": [1], "e": ["This description is reversed; PACs have a normal QRS, and PVCs have the wide, bizarre QRS.", "", "PACs are typically benign and do not require defibrillation.", "PVCs can be benign but may also signal underlying pathology and should be monitored, especially if frequent."], "r": "PACs originate in the atria and show an early, abnormally shaped P wave with a normal (narrow) QRS complex, while PVCs originate in the ventricles, lack a preceding P wave, and have a wide (>0.12 sec), bizarre QRS complex.", "tip": "NCLEX Tip: 'P wave present = atrial problem (PAC); wide QRS with no P wave = ventricle problem (PVC).'"}, {"t": "mc", "q": "A PVC is typically followed by:", "o": ["No pause at all", "A compensatory pause (a longer gap before the next normal beat)", "Immediate onset of ventricular fibrillation", "A shortened PR interval on the following beat"], "a": [1], "e": ["PACs typically have no full compensatory pause; PVCs usually do.", "", "A single PVC does not necessarily lead to VFib.", "This is not a defining feature of a PVC."], "r": "PVCs are typically followed by a compensatory pause — a longer-than-normal gap before the next sinus beat occurs, as opposed to the incomplete pause typically seen after a PAC.", "tip": "NCLEX Tip: Compensatory (full) pause after PVC vs. no full pause after PAC is a classic differentiating detail on exams."}, {"t": "mc", "q": "A patient's monitor shows a rapid, regular, wide-complex rhythm with a rate of 180 bpm and no identifiable P waves. The patient is unresponsive and pulseless. The nurse should recognize this rhythm as:", "o": ["Sinus tachycardia", "Ventricular tachycardia requiring immediate defibrillation (pulseless)", "Atrial flutter", "First-degree heart block"], "a": [1], "e": ["Sinus tachycardia has a narrow QRS with visible P waves, unlike this presentation.", "", "Atrial flutter shows a sawtooth pattern and typically a narrower QRS.", "First-degree heart block simply shows a prolonged PR interval, not this life-threatening rhythm."], "r": "Pulseless ventricular tachycardia is a shockable, life-threatening rhythm requiring immediate defibrillation and CPR according to ACLS protocols.", "tip": "NCLEX Tip: Pulseless VT is treated exactly like ventricular fibrillation — both are shockable rhythms requiring immediate defibrillation."}, {"t": "mc", "q": "Ventricular fibrillation on EKG appears as:", "o": ["A clear P-QRS-T pattern with a fast rate", "A chaotic, irregular waveform with no identifiable P waves, QRS complexes, or organized rhythm", "A flat line", "A sawtooth pattern"], "a": [1], "e": ["VFib has no organized P-QRS-T pattern at all.", "", "A flat line describes asystole, not VFib.", "A sawtooth pattern describes atrial flutter."], "r": "Ventricular fibrillation presents as a chaotic, irregular waveform without identifiable P waves, QRS complexes, or any organized electrical activity, and results in no cardiac output.", "tip": "NCLEX Tip: VFib = totally chaotic, no organized rhythm, no pulse, no cardiac output — always a shockable, cardiac arrest rhythm."}, {"t": "mc", "q": "Which is the priority intervention for a patient found in ventricular fibrillation?", "o": ["Administer oral antiarrhythmic medication and reassess in 30 minutes", "Initiate CPR and defibrillation as soon as possible", "Perform a 12-lead EKG before any other intervention", "Elevate the head of the bed and apply oxygen only"], "a": [1], "e": ["Oral medications are not appropriate in a cardiac arrest situation requiring immediate action.", "", "While useful diagnostically, obtaining a 12-lead EKG should not delay life-saving defibrillation and CPR in VFib.", "This intervention alone is inadequate for a pulseless, life-threatening rhythm."], "r": "Ventricular fibrillation is a cardiac arrest rhythm requiring immediate initiation of CPR and defibrillation, per ACLS protocols, to restore an organized, perfusing rhythm.", "tip": "NCLEX Tip: Shockable rhythms (VFib, pulseless VT) = defibrillate immediately; non-shockable rhythms (asystole, PEA) = CPR + epinephrine, no shock."}, {"t": "mc", "q": "Asystole on a cardiac monitor should always be confirmed by:", "o": ["Checking only one lead before calling it", "Checking in at least two different leads to rule out equipment malfunction", "Assuming it is accurate without further verification", "Immediately defibrillating the patient"], "a": [1], "e": ["Relying on a single lead risks missing a lead-disconnection artifact that could mimic asystole.", "", "Asystole must always be verified due to the risk of a falsely flat tracing from a disconnected lead.", "Asystole is a non-shockable rhythm; defibrillation is not indicated."], "r": "Asystole should always be confirmed in at least two leads to rule out a technical or equipment error before proceeding with resuscitation efforts specific to a true flatline.", "tip": "NCLEX Tip: Asystole is a non-shockable rhythm — treatment is high-quality CPR and epinephrine, never defibrillation."}, {"t": "mc", "q": "Which of the following is classified as a non-shockable rhythm?", "o": ["Ventricular fibrillation", "Pulseless ventricular tachycardia", "Pulseless electrical activity (PEA)", "Torsades de pointes with no pulse"], "a": [2], "e": ["VFib is a shockable rhythm.", "Pulseless VT is a shockable rhythm.", "", "Pulseless torsades/VT-type rhythms are generally treated as shockable."], "r": "Pulseless electrical activity (PEA) and asystole are non-shockable rhythms; management focuses on high-quality CPR, epinephrine, and identifying/treating the underlying reversible cause (the H's and T's).", "tip": "NCLEX Tip: Shockable = VFib, pulseless VT. Non-shockable = asystole, PEA. Know this distinction cold for ACLS-related NCLEX questions."}, {"t": "mc", "q": "A prolonged PR interval greater than 0.20 seconds, with every P wave followed by a QRS complex, is characteristic of:", "o": ["First-degree heart block", "Second-degree heart block, Type I (Wenckebach)", "Second-degree heart block, Type II", "Third-degree heart block"], "a": [0], "e": ["", "Type I shows progressive PR lengthening until a beat is dropped, not a fixe
